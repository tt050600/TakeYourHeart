<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Take Your Heart</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body, html { width: 100%; height: 100%; background-color: #0b0b0b; font-family: 'Impact', 'Arial Black', sans-serif; overflow: hidden; }

/* 第一幕：點擊解鎖介面（純粹 P5 經典紅黑風） */
#startScreen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-color: #0d0d0d; display: flex; flex-direction: column;
    justify-content: center; align-items: center; z-index: 100; cursor: pointer;
}

/* P5 經典怪盜團面具圖標 */
.phantom-logo {
    width: 120px; height: 70px; background: #dc0000; position: relative;
    clip-path: polygon(0% 20%, 25% 0%, 50% 40%, 75% 0%, 100% 20%, 85% 90%, 50% 100%, 15% 90%);
    box-shadow: 0 0 40px rgba(220, 0, 0, 0.6); animation: pulse 1.5s infinite;
}
.phantom-logo::before, .phantom-logo::after {
    content: ''; position: absolute; background: #0d0d0d; width: 25px; height: 15px; border-radius: 50%; top: 30px;
}
.phantom-logo::before { left: 15px; transform: rotate(15deg); }
.phantom-logo::after { right: 15px; transform: rotate(-15deg); }

/* P5 標誌性不規則撕裂字體風格 */
.p5-box {
    margin-top: 40px; background: #fff; color: #000; padding: 10px 25px; font-size: 32px; font-weight: 900;
    letter-spacing: 2px; transform: rotate(-4deg) skewX(-10deg); box-shadow: 8px 8px 0 #dc0000; border: 3px solid #000;
}
.p5-box span { display: inline-block; background: #000; color: #fff; padding: 2px 8px; margin: 0 2px; transform: rotate(6deg); }
.sub-txt { margin-top: 35px; color: #dc0000; font-size: 13px; font-weight: bold; letter-spacing: 4px; text-transform: uppercase; animation: blink 1.2s infinite; }

/* 第二幕：預告信展示介面 */
#letterScreen { display: none; width: 100%; height: 100%; background: #0b0b0b; justify-content: center; align-items: center; position: relative; }
#letterScreen img { width: 100%; height: 100%; object-fit: contain; padding: 8px; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

/* 轉場特效 */
#flashOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 99; animation: flashEffect 0.4s ease-out; }

@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
@keyframes popIn { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes flashEffect { 0% { background: #fff; opacity: 1; } 25% { background: #dc0000; opacity: 1; } 50% { background: #fff; opacity: 1; } 75% { background: #000; opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
    <audio id="audio" src="music.mp3" loop></audio>
    <div id="startScreen" onclick="launchPhantom()">
        <div class="phantom-logo"></div>
        <div class="p5-box">TAKE <span>YOUR</span> HEART</div>
        <div class="sub-txt">CLICK TO OPEN THE ALERT LETTER</div>
    </div>
    <div id="flashOverlay"></div>
    <div id="letterScreen"><img src="cover.png" alt="預告信"></div>
    <script>
    function launchPhantom() {
        const audio = document.getElementById('audio');
        const startScreen = document.getElementById('startScreen');
        const flashOverlay = document.getElementById('flashOverlay');
        const letterScreen = document.getElementById('letterScreen');
        audio.play().catch(e => { alert('播放失败，请确认 music.mp3 是否在同个文件夹。'); });
        flashOverlay.style.display = 'block';
        setTimeout(() => { startScreen.style.display = 'none'; letterScreen.style.display = 'flex'; }, 150);
        setTimeout(() => { flashOverlay.style.none; flashOverlay.style.display = 'none'; }, 400);
    }
    </script>
</body>
</html>
</html>
