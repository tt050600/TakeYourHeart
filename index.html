<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>TAKE YOUR HEART</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    user-select: none;
}


/* =========================================================
   START SCREEN
========================================================= */

#startScreen {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        radial-gradient(
            circle at center,
            #171717 0%,
            #080808 45%,
            #000 100%
        );

    cursor: pointer;

    overflow: hidden;
}


/* subtle background slash */

#startScreen::before {

    content: "";

    position: absolute;

    width: 150%;

    height: 120px;

    background: #d00000;

    transform:
        rotate(-18deg)
        translateY(-180px);

    opacity: 0.12;
}


/* second slash */

#startScreen::after {

    content: "";

    position: absolute;

    width: 150%;

    height: 40px;

    background: #fff;

    transform:
        rotate(-18deg)
        translateY(210px);

    opacity: 0.05;
}


.start-content {

    position: relative;

    z-index: 10;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    animation:
        startAppear
        0.8s
        ease-out;
}


/* =========================================================
   JOKER MASK
========================================================= */

.joker-mask {

    width: 180px;

    max-width: 45vw;

    margin-bottom: 28px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 0 18px
            rgba(255,255,255,0.12)
        );

    animation:
        maskFloat
        3s
        ease-in-out
        infinite;
}


/* =========================================================
   TAKE YOUR HEART LOGO
========================================================= */

.p5-box {

    position: relative;

    display: inline-block;

    padding: 8px 20px;

    background: #fff;

    color: #000;

    font-family:
        Impact,
        Haettenschweiler,
        "Arial Black",
        sans-serif;

    font-size:
        clamp(34px, 7vw, 72px);

    font-weight: 900;

    font-style: italic;

    line-height: 0.95;

    letter-spacing: -3px;

    transform:
        skew(-8deg);

    box-shadow:
        9px 9px 0 #d00000;

    text-shadow:
        2px 2px 0 #fff;

    animation:
        logoEnter
        0.8s
        ease-out;
}


.p5-box span {

    color: #d00000;

}


/* little black offset */

.p5-box::before {

    content: "";

    position: absolute;

    left: -8px;

    top: 7px;

    width: 100%;

    height: 100%;

    background: #000;

    z-index: -1;

}


/* =========================================================
   CLICK TO OPEN
========================================================= */

.sub-txt {

    position: relative;

    margin-top: 27px;

    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 11px;

    font-weight: 900;

    letter-spacing: 4px;

    text-align: center;

    white-space: nowrap;

    animation:
        blink
        1.2s
        infinite;
}


.sub-txt::before {

    content: "///";

    color: #d00000;

    margin-right: 9px;

}


.sub-txt::after {

    content: "///";

    color: #d00000;

    margin-left: 9px;

}


/* =========================================================
   ARROW
========================================================= */

.click-arrow {

    margin-top: 15px;

    color: #fff;

    font-size: 18px;

    font-weight: 900;

    animation:
        arrowMove
        1s
        infinite;
}


/* =========================================================
   MAIN CANVAS
========================================================= */

#canvasContainer {

    position: fixed;

    inset: 0;

    z-index: 1;

    display: none;

    overflow: hidden;

    background:
        #b00000;
}


/* =========================================================
   GIANT P5 WORDS
========================================================= */

.p5-word {

    position: absolute;

    z-index: 2;

    color: #000;

    font-family:
        Impact,
        Haettenschweiler,
        "Arial Black",
        sans-serif;

    font-size:
        clamp(80px, 18vw, 260px);

    font-weight: 900;

    font-style: italic;

    line-height: 0.8;

    white-space: nowrap;

    opacity: 0.10;

    pointer-events: none;

    transform: rotate(-8deg);

}


.word-1 {

    top: 3%;

    left: -4%;
}


.word-2 {

    top: 38%;

    right: -8%;

    transform:
        rotate(-8deg)
        scale(1.1);
}


.word-3 {

    bottom: 3%;

    left: 4%;

    font-size:
        clamp(60px, 14vw, 200px);

}


.word-4 {

    top: 20%;

    left: 15%;

    color: #fff;

    opacity: 0.07;

    font-size:
        clamp(40px, 9vw, 130px);

    transform:
        rotate(-8deg);
}


/* =========================================================
   SLASH BLOCKS
========================================================= */

.p5-slash {

    position: absolute;

    z-index: 3;

    pointer-events: none;

    transform: rotate(-14deg);

}


.slash-black {

    width: 120%;

    height: 45px;

    left: -10%;

    top: 17%;

    background: #000;

    opacity: 0.95;
}


.slash-white {

    width: 120%;

    height: 18px;

    left: -10%;

    top: 21%;

    background: #fff;

    opacity: 0.95;
}


.slash-red {

    width: 120%;

    height: 75px;

    left: -10%;

    bottom: 18%;

    background: #d00000;

    opacity: 0.95;
}


/* =========================================================
   SPEED LINES
========================================================= */

.speed-line {

    position: absolute;

    z-index: 4;

    height: 5px;

    background: #fff;

    opacity: 0.65;

    transform:
        rotate(-14deg);

    pointer-events: none;

    animation:
        speedMove
        linear
        infinite;
}


.speed-line:nth-child(1) {

    width: 260px;

    top: 12%;

    left: -300px;

    animation-duration: 1.3s;
}


.speed-line:nth-child(2) {

    width: 430px;

    top: 28%;

    left: -500px;

    animation-duration: 1.7s;
}


.speed-line:nth-child(3) {

    width: 180px;

    top: 65%;

    left: -220px;

    animation-duration: 1.1s;
}


.speed-line:nth-child(4) {

    width: 500px;

    top: 83%;

    left: -600px;

    animation-duration: 1.8s;
}


/* =========================================================
   CALLING CARD CONTAINER
========================================================= */

#cardContainer {

    position: absolute;

    inset: 0;

    z-index: 20;

    overflow: hidden;

    pointer-events: none;
}


/* =========================================================
   CALLING CARDS
========================================================= */

.calling-card {

    position: absolute;

    width: 70px;

    height: auto;

    object-fit: contain;

    pointer-events: none;

    will-change:
        transform,
        top;

    animation:
        p5GlobalFall
        linear
        infinite;
}


/* FAR */

.calling-card.far {

    opacity: 0.35;

    filter:
        blur(1px);

    z-index: 1;
}


/* NORMAL */

.calling-card.mid {

    opacity: 0.75;

    z-index: 10;
}


/* FRONT */

.calling-card.front {

    opacity: 0.95;

    filter:
        drop-shadow(
            0 5px 5px
            rgba(0,0,0,0.35)
        );

    z-index: 30;
}


/* =========================================================
   CENTRAL VIDEO
========================================================= */

#videoContainer {

    position: fixed;

    inset: 0;

    z-index: 999;

    display: none;

    justify-content: center;

    align-items: center;

    overflow: hidden;

    pointer-events: none;
}


#bgVideo {

    position: absolute;

    width: 100%;

    height: 100%;

    object-fit: cover;

    z-index: 999;

    pointer-events: none;
}


/* dark overlay */

#videoContainer::after {

    content: "";

    position: absolute;

    inset: 0;

    z-index: 1000;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,0.15),
            transparent 50%,
            rgba(0,0,0,0.15)
        );

    pointer-events: none;
}


/* =========================================================
   PAPER FRAGMENTS
========================================================= */

.paper-fragment {

    position: absolute;

    z-index: 50;

    background: #fff;

    pointer-events: none;

    transform:
        rotate(-15deg);

    opacity: 0.85;

    animation:
        fragmentMove
        linear
        infinite;
}


.paper-fragment.red {

    background: #d00000;

}


.paper-fragment.black {

    background: #000;

}


/* =========================================================
   PAPER STRIPS
========================================================= */

.paper-strip {

    position: absolute;

    z-index: 51;

    width: 200px;

    height: 22px;

    background: #fff;

    opacity: 0.8;

    transform:
        rotate(-12deg);

    pointer-events: none;

}


/* =========================================================
   FLASH
========================================================= */

#flashOverlay {

    position: fixed;

    inset: 0;

    z-index: 99999;

    background: #fff;

    opacity: 0;

    pointer-events: none;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes startAppear {

    from {

        opacity: 0;

        transform:
            scale(0.92);
    }

    to {

        opacity: 1;

        transform:
            scale(1);
    }

}


@keyframes logoEnter {

    from {

        opacity: 0;

        transform:
            skew(-8deg)
            translateX(-50px);
    }

    to {

        opacity: 1;

        transform:
            skew(-8deg)
            translateX(0);
    }

}


@keyframes maskFloat {

    0%,
    100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-8px);
    }

}


@keyframes blink {

    0%,
    100% {

        opacity: 1;
    }

    50% {

        opacity: 0.35;
    }

}


@keyframes arrowMove {

    0%,
    100% {

        transform:
            translateY(0);

        opacity: 1;
    }

    50% {

        transform:
            translateY(7px);

        opacity: 0.45;
    }

}


@keyframes speedMove {

    from {

        transform:
            translateX(0)
            rotate(-14deg);
    }

    to {

        transform:
            translateX(150vw)
            rotate(-14deg);
    }

}


@keyframes fragmentMove {

    from {

        transform:
            translateY(-20vh)
            rotate(-20deg);
    }

    to {

        transform:
            translateY(120vh)
            rotate(160deg);
    }

}


@keyframes p5GlobalFall {

    from {

        transform:
            translateY(-160px)
            rotate(0deg);
    }

    to {

        transform:
            translateY(115vh)
            rotate(360deg);
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .joker-mask {

        width: 140px;

        margin-bottom: 22px;
    }


    .p5-box {

        font-size: 30px;

        padding: 7px 14px;

        letter-spacing: -2px;

        box-shadow:
            6px 6px 0 #d00000;
    }


    .sub-txt {

        font-size: 8px;

        letter-spacing: 2.5px;

        margin-top: 22px;
    }


    .sub-txt::before {

        margin-right: 5px;
    }


    .sub-txt::after {

        margin-left: 5px;
    }


    .calling-card {

        width: 50px;
    }

}


/* =========================================================
   RED FLASH CLASS
========================================================= */

.flash-red {

    animation:
        redFlash
        0.55s
        ease-out;
}


@keyframes redFlash {

    0% {

        opacity: 1;

        background: #fff;
    }

    30% {

        opacity: 1;

        background: #d00000;
    }

    60% {

        opacity: 0.8;

        background: #000;
    }

    100% {

        opacity: 0;

        background: transparent;
    }

}

</style>
</head>


<body>


<!-- =======================================================
     MUSIC
======================================================= -->

<audio
    id="audio"
    src="music.mp3"
    loop
    preload="auto">
</audio>


<!-- =======================================================
     OPENING SCREEN
======================================================= -->

<div id="startScreen">

    <div class="start-content">

        <img
            src="joker-mask.png"
            class="joker-mask"
            alt="Joker">

        <div class="p5-box">
            TAKE <span>YOUR</span> HEART
        </div>

        <!-- 这句就是你要保留的原始提示 -->
        <div class="sub-txt">
            /// CLICK TO OPEN THE CALLING CARD ///
        </div>

        <div class="click-arrow">
            ▼
        </div>

    </div>

</div>


<!-- =======================================================
     FLASH
======================================================= -->

<div id="flashOverlay"></div>


<!-- =======================================================
     MAIN BACKGROUND
======================================================= -->

<div id="canvasContainer">


    <!-- GIANT WORDS -->

    <div class="p5-word word-1">
        PHANTOM
    </div>

    <div class="p5-word word-2">
        NOTICE
    </div>

    <div class="p5-word word-3">
        TRUTH
    </div>

    <div class="p5-word word-4">
        TAKE YOUR HEART
    </div>


    <!-- SLASHES -->

    <div class="p5-slash slash-black"></div>

    <div class="p5-slash slash-white"></div>

    <div class="p5-slash slash-red"></div>


    <!-- SPEED LINES -->

    <div class="speed-line"></div>

    <div class="speed-line"></div>

    <div class="speed-line"></div>

    <div class="speed-line"></div>


    <!-- CALLING CARDS -->

    <div id="cardContainer"></div>


    <!-- PAPER FRAGMENTS -->

    <div
        class="paper-fragment"
        style="
            width:70px;
            height:18px;
            left:12%;
            top:-10%;
            animation-duration:4s;
        ">
    </div>

    <div
        class="paper-fragment red"
        style="
            width:45px;
            height:12px;
            left:45%;
            top:-20%;
            animation-duration:3.5s;
        ">
    </div>

    <div
        class="paper-fragment black"
        style="
            width:90px;
            height:16px;
            left:75%;
            top:-15%;
            animation-duration:5s;
        ">
    </div>


    <!-- PAPER STRIPS -->

    <div
        class="paper-strip"
        style="
            left:-30px;
            top:32%;
            transform:rotate(-17deg);
        ">
    </div>

    <div
        class="paper-strip"
        style="
            right:-80px;
            top:71%;
            transform:rotate(-17deg);
        ">
    </div>


</div>


<!-- =======================================================
     VIDEO
======================================================= -->

<div id="videoContainer">

    <video
        id="bgVideo"
        src="bg-animation.mp4"
        muted
        loop
        playsinline
        preload="auto">
    </video>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const startScreen =
    document.getElementById("startScreen");

const canvasContainer =
    document.getElementById("canvasContainer");

const videoContainer =
    document.getElementById("videoContainer");

const video =
    document.getElementById("bgVideo");

const audio =
    document.getElementById("audio");

const flashOverlay =
    document.getElementById("flashOverlay");

const cardContainer =
    document.getElementById("cardContainer");


/* =========================================================
   CARD CREATION
========================================================= */

function createCard() {

    const card =
        document.createElement("img");

    card.src = "cover.png";

    card.className =
        "calling-card";


    /* depth */

    const depth =
        Math.random();

    if (depth < 0.28) {

        card.classList.add("far");

    } else if (depth < 0.78) {

        card.classList.add("mid");

    } else {

        card.classList.add("front");

    }


    /* size */

    let size;

    if (card.classList.contains("far")) {

        size =
            30 +
            Math.random() * 30;

    } else if (
        card.classList.contains("front")
    ) {

        size =
            60 +
            Math.random() * 45;

    } else {

        size =
            40 +
            Math.random() * 40;
    }


    card.style.width =
        size + "px";


    /* position */

    card.style.left =
        Math.random() * 100 + "%";


    /* initial position */

    card.style.top =
        (-10 -
         Math.random() * 100) + "vh";


    /* rotation */

    const rotate =
        -35 +
        Math.random() * 70;


    /* duration */

    const duration =
        3 +
        Math.random() * 5;


    card.style.animationDuration =
        duration + "s";


    card.style.animationDelay =
        (-Math.random() * duration) + "s";


    card.style.transform =
        "rotate(" + rotate + "deg)";


    card.style.opacity =
        0.3 +
        Math.random() * 0.7;


    cardContainer.appendChild(card);


    /* remove */

    setTimeout(
        () => {

            if (card.parentNode) {

                card.remove();

            }

        },

        (duration + 2) * 1000
    );

}


/* =========================================================
   INITIAL CARD WALL
========================================================= */

function createInitialCards() {

    const amount =
        window.innerWidth < 600
            ? 100
            : 220;


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        createCard();

    }

}


/* =========================================================
   CARD SUPPLEMENT
========================================================= */

let cardInterval = null;


function startCardRain() {

    if (cardInterval) {

        clearInterval(cardInterval);

    }


    cardInterval =
        setInterval(
            () => {

                if (
                    cardContainer.children.length
                    < 300
                ) {

                    createCard();

                }

            },
            100
        );

}


/* =========================================================
   FLASH EFFECT
========================================================= */

function playFlash() {

    flashOverlay.classList.remove(
        "flash-red"
    );


    /* force reflow */

    void flashOverlay.offsetWidth;


    flashOverlay.classList.add(
        "flash-red"
    );

}


/* =========================================================
   LAUNCH
========================================================= */

let launched = false;


function launchPhantom() {

    if (launched) {

        return;

    }

    launched = true;


    /* music */

    audio.volume = 0.85;

    audio.play().catch(
        () => {}
    );


    /* video */

    videoContainer.style.display =
        "flex";

    video.play().catch(
        () => {}
    );


    /* background */

    canvasContainer.style.display =
        "block";


    /* cards */

    createInitialCards();

    startCardRain();


    /* flash */

    playFlash();


    /* hide opening */

    setTimeout(
        () => {

            startScreen.style.opacity =
                "0";

            startScreen.style.pointerEvents =
                "none";

            startScreen.style.transition =
                "opacity 0.35s ease";

        },
        180
    );


    /* completely hide */

    setTimeout(
        () => {

            startScreen.style.display =
                "none";

        },
        600
    );

}


/* =========================================================
   CLICK
========================================================= */

/*
   整個開場頁面都可以點。
   所以不管你點 Logo、
   點文字、
   點黑色背景，
   都會打開 Calling Card。
*/

startScreen.addEventListener(
    "click",
    launchPhantom
);


/* =========================================================
   TOUCH
========================================================= */

startScreen.addEventListener(
    "touchend",
    function () {

        launchPhantom();

    },
    {
        passive: true
    }
);


/* =========================================================
   PREVENT CONTEXT MENU
========================================================= */

document.addEventListener(
    "contextmenu",
    function (event) {

        event.preventDefault();

    }
);


/* =========================================================
   PRELOAD CALLING CARD
========================================================= */

const preloadCard =
    new Image();

preloadCard.src =
    "cover.png";


/* =========================================================
   PRELOAD VIDEO
========================================================= */

video.load();

</script>

</body>
</html>
