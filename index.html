<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no,
    viewport-fit=cover"
>

<title>Take Your Heart</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    position:relative;

    font-family:
        Impact,
        "Arial Black",
        Arial,
        sans-serif;
}

body{
    touch-action:manipulation;
}

/* =========================================================
   START SCREEN
========================================================= */

#startScreen{

    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:10000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    cursor:pointer;

    isolation:isolate;

    --logoX:0px;
    --logoY:0px;

    background:

        radial-gradient(
            circle at 50% 48%,
            rgba(150,0,0,.18) 0%,
            rgba(75,0,0,.12) 25%,
            rgba(18,5,5,.42) 44%,
            rgba(6,6,6,.94) 72%,
            #000 100%
        );
}

/* =========================================================
   START RED ENERGY
========================================================= */

#startScreen::before{

    content:"";

    position:absolute;

    left:50%;
    top:48%;

    width:min(900px,125vw);
    aspect-ratio:1;

    transform:
        translate(-50%,-50%);

    background:

        radial-gradient(
            circle,
            rgba(255,30,30,.15) 0%,
            rgba(220,0,0,.10) 27%,
            rgba(220,0,0,.035) 47%,
            transparent 68%
        );

    filter:blur(10px);

    pointer-events:none;

    z-index:-5;

    animation:
        centerPulse
        2.7s
        ease-in-out
        infinite;
}

@keyframes centerPulse{

    0%,
    100%{
        opacity:.55;

        transform:
            translate(-50%,-50%)
            scale(.91);
    }

    50%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.12);
    }
}

/* =========================================================
   CRT / PRINT TEXTURE
========================================================= */

#startScreen::after{

    content:"";

    position:absolute;
    inset:0;

    z-index:60;

    pointer-events:none;

    opacity:.52;

    mix-blend-mode:screen;

    background:

        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.022) 0,
            rgba(255,255,255,.022) 1px,
            transparent 1px,
            transparent 5px
        ),

        radial-gradient(
            circle at center,
            transparent 40%,
            rgba(0,0,0,.45) 100%
        );
}

/* =========================================================
   BIG BACKGROUND SLASHES
========================================================= */

.start-slash{

    position:absolute;

    pointer-events:none;

    z-index:3;

    transform:
        rotate(-12deg)
        skewX(-25deg);

    transform-origin:center;
}

.start-slash.one{

    width:145vw;
    height:34px;

    top:16%;
    left:-25%;

    background:#dc0000;

    opacity:.82;

    box-shadow:
        0 0 20px rgba(220,0,0,.40);

    animation:
        slashOne
        3.2s
        ease-in-out
        infinite;
}

.start-slash.two{

    width:105vw;
    height:9px;

    top:28%;
    right:-30%;

    background:#fff;

    opacity:.54;

    animation:
        slashTwo
        2.6s
        ease-in-out
        infinite;
}

.start-slash.three{

    width:130vw;
    height:12px;

    bottom:19%;
    left:-18%;

    background:#dc0000;

    opacity:.66;

    animation:
        slashThree
        3s
        ease-in-out
        infinite;
}

.start-slash.four{

    width:75vw;
    height:48px;

    bottom:27%;
    right:-18%;

    background:#050505;

    opacity:.92;

    box-shadow:
        0 0 0 2px rgba(255,255,255,.07);

    animation:
        slashFour
        3.8s
        ease-in-out
        infinite;
}

@keyframes slashOne{

    0%,
    100%{
        transform:
            translateX(-3vw)
            rotate(-12deg)
            skewX(-25deg);
    }

    50%{
        transform:
            translateX(5vw)
            rotate(-12deg)
            skewX(-25deg);
    }
}

@keyframes slashTwo{

    0%,
    100%{
        transform:
            translateX(0)
            rotate(-12deg)
            skewX(-25deg);

        opacity:.30;
    }

    50%{
        transform:
            translateX(-7vw)
            rotate(-12deg)
            skewX(-25deg);

        opacity:.78;
    }
}

@keyframes slashThree{

    0%,
    100%{
        transform:
            translateX(0)
            rotate(-12deg)
            skewX(-25deg);
    }

    50%{
        transform:
            translateX(-5vw)
            rotate(-12deg)
            skewX(-25deg);
    }
}

@keyframes slashFour{

    0%,
    100%{
        transform:
            translateX(0)
            rotate(-12deg)
            skewX(-25deg);
    }

    50%{
        transform:
            translateX(-4vw)
            rotate(-12deg)
            skewX(-25deg);
    }
}

/* =========================================================
   SMALL CUTS
========================================================= */

.start-cut{

    position:absolute;

    pointer-events:none;

    z-index:4;

    transform:
        rotate(-10deg)
        skewX(-28deg);
}

.start-cut.a{

    width:38vw;
    height:7px;

    left:-5vw;
    top:39%;

    background:#fff;

    opacity:.46;

    animation:
        cutMoveA
        2.2s
        ease-in-out
        infinite;
}

.start-cut.b{

    width:52vw;
    height:4px;

    right:-12vw;
    top:43%;

    background:#dc0000;

    opacity:.8;

    animation:
        cutMoveB
        1.8s
        ease-in-out
        infinite;
}

.start-cut.c{

    width:34vw;
    height:10px;

    left:2vw;
    bottom:38%;

    background:#000;

    opacity:.92;
}

.start-cut.d{

    width:48vw;
    height:5px;

    right:-8vw;
    bottom:42%;

    background:#fff;

    opacity:.32;
}

@keyframes cutMoveA{

    50%{
        transform:
            translateX(7vw)
            rotate(-10deg)
            skewX(-28deg);
    }
}

@keyframes cutMoveB{

    50%{
        transform:
            translateX(-6vw)
            rotate(-10deg)
            skewX(-28deg);
    }
}

/* =========================================================
   START P5 DECOR CONTAINER
========================================================= */

#startP5Decor{

    position:absolute;
    inset:0;

    z-index:1;

    overflow:hidden;

    pointer-events:none;
}

/* =========================================================
   HALFTONE AREAS
========================================================= */

.start-halftone{

    position:absolute;

    width:var(--size);
    height:var(--size);

    left:var(--x);
    top:var(--y);

    opacity:var(--o);

    transform:
        rotate(var(--r));

    background-image:

        radial-gradient(
            circle,
            var(--c) 0 2px,
            transparent 2.4px
        );

    background-size:
        11px 11px;

    -webkit-mask-image:
        radial-gradient(
            ellipse,
            #000 0 45%,
            transparent 72%
        );

    mask-image:
        radial-gradient(
            ellipse,
            #000 0 45%,
            transparent 72%
        );

    animation:
        halftoneDrift
        var(--d)
        ease-in-out
        infinite;
}

@keyframes halftoneDrift{

    0%,
    100%{
        translate:
            0
            0;
    }

    50%{
        translate:
            12px
            -8px;
    }
}

/* =========================================================
   HUGE P5 WORDS
========================================================= */

.start-p5-word{

    position:absolute;

    white-space:nowrap;

    user-select:none;

    font-family:
        Impact,
        "Arial Black",
        sans-serif;

    font-weight:900;

    line-height:.78;

    letter-spacing:1px;

    opacity:var(--opacity);

    transform:
        rotate(var(--rot));

    text-shadow:
        5px 5px 0 rgba(0,0,0,.42);

    animation:
        startWordFloat
        var(--dur)
        ease-in-out
        infinite;
}

.start-p5-word.red{
    color:#dc0000;
}

.start-p5-word.white{
    color:#fff;
}

.start-p5-word.black{
    color:#000;
}

.start-p5-word.outline{

    color:transparent;

    -webkit-text-stroke:
        2px rgba(255,255,255,.22);

    text-shadow:none;
}

@keyframes startWordFloat{

    0%,
    100%{
        transform:
            translateY(0)
            rotate(var(--rot));
    }

    50%{
        transform:
            translateY(-14px)
            rotate(var(--rot));
    }
}

/* =========================================================
   BURST STARS
========================================================= */

.start-burst{

    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--size);
    height:var(--size);

    opacity:var(--o);

    transform:
        rotate(var(--r));

    background:

        repeating-conic-gradient(
            from 0deg,
            var(--c) 0deg 7deg,
            transparent 7deg 17deg
        );

    -webkit-mask-image:

        radial-gradient(
            circle,
            transparent 0 18%,
            #000 19% 60%,
            transparent 61%
        );

    mask-image:

        radial-gradient(
            circle,
            transparent 0 18%,
            #000 19% 60%,
            transparent 61%
        );

    animation:
        burstSpin
        var(--d)
        linear
        infinite;
}

@keyframes burstSpin{

    to{
        transform:
            rotate(
                calc(
                    var(--r)
                    +
                    360deg
                )
            );
    }
}

/* =========================================================
   TARGET CIRCLES
========================================================= */

.start-target{

    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--size);
    height:var(--size);

    border-radius:50%;

    border:
        2px solid var(--c);

    opacity:var(--o);

    transform:
        rotate(var(--r));

    animation:
        targetPulse
        var(--d)
        ease-in-out
        infinite;
}

.start-target::before{

    content:"";

    position:absolute;

    inset:16%;

    border:
        1px solid var(--c);

    border-radius:50%;
}

.start-target::after{

    content:"";

    position:absolute;

    left:50%;
    top:-14%;

    width:2px;
    height:128%;

    background:var(--c);

    transform:
        translateX(-50%);
}

@keyframes targetPulse{

    0%,
    100%{
        scale:.92;
    }

    50%{
        scale:1.08;
    }
}

/* =========================================================
   X MARKS
========================================================= */

.start-x{

    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--size);
    height:var(--size);

    opacity:var(--o);

    transform:
        rotate(var(--r));

    animation:
        decorFloat
        var(--d)
        ease-in-out
        infinite;
}

.start-x::before,
.start-x::after{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:100%;
    height:12%;

    background:var(--c);

    box-shadow:
        2px 2px 0 rgba(0,0,0,.45);
}

.start-x::before{
    transform:
        translate(-50%,-50%)
        rotate(45deg);
}

.start-x::after{
    transform:
        translate(-50%,-50%)
        rotate(-45deg);
}

/* =========================================================
   DOT CLUSTER
========================================================= */

.start-dot-cluster{

    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--size);
    height:var(--size);

    opacity:var(--o);

    transform:
        rotate(var(--r));

    animation:
        decorFloat
        var(--d)
        ease-in-out
        infinite;
}

.start-dot{

    position:absolute;

    left:var(--left);
    top:var(--top);

    width:var(--dot);
    height:var(--dot);

    border-radius:50%;

    background:var(--c);

    box-shadow:
        1px 1px 0 rgba(0,0,0,.38);
}

/* =========================================================
   RED / BLACK / WHITE BLOCKS
========================================================= */

.start-block{

    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--w);
    height:var(--h);

    background:var(--c);

    opacity:var(--o);

    transform:
        rotate(var(--r))
        skewX(-25deg);

    box-shadow:
        4px 4px 0 rgba(0,0,0,.34);

    animation:
        blockShift
        var(--d)
        ease-in-out
        infinite;
}

@keyframes blockShift{

    0%,
    100%{
        translate:
            0
            0;
    }

    50%{
        translate:
            16px
            0;
    }
}

/* =========================================================
   INK
========================================================= */

.start-ink{

    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--size);
    height:calc(var(--size) * .72);

    background:var(--c);

    opacity:var(--o);

    border-radius:
        53% 47% 58% 42%
        /
        42% 55% 45% 58%;

    transform:
        rotate(var(--r));

    animation:
        startInkPulse
        var(--d)
        ease-in-out
        infinite;
}

.start-ink::before,
.start-ink::after{

    content:"";

    position:absolute;

    border-radius:50%;

    background:inherit;
}

.start-ink::before{

    width:32%;
    aspect-ratio:1;

    left:-13%;
    top:57%;
}

.start-ink::after{

    width:20%;
    aspect-ratio:1;

    right:-10%;
    top:-9%;
}

@keyframes startInkPulse{

    50%{
        transform:
            rotate(var(--r))
            scale(1.10);
    }
}

/* =========================================================
   FRAGMENTS
========================================================= */

.start-fragment{

    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--w);
    height:var(--h);

    background:var(--c);

    opacity:var(--o);

    transform:
        rotate(var(--r));

    clip-path:
        polygon(
            0 25%,
            100% 0,
            82% 100%,
            12% 78%
        );

    box-shadow:
        2px 2px 0 rgba(0,0,0,.4);

    animation:
        fragmentFloat
        var(--d)
        ease-in-out
        infinite;
}

@keyframes fragmentFloat{

    0%,
    100%{
        translate:
            0 0;

        rotate:0deg;
    }

    50%{
        translate:
            var(--dx)
            var(--dy);

        rotate:11deg;
    }
}

/* =========================================================
   SPEED LINES
========================================================= */

.start-speed{

    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--w);
    height:var(--h);

    background:var(--c);

    opacity:0;

    transform:
        rotate(var(--r));

    box-shadow:
        5px 0 8px rgba(255,255,255,.07);

    animation:
        startSpeedSweep
        var(--d)
        linear
        var(--delay)
        infinite;
}

@keyframes startSpeedSweep{

    0%{
        translate:
            -100px
            0;

        opacity:0;
    }

    12%{
        opacity:var(--o);
    }

    75%{
        opacity:var(--o);
    }

    100%{
        translate:
            180px
            0;

        opacity:0;
    }
}

/* =========================================================
   CHEVRONS
========================================================= */

.start-chevron{

    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--size);
    height:var(--size);

    opacity:var(--o);

    border-top:
        5px solid var(--c);

    border-right:
        5px solid var(--c);

    transform:
        rotate(45deg);

    animation:
        chevronMove
        var(--d)
        ease-in-out
        infinite;
}

@keyframes chevronMove{

    50%{
        translate:
            12px 0;

        opacity:
            calc(var(--o) * .55);
    }
}

/* =========================================================
   EXCLAMATION / SYMBOLS
========================================================= */

.start-symbol{

    position:absolute;

    left:var(--x);
    top:var(--y);

    color:var(--c);

    opacity:var(--o);

    font-size:var(--size);

    font-weight:900;

    transform:
        rotate(var(--r));

    text-shadow:
        4px 4px 0 rgba(0,0,0,.5);

    animation:
        symbolBounce
        var(--d)
        ease-in-out
        infinite;
}

@keyframes symbolBounce{

    50%{
        translate:
            0
            -12px;

        scale:1.12;
    }
}

/* =========================================================
   COMMON FLOAT
========================================================= */

@keyframes decorFloat{

    0%,
    100%{
        translate:
            0
            0;
    }

    50%{
        translate:
            0
            -10px;
    }
}

/* =========================================================
   LOGO AREA
========================================================= */

.royal-logo{

    position:relative;

    z-index:20;

    width:430px;
    max-width:85vw;

    margin-top:42px;

    user-select:none;

    translate:
        var(--logoX)
        var(--logoY);

    transform:
        rotate(-7deg)
        skewX(-8deg);

    filter:
        drop-shadow(9px 10px 0 #000)
        drop-shadow(13px 13px 0 #dc0000);

    animation:

        logoEntrance
        .9s
        cubic-bezier(.16,1,.3,1)
        both,

        logoFloat
        2.8s
        ease-in-out
        .9s
        infinite;
}

/* red print ghost */

.royal-logo::before{

    content:"";

    position:absolute;

    inset:-3px;

    background:
        url("take-your-heart.png")
        center / contain
        no-repeat;

    pointer-events:none;

    opacity:.27;

    transform:
        translate(5px,3px);

    mix-blend-mode:screen;

    z-index:-1;

    animation:
        printShiftRed
        1.7s
        steps(2,end)
        infinite;
}

/* black print ghost */

.royal-logo::after{

    content:"";

    position:absolute;

    inset:-3px;

    background:
        url("take-your-heart.png")
        center / contain
        no-repeat;

    pointer-events:none;

    opacity:.18;

    transform:
        translate(-4px,-3px);

    mix-blend-mode:multiply;

    z-index:-1;

    animation:
        printShiftBlack
        2s
        steps(2,end)
        infinite;
}

.take-your-heart-img{

    display:block;

    width:100%;
    height:auto;

    object-fit:contain;

    transform-origin:center;

    pointer-events:none;

    user-select:none;

    -webkit-user-drag:none;

    animation:

        heartFloat
        2.8s
        ease-in-out
        infinite,

        logoGlitch
        4.5s
        steps(1,end)
        infinite;
}

/* =========================================================
   LOGO GLINT
========================================================= */

.logo-glint{

    position:absolute;

    inset:-10%;

    z-index:8;

    pointer-events:none;

    opacity:0;

    background:

        linear-gradient(
            112deg,
            transparent 0 38%,
            rgba(255,255,255,.1) 43%,
            rgba(255,248,195,.92) 49%,
            rgba(255,255,255,.18) 54%,
            transparent 60%
        );

    background-size:
        250% 100%;

    -webkit-mask:
        url("take-your-heart.png")
        center / contain
        no-repeat;

    mask:
        url("take-your-heart.png")
        center / contain
        no-repeat;

    mix-blend-mode:screen;

    animation:
        logoGlint
        4.7s
        ease-in-out
        1.1s
        infinite;
}

@keyframes logoGlint{

    0%,
    64%{
        opacity:0;

        background-position:
            140% 0;
    }

    69%{
        opacity:1;
    }

    82%{
        opacity:.55;

        background-position:
            -50% 0;
    }

    88%,
    100%{
        opacity:0;

        background-position:
            -50% 0;
    }
}

/* =========================================================
   LOGO ENERGY RINGS
========================================================= */

.logo-ring{

    position:absolute;

    left:50%;
    top:50%;

    pointer-events:none;

    transform:
        translate(-50%,-50%)
        rotate(-7deg);

    border-radius:50%;

    border:
        1px solid rgba(220,0,0,.24);

    z-index:-2;
}

.logo-ring.one{

    width:480px;
    height:210px;

    animation:
        ringPulse
        2.8s
        ease-out
        infinite;
}

.logo-ring.two{

    width:545px;
    height:255px;

    border-color:
        rgba(255,255,255,.10);

    animation:
        ringPulse
        2.8s
        ease-out
        .8s
        infinite;
}

.logo-ring.three{

    width:610px;
    height:295px;

    border-color:
        rgba(220,0,0,.10);

    animation:
        ringPulse
        3.3s
        ease-out
        1.3s
        infinite;
}

@keyframes ringPulse{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            rotate(-7deg)
            scale(.82);
    }

    28%{
        opacity:.72;
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            rotate(-7deg)
            scale(1.18);
    }
}

/* =========================================================
   LOGO ANIMATIONS
========================================================= */

@keyframes logoEntrance{

    0%{
        opacity:0;

        transform:
            translateY(48px)
            scale(.70)
            rotate(-13deg)
            skewX(-12deg);
    }

    68%{
        opacity:1;

        transform:
            translateY(-7px)
            scale(1.07)
            rotate(-6deg)
            skewX(-8deg);
    }

    100%{
        opacity:1;

        transform:
            rotate(-7deg)
            skewX(-8deg);
    }
}

@keyframes logoFloat{

    0%,
    100%{
        transform:
            rotate(-7deg)
            skewX(-8deg)
            translateY(0);
    }

    50%{
        transform:
            rotate(-7deg)
            skewX(-8deg)
            translateY(-6px);
    }
}

@keyframes heartFloat{

    0%,
    100%{
        transform:
            translateY(0)
            scale(1)
            rotate(0);
    }

    25%{
        transform:
            translateY(-6px)
            scale(1.024)
            rotate(-1deg);
    }

    50%{
        transform:
            translateY(0)
            scale(1.038)
            rotate(0);
    }

    75%{
        transform:
            translateY(6px)
            scale(1.024)
            rotate(1deg);
    }
}

@keyframes logoGlitch{

    0%,
    82%,
    100%{
        clip-path:
            inset(0 0 0 0);
    }

    84%{
        clip-path:
            inset(8% 0 72% 0);

        transform:
            translate(3px,-1px)
            scale(1.01);
    }

    86%{
        clip-path:
            inset(60% 0 22% 0);

        transform:
            translate(-3px,2px)
            scale(1.01);
    }

    88%{
        clip-path:
            inset(0 0 0 0);
    }
}

@keyframes printShiftRed{

    0%,
    100%{
        transform:
            translate(3px,2px);
    }

    25%{
        transform:
            translate(7px,3px);
    }

    50%{
        transform:
            translate(2px,1px);
    }

    75%{
        transform:
            translate(5px,4px);
    }
}

@keyframes printShiftBlack{

    0%,
    100%{
        transform:
            translate(-3px,-2px);
    }

    33%{
        transform:
            translate(-5px,-3px);
    }

    66%{
        transform:
            translate(-2px,-1px);
    }
}

/* =========================================================
   CLICK TEXT
========================================================= */

.sub-txt{

    position:relative;

    z-index:25;

    margin-top:31px;

    color:#dc0000;

    font-family:
        Impact,
        "Arial Black",
        Arial,
        sans-serif;

    font-size:13px;
    font-weight:900;

    letter-spacing:4px;

    text-align:center;

    text-shadow:
        2px 2px 0 #000,
        0 0 14px rgba(220,0,0,.42);

    animation:

        clickBlink
        1.35s
        ease-in-out
        infinite,

        textEntrance
        .9s
        cubic-bezier(.16,1,.3,1)
        .2s
        both;
}

.sub-txt span{

    position:relative;

    display:inline-block;
}

.sub-txt span::after{

    content:"";

    position:absolute;

    left:-7%;
    right:-7%;
    bottom:-9px;

    height:2px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #dc0000 16%,
            #fff 50%,
            #dc0000 84%,
            transparent
        );

    transform:
        scaleX(.18);

    opacity:.35;

    animation:
        clickCharge
        1.35s
        ease-in-out
        infinite;
}

@keyframes clickCharge{

    50%{
        transform:
            scaleX(1);

        opacity:1;
    }
}

.sub-txt::before{

    content:"";

    display:inline-block;

    width:0;
    height:0;

    border-top:
        7px solid transparent;

    border-bottom:
        7px solid transparent;

    border-left:
        11px solid #dc0000;

    margin-right:14px;

    vertical-align:middle;

    filter:
        drop-shadow(2px 2px 0 #000);

    animation:
        arrowLeft
        .9s
        ease-in-out
        infinite;
}

.sub-txt::after{

    content:"";

    display:inline-block;

    width:0;
    height:0;

    border-top:
        7px solid transparent;

    border-bottom:
        7px solid transparent;

    border-right:
        11px solid #dc0000;

    margin-left:14px;

    vertical-align:middle;

    filter:
        drop-shadow(-2px 2px 0 #000);

    animation:
        arrowRight
        .9s
        ease-in-out
        infinite;
}

@keyframes clickBlink{

    0%,
    100%{
        opacity:.45;
    }

    50%{
        opacity:1;
    }
}

@keyframes textEntrance{

    0%{
        opacity:0;

        translate:
            0 25px;

        letter-spacing:10px;
    }

    100%{
        opacity:1;

        translate:
            0 0;

        letter-spacing:4px;
    }
}

@keyframes arrowLeft{

    50%{
        transform:
            translateX(8px)
            scale(1.15);
    }
}

@keyframes arrowRight{

    50%{
        transform:
            translateX(-8px)
            scale(1.15);
    }
}

/* =========================================================
   LABELS
========================================================= */

.start-label{

    position:absolute;

    z-index:30;

    color:
        rgba(255,255,255,.17);

    font-family:
        Arial,
        sans-serif;

    font-size:8px;

    letter-spacing:4px;

    text-transform:uppercase;

    pointer-events:none;
}

.start-label.top{
    top:8%;
    left:7%;
}

.start-label.bottom{
    bottom:8%;
    right:7%;
}

.start-label::before{

    content:"//";

    color:#dc0000;

    margin-right:8px;
}

/* =========================================================
   CLICK IMPACT
========================================================= */

#impactBurst{

    position:fixed;
    inset:0;

    z-index:99996;

    pointer-events:none;

    display:none;

    --cx:50vw;
    --cy:50vh;
}

#impactBurst.active{
    display:block;
}

#impactBurst::before{

    content:"";

    position:absolute;

    left:var(--cx);
    top:var(--cy);

    width:38px;
    height:38px;

    border-radius:50%;

    border:
        5px solid #fff;

    transform:
        translate(-50%,-50%);

    box-shadow:
        0 0 0 9px #dc0000,
        0 0 0 14px #050505;

    animation:
        impactRing
        .48s
        cubic-bezier(.08,.76,.15,1)
        forwards;
}

#impactBurst::after{

    content:"";

    position:absolute;

    left:var(--cx);
    top:var(--cy);

    width:160vmax;
    height:160vmax;

    opacity:0;

    background:

        repeating-conic-gradient(
            #fff 0 1.5deg,
            transparent 1.5deg 6deg,
            #dc0000 6deg 9deg,
            transparent 9deg 17deg
        );

    -webkit-mask-image:

        radial-gradient(
            circle,
            transparent 0 7%,
            #000 9% 43%,
            transparent 59%
        );

    mask-image:

        radial-gradient(
            circle,
            transparent 0 7%,
            #000 9% 43%,
            transparent 59%
        );

    animation:
        impactRays
        .55s
        cubic-bezier(.08,.76,.15,1)
        forwards;
}

@keyframes impactRing{

    0%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.2);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(17);
    }
}

@keyframes impactRays{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.02)
            rotate(-14deg);
    }

    18%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(1)
            rotate(10deg);
    }
}

/* =========================================================
   TEAR TRANSITION
========================================================= */

#tearTransition{

    position:fixed;
    inset:0;

    z-index:99998;

    visibility:hidden;

    overflow:hidden;

    pointer-events:none;

    background:
        transparent;
}

#tearTransition.active{
    visibility:visible;
}

.tear-side{

    position:absolute;

    top:-10%;

    width:54%;
    height:120%;

    background:

        linear-gradient(
            100deg,
            #020202 0%,
            #080808 70%,
            #130000 100%
        );

    will-change:
        transform;

    box-shadow:
        0 0 0 5px #dc0000;
}

.tear-left{

    left:0;

    transform:
        translateX(-108%);

    clip-path:

        polygon(
            0 0,
            100% 0,
            91% 7%,
            98% 17%,
            89% 27%,
            98% 38%,
            90% 49%,
            99% 61%,
            89% 73%,
            98% 85%,
            90% 100%,
            0 100%
        );
}

.tear-right{

    right:0;

    transform:
        translateX(108%);

    clip-path:

        polygon(
            10% 0,
            100% 0,
            100% 100%,
            9% 100%,
            2% 85%,
            11% 73%,
            1% 61%,
            10% 49%,
            2% 38%,
            11% 27%,
            2% 17%,
            9% 7%
        );
}

/* cover */

#tearTransition.cover .tear-left{

    animation:
        tearLeftCover
        .30s
        cubic-bezier(.76,0,.24,1)
        forwards;
}

#tearTransition.cover .tear-right{

    animation:
        tearRightCover
        .30s
        cubic-bezier(.76,0,.24,1)
        forwards;
}

@keyframes tearLeftCover{

    to{
        transform:
            translateX(0);
    }
}

@keyframes tearRightCover{

    to{
        transform:
            translateX(0);
    }
}

/* open */

#tearTransition.open .tear-left{

    transform:
        translateX(0);

    animation:
        tearLeftOpen
        .82s
        cubic-bezier(.12,.86,.20,1)
        forwards;
}

#tearTransition.open .tear-right{

    transform:
        translateX(0);

    animation:
        tearRightOpen
        .82s
        cubic-bezier(.12,.86,.20,1)
        forwards;
}

@keyframes tearLeftOpen{

    0%{
        transform:
            translateX(0);
    }

    14%{
        transform:
            translateX(-2%);
    }

    24%{
        transform:
            translateX(-6%);
    }

    100%{
        transform:
            translateX(-116%)
            rotate(-4deg);
    }
}

@keyframes tearRightOpen{

    0%{
        transform:
            translateX(0);
    }

    14%{
        transform:
            translateX(2%);
    }

    24%{
        transform:
            translateX(6%);
    }

    100%{
        transform:
            translateX(116%)
            rotate(4deg);
    }
}

/* center crack */

#tearLight{

    position:absolute;

    left:50%;
    top:0;

    width:5px;
    height:100%;

    z-index:8;

    opacity:0;

    transform:
        translateX(-50%)
        scaleX(.1);

    background:#fff;

    box-shadow:
        0 0 12px #fff,
        0 0 26px #dc0000,
        0 0 60px #dc0000;
}

#tearTransition.open #tearLight{

    animation:
        tearLightOpen
        .62s
        ease-out
        forwards;
}

@keyframes tearLightOpen{

    0%{
        opacity:0;

        transform:
            translateX(-50%)
            scaleX(.1);
    }

    20%{
        opacity:1;

        transform:
            translateX(-50%)
            scaleX(1);
    }

    55%{
        opacity:1;

        transform:
            translateX(-50%)
            scaleX(8);
    }

    100%{
        opacity:0;

        transform:
            translateX(-50%)
            scaleX(35);
    }
}

/* =========================================================
   FLASH
========================================================= */

#flashOverlay{

    display:none;

    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:99999;

    pointer-events:none;
}

.flash-animate{

    display:block !important;

    animation:
        flashEffect
        .55s
        ease-out
        forwards;
}

@keyframes flashEffect{

    0%{
        background:#fff;
        opacity:1;
    }

    12%{
        background:#dc0000;
        opacity:1;
    }

    22%{
        background:#000;
        opacity:1;
    }

    36%{
        background:#fff;
        opacity:1;
    }

    50%{
        background:#dc0000;
        opacity:1;
    }

    66%{
        background:#000;
        opacity:1;
    }

    100%{
        background:#000;
        opacity:0;
    }
}

/* =========================================================
   ANIMATION PAGE
========================================================= */

#canvasContainer{

    display:none;

    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    z-index:5;

    background:

        radial-gradient(
            circle at center,

        );
}

#canvasContainer::before{

    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    z-index:40;

    background:

        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.018) 0px,

        );
}

/* =========================================================
   FALLING CALLING CARDS
   只存在動畫頁
========================================================= */

.falling-letter{

    position:absolute;

    background-image:
        url("cover.png");

    background-size:contain;
    background-repeat:no-repeat;

    pointer-events:none;

    will-change:transform;

    opacity:.46;

    z-index:10;
}

.falling-letter.far{

    opacity:.15;

        blur(.6px);
}

.falling-letter.front{

    opacity:.78;

    z-index:16;

    filter:
        drop-shadow(
            0 5px 5px
            rgba(0,0,0,.5)
        )
        drop-shadow(
            0 0 8px
            rgba(220,0,0,.15)
        );
}

/* =========================================================
   ANIMATION PAGE P5 WORDS
========================================================= */

.p5-word{

    position:absolute;

    font-family:
        Impact,
        "Arial Black",
        sans-serif;

    font-weight:900;

    white-space:nowrap;

    pointer-events:none;
    user-select:none;

    letter-spacing:3px;

    color:
        rgba(0,0,0,.23);

    z-index:11;

    transform:
        rotate(var(--rotation));

    animation:
        wordFloat
        var(--duration)
        ease-in-out
        infinite;
}

.p5-word.white{
    color:
        rgba(255,255,255,.17);
}

.p5-word.red{
    color:
        rgba(220,0,0,.30);

    text-shadow:
        5px 5px 0 rgba(0,0,0,.4);
}

/* =========================================================
   ANIMATION PAGE SLASHES
========================================================= */

.p5-slash{

    position:absolute;

    pointer-events:none;

    z-index:13;

    opacity:.75;

    transform:
        skewX(-25deg)
        rotate(-8deg);

    animation:
        slashFloat
        var(--duration)
        ease-in-out
        infinite;
}

.p5-slash.black{
    background:#050505;
}

.p5-slash.white{
    background:#fff;
}

.p5-slash.red{

    background:#dc0000;

    box-shadow:
        0 0 12px rgba(220,0,0,.3);
}

/* =========================================================
   ANIMATION PAGE SPEED
========================================================= */

.speed-line{

    position:absolute;

    height:4px;

    background:#050505;

    pointer-events:none;

    z-index:15;

    transform:
        rotate(var(--angle));

    animation:
        speedMove
        var(--duration)
        linear
        infinite;
}

.speed-line.white{
    background:#fff;
}

/* =========================================================
   PAPER
========================================================= */

.paper-fragment{

    position:absolute;

    pointer-events:none;

    z-index:14;

    background:#fff;

    transform:
        rotate(var(--rotation));

    animation:
        paperFall
        var(--duration)
        linear
        infinite;
}

.paper-fragment.black{
    background:#080808;
}

.paper-fragment.red{
    background:#dc0000;
}

.paper-strip{

    position:absolute;

    pointer-events:none;

    z-index:12;

    background:
        rgba(255,255,255,.75);

    transform:
        rotate(var(--rotation))
        skewX(-25deg);

    animation:
        stripMove
        var(--duration)
        ease-in-out
        infinite;
}

.paper-strip.black{
    background:
        rgba(0,0,0,.55);
}

/* =========================================================
   INK SPLATTER
========================================================= */

.ink-splatter{

    position:absolute;

    width:9px;
    height:9px;

    background:#dc0000;

    border-radius:50%;

    pointer-events:none;

    z-index:17;

    opacity:.82;

    box-shadow:
        0 0 7px rgba(220,0,0,.35);

    transform:
        translate(0,0)
        scale(var(--scale))
        rotate(var(--rotation));

    animation:
        inkSplatter
        var(--duration)
        ease-out
        forwards;
}

.ink-splatter::before,
.ink-splatter::after{

    content:"";

    position:absolute;

    background:#dc0000;

    border-radius:50%;
}

.ink-splatter::before{

    width:5px;
    height:5px;

    left:var(--dot-x);
    top:var(--dot-y);
}

.ink-splatter::after{

    width:3px;
    height:3px;

    left:var(--dot-x2);
    top:var(--dot-y2);
}

@keyframes inkSplatter{

    0%{
        opacity:0;

        transform:
            translate(0,0)
            scale(.2)
            rotate(var(--rotation));
    }

    12%{
        opacity:.9;
    }

    65%{
        opacity:.8;
    }

    100%{
        opacity:0;

        transform:
            translate(
                var(--move-x),
                var(--move-y)
            )
            scale(var(--scale))
            rotate(
                calc(
                    var(--rotation)
                    +
                    100deg
                )
            );
    }
}

/* =========================================================
   VIDEO
========================================================= */

#videoContainer{

    display:none;

    position:fixed;
    inset:0;

    width:100vw;
    height:100vh;

    z-index:999;

    justify-content:center;
    align-items:center;

    pointer-events:none;
}

    max-width:88vw;
    max-height:80vh;

    object-fit:contain;

        )
        contrast(1.08);

    animation:
        popIn
        .35s
        cubic-bezier(.175,.885,.32,1.275)
        forwards;
}

/* =========================================================
   ANIMATION KEYFRAMES
========================================================= */

@keyframes p5GlobalFall{

    0%{
        transform:
            translateY(0)
            rotate(var(--rot))
            scale(var(--sc));
    }

    100%{
        transform:
            translateY(120vh)
            rotate(
                calc(
                    var(--rot)
                    +
                    120deg
                )
            )
            scale(var(--sc));
    }
}

@keyframes wordFloat{

    0%,
    100%{
        transform:
            translateY(0)
            rotate(var(--rotation));
    }

    50%{
        transform:
            translateY(-15px)
            rotate(var(--rotation));
    }
}

@keyframes slashFloat{

    0%,
    100%{
        transform:
            translateX(-25px)
            skewX(-25deg)
            rotate(-8deg);
    }

    50%{
        transform:
            translateX(25px)
            skewX(-25deg)
            rotate(-8deg);
    }
}

@keyframes speedMove{

    0%{
        transform:
            translateX(-35vw)
            rotate(var(--angle));
    }

    100%{
        transform:
            translateX(140vw)
            rotate(var(--angle));
    }
}

@keyframes paperFall{

    0%{
        transform:
            translateY(-20vh)
            translateX(0)
            rotate(var(--rotation));
    }

    50%{
        transform:
            translateY(50vh)
            translateX(30px)
            rotate(
                calc(
                    var(--rotation)
                    +
                    120deg
                )
            );
    }

    100%{
        transform:
            translateY(120vh)
            translateX(-30px)
            rotate(
                calc(
                    var(--rotation)
                    +
                    300deg
                )
            );
    }
}

@keyframes stripMove{

    0%,
    100%{
        transform:
            translateX(-20px)
            rotate(var(--rotation))
            skewX(-25deg);
    }

    50%{
        transform:
            translateX(30px)
            rotate(var(--rotation))
            skewX(-25deg);
    }
}

@keyframes popIn{

    0%{
        transform:
            scale(.9);

        opacity:0;
    }

    100%{
        transform:
            scale(1);

        opacity:1;
    }
}

/* =========================================================

========================================================= */

@media (prefers-reduced-motion:reduce){

    .start-burst,
    .start-target,
    .start-x,
    .start-block,
    .start-ink,
    .start-fragment,
    .start-speed,
    .start-chevron,
    .start-symbol{

        animation-duration:
            8s !important;
    }
}

/* =========================================================
   RANDOM HELPERS
========================================================= */

function random(
    min,
    max
){

    return (
        Math.random()
        *
        (
            max
            -
            min
        )
        +
        min
    );
}

function pick(
    array
){

    return array[
        Math.floor(
            Math.random()
            *
            array.length
        )
    ];
}

/*
   盡量不要讓較重的元素
   直接蓋在中央 PNG Logo 上
*/

function getDecorPosition(
    avoidCenter = true
){

    let x;
    let y;

    let safe = false;

    let attempts = 0;

    while(
        !safe
        &&
        attempts
        <
        20
    ){

        x =
            random(
                1,
                94
            );

        y =
            random(
                4,
                90
            );

        if(
            !avoidCenter
        ){

            safe = true;

        }
        else{

            const insideLogoArea =

                x
                >
                22
                &&
                x
                <
                78
                &&
                y
                >
                28
                &&
                y
                <
                70;

            safe =
                !insideLogoArea;

        }

        attempts++;

    }

    return {
        x,
        y
    };
}

/* =========================================================
   START PAGE PARALLAX
========================================================= */

function initStartParallax(){

    const start =
        document.getElementById(
            "startScreen"
        );

    if(
        !start
    ){
        return;
    }

    if(
        !window.matchMedia(
            "(pointer:fine)"
        ).matches
    ){
        return;
    }

    start.addEventListener(
        "pointermove",
        event => {

            if(
                launched
            ){
                return;
            }

            const x =
                (
                    event.clientX
                    /
                    window.innerWidth
                )
                -
                .5;

            const y =
                (
                    event.clientY
                    /
                    window.innerHeight
                )
                -
                .5;

            start.style.setProperty(
                "--logoX",
                (
                    x
                    *
                    12
                )
                +
                "px"
            );

            start.style.setProperty(
                "--logoY",
                (
                    y
                    *
                    9
                )
                +
                "px"
            );

        }
    );

    start.addEventListener(
        "pointerleave",
        () => {

            start.style.setProperty(
                "--logoX",
                "0px"
            );

            start.style.setProperty(
                "--logoY",
                "0px"
            );

        }
    );

}

    if(

        <
        .25
    ){

        letter.classList.add(
            "far"
        );

    }
    else if(
        depth
        >
        .78
    ){

        letter.classList.add(
            "front"
        );

    }

    let sizeWidth;

    if(
        depth
        <
        .25
    ){

        sizeWidth =
            Math.floor(
                Math.random()
                *
                30
            )
            +
            22;

    }
    else if(
        depth
        >
        .78
    ){

        sizeWidth =
            Math.floor(
                Math.random()
                *
                80
            )
            +
            55;

    }
    else{

        sizeWidth =
            Math.floor(
                Math.random()
                *
                55
            )
            +
            30;

    }

    const sizeHeight =
        sizeWidth
        *
        1.3;

    const left =
        Math.random()
        *
        96;

    const top =
        initial
            ?
            Math.random()
            *
            115
            -
            15
            :
            -18;

    let duration;

    if(
        depth
        <
        .25
    ){

        duration =
            Math.random()
            *
            4
            +
            6;

    }
    else if(
        depth
        >
        .78
    ){

        duration =
            Math.random()
            *
            2
            +
            2.5;

    }
    else{

        duration =
            Math.random()
            *
            3
            +
            3;

    }

    const rotation =
        Math.random()
        *
        100
        -
        50;

    const scale =
        (
            Math.random()
            *
            .45
            +
            .55
        )
        .toFixed(
            2
        );

    letter.style.width =
        sizeWidth
        +
        "px";

    letter.style.height =
        sizeHeight
        +
        "px";

    letter.style.left =
        left
        +
        "vw";

    letter.style.top =
        top
        +
        "vh";

    letter.style.setProperty(
        "--rot",
        rotation
        +
        "deg"
    );

    letter.style.setProperty(
        "--sc",
        scale
    );

    letter.style.transform =
        `rotate(${rotation}deg) scale(${scale})`;

    letter.dataset.duration =
        duration;

    container.appendChild(
        letter
    );

    if(
        !initial
    ){

        letter.style.animation =
            `p5GlobalFall ${duration}s linear`;

        setTimeout(
            () => {

                letter.remove();

            },
            duration
            *
            1000
            +
            200
        );

    }

}

/* =========================================================
   CLICK IMPACT
========================================================= */

function triggerClickImpact(
    event
){

    const burst =
        document.getElementById(
            "impactBurst"
        );

    const x =

        event
        &&
        Number.isFinite(
            event.clientX
        )

        ?
        event.clientX

        :
        window.innerWidth
        /
        2;

    const y =

        event
        &&
        Number.isFinite(
            event.clientY
        )

        ?
        event.clientY

        :
        window.innerHeight
        /
        2;

    burst.style.setProperty(
        "--cx",
        x
        +
        "px"
    );

    burst.style.setProperty(
        "--cy",
        y
        +
        "px"
    );

    burst.classList.remove(
        "active"
    );

    void burst.offsetWidth;

    burst.classList.add(
        "active"
    );

    setTimeout(
        () => {

            burst.classList.remove(
                "active"
            );

        },
        650
    );

}

/* =========================================================
   LAUNCH
========================================================= */

function launchPhantom(
    event
){

    if(
        launched
    ){
        return;
    }

    launched = true;

    const audio =
        document.getElementById(
            "audio"
        );

    const video =
        document.getElementById(
            "bgVideo"
        );

    const startScreen =
        document.getElementById(
            "startScreen"
        );

    const flashOverlay =
        document.getElementById(
            "flashOverlay"
        );

    const canvasContainer =
        document.getElementById(
            "canvasContainer"
        );

    const videoContainer =
        document.getElementById(
            "videoContainer"
        );

    const tear =
        document.getElementById(
            "tearTransition"
        );

    /* =====================================================
       CLICK IMPACT
    ===================================================== */

    triggerClickImpact(
        event
    );

    /* =====================================================
       AUDIO
    ===================================================== */

    audio.volume = 1;

    audio
        .play()
        .catch(
            error => {

                console.log(
                    error
                );

            }
        );

    /* =====================================================
       VIDEO
    ===================================================== */

    video
        .play()
        .catch(
            error => {

                console.log(
                    error
                );

            }
        );

    startScreen.style.pointerEvents =
        "none";

    /*
       Logo 點擊瞬間往前撞
    */

    startScreen.style.transition =
        "transform .30s cubic-bezier(.16,1,.3,1), filter .30s ease";

    startScreen.style.transform =
        "scale(1.12)";

    startScreen.style.filter =
        "contrast(1.2) brightness(1.12)";

    /*
       STEP 1
       左右黑紅紙幕衝入中央
    */

    tear.classList.add(
        "active"
    );

    tear.classList.add(
        "cover"
    );

    /*
       STEP 2
       黑幕遮住後
       顯示真正動畫頁
    */

    setTimeout(
        () => {

            startScreen.style.display =
                "none";

            document.body.style.backgroundColor =
                "#dc0000";

            canvasContainer.style.display =
                "block";

            videoContainer.style.display =
                "flex";

            /*
               啟動已經預先建立的 220 張預告信
            */

            const letters =
                document.querySelectorAll(
                    ".falling-letter"
                );

            letters.forEach(
                letter => {

                    const duration =
                        letter.dataset.duration;

                    letter.style.animation =
                        `p5GlobalFall ${duration}s linear infinite`;

                }
            );

        },
        300
    );

    /*
       STEP 3
       停在中央一瞬
       再猛烈撕開
    */

    setTimeout(
        () => {

            tear.classList.remove(
                "cover"
            );

            tear.classList.add(
                "open"
            );

            flashOverlay.classList.add(
                "flash-animate"
            );

        },
        455
    );

    /*
       STEP 4
       清理 transition
    */

    setTimeout(
        () => {

            tear.classList.remove(
                "active",
                "open"
            );

        },
        window.innerWidth
        <=
        600
            ?
            1650
            :
            1450
    );

    setTimeout(
        () => {

            flashOverlay.classList.remove(
                "flash-animate"
            );

        },
        1100
    );

    /* =====================================================
       CONTINUOUS ANIMATION PAGE EFFECTS
    ===================================================== */

    setInterval(
        () => {

            supplementLetter();

        },
        80
    );

    setInterval(
        () => {

            supplementPaper();

        },
        160
    );

    setInterval(
        () => {

            supplementSpeedLine();

        },
        220
    );

    setInterval(
        () => {

            supplementInkSplatter();

        },
        500
    );

    setInterval(
        () => {

            supplementSlash();

        },
        900
    );

}

            Math.random()
            *
            180
        )
        +
        40
        +
        "px";

    line.style.left =
        "-20vw";

    line.style.top =
        Math.random()
        *
        100
        +
        "vh";

    line.style.setProperty(
        "--angle",
        Math.random()
        *
        35
        -
        25
        +
        "deg"
    );

    const duration =
        Math.random()
        *
        1.5
        +
        .8;

    line.style.setProperty(
        "--duration",
        duration
        +
        "s"
    );

    line.style.animation =
        `speedMove ${duration}s linear`;

    container.appendChild(
        line
    );

    setTimeout(
        () => {

            line.remove();

        },
        duration
        *
        1000
        +
        300
    );

}

/* =========================================================
   SUPPLEMENT INK
========================================================= */

function supplementInkSplatter(){

    const container =
        document.getElementById(
            "canvasContainer"
        );

    const splatters =
        container.querySelectorAll(
            ".ink-splatter"
        );

    if(
        splatters.length
        >
        45
    ){
        return;
    }

    createInkSplatter(
        false
    );

}

/* =========================================================
   SUPPLEMENT SLASH
========================================================= */

function supplementSlash(){

    const container =
        document.getElementById(
            "canvasContainer"
        );

    const slash =
        document.createElement(
            "div"
        );

    slash.className =
        "p5-slash";

    const type =
        Math.random();

    if(
        type
        <
        .45
    ){

        slash.classList.add(
            "black"
        );

    }
    else if(
        type
        <
        .72
    ){

        slash.classList.add(
            "red"
        );

    }
    else{

        slash.classList.add(
            "white"
        );

    }

    slash.style.width =
        Math.floor(
            Math.random()
            *
            180
        )
        +
        45
        +
        "px";

    slash.style.height =
        Math.floor(
            Math.random()
            *
            18
        )
        +
        5
        +
        "px";

    slash.style.left =
        "-20vw";

    slash.style.top =
        Math.random()
        *
        100
        +
        "vh";

    slash.style.setProperty(
        "--duration",
        Math.random()
        *
        2
        +
        2
        +
        "s"
    );

    container.appendChild(
        slash
    );

    setTimeout(
        () => {

            slash.remove();

        },
        4500
    );

}

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        clearTimeout(
            resizeTimer
        );

        resizeTimer =
            setTimeout(
                () => {

                    if(
                        !launched
                    ){

                        buildStartP5Decor();

                    }

                },
                180
            );

    }
);

</script>
