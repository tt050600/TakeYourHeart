<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no,
    viewport-fit=cover"
>

<title>Take Your Heart</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    position:relative;
    font-family:Impact,"Arial Black",Arial,sans-serif;
}

/* =========================================================
   START SCREEN
========================================================= */

#startScreen{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(70,0,0,.38) 0%,
            rgba(20,0,0,.18) 32%,
            rgba(5,5,5,.96) 75%,
            #000 100%
        );

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    z-index:10000;

    cursor:pointer;
    overflow:hidden;
    isolation:isolate;

    --logoX:0px;
    --logoY:0px;
}

/* 中央紅光 */

#startScreen::before{
    content:"";

    position:absolute;

    width:70vw;
    height:70vw;

    max-width:900px;
    max-height:900px;

    left:50%;
    top:48%;

    transform:
        translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(220,0,0,.20) 0%,
            rgba(220,0,0,.08) 30%,
            transparent 68%
        );

    filter:blur(10px);

    pointer-events:none;

    z-index:-3;

    animation:
        centerPulse
        2.8s
        ease-in-out
        infinite;
}

@keyframes centerPulse{

    0%,
    100%{
        opacity:.55;

        transform:
            translate(-50%,-50%)
            scale(.92);
    }

    50%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.12);
    }

}

/* 掃描線 */

#startScreen::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 1px,
            transparent 1px,
            transparent 5px
        );

    mix-blend-mode:screen;

    pointer-events:none;

    z-index:50;

    opacity:.55;
}

/* =========================================================
   BACKGROUND CUTS
========================================================= */

.start-slash{
    position:absolute;

    pointer-events:none;

    transform:
        rotate(-12deg)
        skewX(-25deg);

    transform-origin:center;

    z-index:2;
}

.start-slash.one{
    width:140vw;
    height:34px;

    top:17%;
    left:-25%;

    background:#dc0000;

    opacity:.85;

    box-shadow:
        0 0 18px rgba(220,0,0,.5);

    animation:
        slashOne
        3.2s
        ease-in-out
        infinite;
}

.start-slash.two{
    width:100vw;
    height:9px;

    top:29%;
    right:-30%;

    background:#fff;

    opacity:.65;

    animation:
        slashTwo
        2.6s
        ease-in-out
        infinite;
}

.start-slash.three{
    width:125vw;
    height:12px;

    bottom:20%;
    left:-15%;

    background:#dc0000;

    opacity:.72;

    box-shadow:
        0 0 16px rgba(220,0,0,.4);

    animation:
        slashThree
        3s
        ease-in-out
        infinite;
}

.start-slash.four{
    width:70vw;
    height:48px;

    bottom:28%;
    right:-15%;

    background:#000;

    opacity:.95;

    box-shadow:
        0 0 0 2px rgba(255,255,255,.08);

    animation:
        slashFour
        3.8s
        ease-in-out
        infinite;
}

@keyframes slashOne{

    0%,
    100%{
        transform:
            translateX(-3vw)
            rotate(-12deg)
            skewX(-25deg);
    }

    50%{
        transform:
            translateX(5vw)
            rotate(-12deg)
            skewX(-25deg);
    }

}

@keyframes slashTwo{

    0%,
    100%{
        transform:
            translateX(0)
            rotate(-12deg)
            skewX(-25deg);

        opacity:.35;
    }

    50%{
        transform:
            translateX(-7vw)
            rotate(-12deg)
            skewX(-25deg);

        opacity:.9;
    }

}

@keyframes slashThree{

    0%,
    100%{
        transform:
            translateX(0)
            rotate(-12deg)
            skewX(-25deg);
    }

    50%{
        transform:
            translateX(-5vw)
            rotate(-12deg)
            skewX(-25deg);
    }

}

@keyframes slashFour{

    0%,
    100%{
        transform:
            translateX(0)
            rotate(-12deg)
            skewX(-25deg);
    }

    50%{
        transform:
            translateX(-4vw)
            rotate(-12deg)
            skewX(-25deg);
    }

}

/* =========================================================
   EXTRA CUTTING BARS
========================================================= */

.start-cut{
    position:absolute;

    pointer-events:none;

    z-index:3;

    transform:
        rotate(-10deg)
        skewX(-28deg);
}

.start-cut.a{
    width:38vw;
    height:7px;

    left:-5vw;
    top:39%;

    background:#fff;

    opacity:.5;

    animation:
        cutMoveA
        2.2s
        ease-in-out
        infinite;
}

.start-cut.b{
    width:50vw;
    height:4px;

    right:-12vw;
    top:43%;

    background:#dc0000;

    opacity:.8;

    animation:
        cutMoveB
        1.8s
        ease-in-out
        infinite;
}

.start-cut.c{
    width:32vw;
    height:10px;

    left:2vw;
    bottom:39%;

    background:#000;

    opacity:.95;
}

.start-cut.d{
    width:45vw;
    height:5px;

    right:-8vw;
    bottom:42%;

    background:#fff;

    opacity:.38;
}

@keyframes cutMoveA{

    0%,
    100%{
        transform:
            translateX(0)
            rotate(-10deg)
            skewX(-28deg);
    }

    50%{
        transform:
            translateX(7vw)
            rotate(-10deg)
            skewX(-28deg);
    }

}

@keyframes cutMoveB{

    0%,
    100%{
        transform:
            translateX(5vw)
            rotate(-10deg)
            skewX(-28deg);
    }

    50%{
        transform:
            translateX(-5vw)
            rotate(-10deg)
            skewX(-28deg);
    }

}

/* =========================================================
   START PAGE P5 DECOR
========================================================= */

#startP5Decor{
    position:absolute;
    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:1;
}

/* =========================================================
   HUGE WORDS
========================================================= */

.start-p5-word{
    position:absolute;

    font-family:
        Impact,
        "Arial Black",
        sans-serif;

    font-weight:900;

    line-height:.78;

    white-space:nowrap;

    user-select:none;
    pointer-events:none;

    letter-spacing:2px;

    opacity:.14;

    transform:
        rotate(var(--rot));

    text-shadow:
        5px 5px 0 rgba(0,0,0,.35);

    animation:
        startWordFloat
        var(--dur)
        ease-in-out
        infinite;
}

.start-p5-word.red{
    color:
        rgba(220,0,0,.48);
}

.start-p5-word.white{
    color:
        rgba(255,255,255,.21);
}

.start-p5-word.black{
    color:
        rgba(0,0,0,.55);
}

@keyframes startWordFloat{

    0%,
    100%{
        transform:
            rotate(var(--rot))
            translateY(0);
    }

    50%{
        transform:
            rotate(var(--rot))
            translateY(-14px);
    }

}

/* =========================================================
   BURST STAR
========================================================= */

.start-burst{
    position:absolute;

    width:var(--size);
    height:var(--size);

    left:var(--x);
    top:var(--y);

    opacity:var(--o);

    z-index:1;

    pointer-events:none;

    background:
        repeating-conic-gradient(
            from 0deg,
            var(--c) 0deg 8deg,
            transparent 8deg 18deg
        );

    -webkit-mask-image:
        radial-gradient(
            circle,
            transparent 0 20%,
            #000 21% 58%,
            transparent 59%
        );

    mask-image:
        radial-gradient(
            circle,
            transparent 0 20%,
            #000 21% 58%,
            transparent 59%
        );

    transform:
        rotate(var(--r));

    animation:
        burstSpin
        var(--d)
        linear
        infinite;
}

@keyframes burstSpin{

    from{
        transform:
            rotate(var(--r));
    }

    to{
        transform:
            rotate(
                calc(
                    var(--r)
                    +
                    360deg
                )
            );
    }

}

/* =========================================================
   X MARK
========================================================= */

.start-x{
    position:absolute;

    width:var(--size);
    height:var(--size);

    left:var(--x);
    top:var(--y);

    opacity:var(--o);

    z-index:2;

    transform:
        rotate(var(--r));

    animation:
        decorFloat
        var(--d)
        ease-in-out
        infinite;
}

.start-x::before,
.start-x::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:100%;
    height:11%;

    background:
        var(--c);

    transform-origin:center;

    box-shadow:
        2px 2px 0 rgba(0,0,0,.5);
}

.start-x::before{
    transform:
        translate(-50%,-50%)
        rotate(45deg);
}

.start-x::after{
    transform:
        translate(-50%,-50%)
        rotate(-45deg);
}

/* =========================================================
   DOT CLUSTER
========================================================= */

.start-dot-cluster{
    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--size);
    height:var(--size);

    opacity:var(--o);

    z-index:1;

    transform:
        rotate(var(--r));

    animation:
        decorFloat
        var(--d)
        ease-in-out
        infinite;
}

.start-dot{
    position:absolute;

    width:var(--dot);
    height:var(--dot);

    border-radius:50%;

    background:
        var(--c);

    box-shadow:
        1px 1px 0 rgba(0,0,0,.4);
}

/* =========================================================
   BLOCK
========================================================= */

.start-block{
    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--w);
    height:var(--h);

    background:
        var(--c);

    opacity:var(--o);

    z-index:1;

    transform:
        rotate(var(--r))
        skewX(-25deg);

    animation:
        blockShift
        var(--d)
        ease-in-out
        infinite;

    box-shadow:
        4px 4px 0 rgba(0,0,0,.4);
}

@keyframes blockShift{

    0%,
    100%{
        transform:
            rotate(var(--r))
            skewX(-25deg)
            translateX(0);
    }

    50%{
        transform:
            rotate(var(--r))
            skewX(-25deg)
            translateX(14px);
    }

}

/* =========================================================
   INK
========================================================= */

.start-ink{
    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--size);
    height:
        calc(
            var(--size)
            *
            .72
        );

    background:
        var(--c);

    opacity:var(--o);

    z-index:1;

    border-radius:
        53% 47% 58% 42%
        /
        42% 55% 45% 58%;

    transform:
        rotate(var(--r));

    animation:
        startInkPulse
        var(--d)
        ease-in-out
        infinite;
}

.start-ink::before,
.start-ink::after{
    content:"";

    position:absolute;

    background:inherit;

    border-radius:50%;
}

.start-ink::before{
    width:34%;
    height:34%;

    left:-10%;
    top:58%;
}

.start-ink::after{
    width:22%;
    height:22%;

    right:-8%;
    top:-8%;
}

@keyframes startInkPulse{

    0%,
    100%{
        transform:
            rotate(var(--r))
            scale(1);
    }

    50%{
        transform:
            rotate(var(--r))
            scale(1.08);
    }

}

/* =========================================================
   FRAGMENT
========================================================= */

.start-fragment{
    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--w);
    height:var(--h);

    background:
        var(--c);

    opacity:var(--o);

    z-index:2;

    transform:
        rotate(var(--r));

    box-shadow:
        2px 2px 0 rgba(0,0,0,.45);

    animation:
        decorFloat
        var(--d)
        ease-in-out
        infinite;
}

/* =========================================================
   SPEED LINES
========================================================= */

.start-speed{
    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--w);
    height:var(--h);

    background:
        var(--c);

    opacity:var(--o);

    z-index:1;

    transform:
        rotate(var(--r));

    animation:
        startSpeedSweep
        var(--d)
        linear
        infinite;
}

@keyframes startSpeedSweep{

    0%{
        transform:
            translateX(-80px)
            rotate(var(--r));

        opacity:0;
    }

    12%{
        opacity:
            var(--o);
    }

    75%{
        opacity:
            var(--o);
    }

    100%{
        transform:
            translateX(120px)
            rotate(var(--r));

        opacity:0;
    }

}

@keyframes decorFloat{

    0%,
    100%{
        translate:
            0
            0;
    }

    50%{
        translate:
            0
            -12px;
    }

}

/* =========================================================
   ROYAL LOGO
========================================================= */

.royal-logo{
    position:relative;

    z-index:10;

    margin-top:42px;

    width:430px;
    max-width:85vw;

    user-select:none;

    transform:
        rotate(-7deg)
        skewX(-8deg);

    translate:
        var(--logoX)
        var(--logoY);

    filter:
        drop-shadow(9px 10px 0 #000)
        drop-shadow(13px 13px 0 #dc0000);

    animation:
        logoEntrance
        .9s
        cubic-bezier(.16,1,.3,1)
        both,

        logoFloat
        2.8s
        ease-in-out
        .9s
        infinite;
}

/* 紅套印 */

.royal-logo::before{
    content:"";

    position:absolute;

    inset:-3px;

    background:
        url("take-your-heart.png")
        center
        /
        contain
        no-repeat;

    pointer-events:none;

    opacity:.28;

    transform:
        translate(5px,3px);

    mix-blend-mode:screen;

    z-index:-1;

    animation:
        printShiftRed
        1.7s
        steps(2,end)
        infinite;
}

/* 黑套印 */

.royal-logo::after{
    content:"";

    position:absolute;

    inset:-3px;

    background:
        url("take-your-heart.png")
        center
        /
        contain
        no-repeat;

    pointer-events:none;

    opacity:.20;

    transform:
        translate(-4px,-3px);

    mix-blend-mode:multiply;

    z-index:-1;

    animation:
        printShiftBlack
        2s
        steps(2,end)
        infinite;
}

.take-your-heart-img{
    display:block;

    width:100%;
    height:auto;

    object-fit:contain;

    transform-origin:center center;

    animation:
        heartFloat
        2.8s
        ease-in-out
        infinite,

        logoGlitch
        4.5s
        steps(1,end)
        infinite;
}

@keyframes logoEntrance{

    0%{
        opacity:0;

        transform:
            translateY(45px)
            scale(.72)
            rotate(-13deg)
            skewX(-12deg);
    }

    70%{
        opacity:1;

        transform:
            translateY(-5px)
            scale(1.06)
            rotate(-6deg)
            skewX(-8deg);
    }

    100%{
        opacity:1;

        transform:
            rotate(-7deg)
            skewX(-8deg);
    }

}

@keyframes logoFloat{

    0%,
    100%{
        transform:
            rotate(-7deg)
            skewX(-8deg)
            translateY(0);
    }

    50%{
        transform:
            rotate(-7deg)
            skewX(-8deg)
            translateY(-5px);
    }

}

@keyframes heartFloat{

    0%,
    100%{
        transform:
            translateY(0)
            scale(1)
            rotate(0deg);
    }

    25%{
        transform:
            translateY(-7px)
            scale(1.025)
            rotate(-1deg);
    }

    50%{
        transform:
            translateY(0)
            scale(1.04)
            rotate(0deg);
    }

    75%{
        transform:
            translateY(7px)
            scale(1.025)
            rotate(1deg);
    }

}

@keyframes logoGlitch{

    0%,
    82%,
    100%{
        clip-path:
            inset(0 0 0 0);
    }

    84%{
        clip-path:
            inset(8% 0 72% 0);

        transform:
            translate(3px,-1px)
            scale(1.01);
    }

    86%{
        clip-path:
            inset(60% 0 22% 0);

        transform:
            translate(-3px,2px)
            scale(1.01);
    }

    88%{
        clip-path:
            inset(0 0 0 0);
    }

}

@keyframes printShiftRed{

    0%,
    100%{
        transform:
            translate(3px,2px);

        opacity:.22;
    }

    20%{
        transform:
            translate(6px,3px);

        opacity:.30;
    }

    40%{
        transform:
            translate(2px,1px);

        opacity:.18;
    }

    60%{
        transform:
            translate(5px,4px);

        opacity:.28;
    }

    80%{
        transform:
            translate(3px,2px);

        opacity:.24;
    }

}

@keyframes printShiftBlack{

    0%,
    100%{
        transform:
            translate(-3px,-2px);

        opacity:.16;
    }

    25%{
        transform:
            translate(-5px,-3px);

        opacity:.22;
    }

    50%{
        transform:
            translate(-2px,-1px);

        opacity:.14;
    }

    75%{
        transform:
            translate(-4px,-3px);

        opacity:.20;
    }

}

/* =========================================================
   LOGO ENERGY RINGS
========================================================= */

.logo-ring{
    position:absolute;

    left:50%;
    top:50%;

    border:
        1px solid rgba(220,0,0,.22);

    transform:
        translate(-50%,-50%)
        rotate(-7deg);

    pointer-events:none;

    z-index:1;
}

.logo-ring.one{
    width:480px;
    height:210px;

    border-color:
        rgba(220,0,0,.25);

    animation:
        ringPulse
        2.8s
        ease-out
        infinite;
}

.logo-ring.two{
    width:540px;
    height:250px;

    border-color:
        rgba(255,255,255,.10);

    animation:
        ringPulse
        2.8s
        ease-out
        .8s
        infinite;
}

@keyframes ringPulse{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            rotate(-7deg)
            scale(.86);
    }

    30%{
        opacity:.75;
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            rotate(-7deg)
            scale(1.14);
    }

}

/* =========================================================
   CLICK TEXT
========================================================= */

.sub-txt{
    position:relative;

    z-index:12;

    margin-top:30px;

    color:#dc0000;

    font-family:
        Impact,
        "Arial Black",
        Arial,
        sans-serif;

    font-size:13px;
    font-weight:900;

    letter-spacing:4px;

    text-align:center;

    text-shadow:
        2px 2px 0 #000,
        0 0 12px rgba(220,0,0,.4);

    animation:
        clickBlink
        1.4s
        ease-in-out
        infinite,

        textEntrance
        .9s
        cubic-bezier(.16,1,.3,1)
        .2s
        both;
}

.sub-txt::before{
    content:"";

    display:inline-block;

    width:0;
    height:0;

    border-top:
        7px solid transparent;

    border-bottom:
        7px solid transparent;

    border-left:
        11px solid #dc0000;

    margin-right:14px;

    vertical-align:middle;

    animation:
        arrowLeft
        .9s
        ease-in-out
        infinite;

    filter:
        drop-shadow(2px 2px 0 #000);
}

.sub-txt::after{
    content:"";

    display:inline-block;

    width:0;
    height:0;

    border-top:
        7px solid transparent;

    border-bottom:
        7px solid transparent;

    border-right:
        11px solid #dc0000;

    margin-left:14px;

    vertical-align:middle;

    animation:
        arrowRight
        .9s
        ease-in-out
        infinite;

    filter:
        drop-shadow(-2px 2px 0 #000);
}

@keyframes textEntrance{

    0%{
        opacity:0;

        transform:
            translateY(25px);

        letter-spacing:10px;
    }

    100%{
        opacity:1;

        transform:
            translateY(0);

        letter-spacing:4px;
    }

}

@keyframes clickBlink{

    0%,
    100%{
        opacity:.45;
    }

    50%{
        opacity:1;
    }

}

@keyframes arrowLeft{

    0%,
    100%{
        transform:
            translateX(0)
            scale(1);
    }

    50%{
        transform:
            translateX(8px)
            scale(1.15);
    }

}

@keyframes arrowRight{

    0%,
    100%{
        transform:
            translateX(0)
            scale(1);
    }

    50%{
        transform:
            translateX(-8px)
            scale(1.15);
    }

}

/* =========================================================
   LABELS
========================================================= */

.start-label{
    position:absolute;

    color:
        rgba(255,255,255,.18);

    font-family:
        Arial,
        sans-serif;

    font-size:8px;

    letter-spacing:4px;

    z-index:15;

    pointer-events:none;

    text-transform:uppercase;
}

.start-label.top{
    top:8%;
    left:7%;
}

.start-label.bottom{
    bottom:8%;
    right:7%;
}

.start-label::before{
    content:"//";

    color:#dc0000;

    margin-right:8px;
}

/* =========================================================
   NEW MOBILE TEAR OPEN TRANSITION
========================================================= */

#tearTransition{
    position:fixed;
    inset:0;

    z-index:99998;

    pointer-events:none;

    visibility:hidden;

    overflow:hidden;
}

#tearTransition.active{
    visibility:visible;
}

.tear-side{
    position:absolute;

    top:-10%;

    width:53%;
    height:120%;

    background:#050505;

    will-change:transform;

    box-shadow:
        0 0 0 5px #dc0000;
}

.tear-left{
    left:0;

    clip-path:
        polygon(
            0 0,
            100% 0,
            91% 8%,
            98% 18%,
            88% 28%,
            97% 38%,
            90% 50%,
            99% 62%,
            89% 74%,
            97% 86%,
            90% 100%,
            0 100%
        );

    transform:
        translateX(-105%);
}

.tear-right{
    right:0;

    clip-path:
        polygon(
            9% 0,
            100% 0,
            100% 100%,
            10% 100%,
            3% 86%,
            11% 74%,
            1% 62%,
            10% 50%,
            3% 38%,
            12% 28%,
            2% 18%,
            9% 8%
        );

    transform:
        translateX(105%);
}

/* 第一階段：兩邊猛撞到中央 */

#tearTransition.cover .tear-left{
    animation:
        tearLeftCover
        .30s
        cubic-bezier(.76,0,.24,1)
        forwards;
}

#tearTransition.cover .tear-right{
    animation:
        tearRightCover
        .30s
        cubic-bezier(.76,0,.24,1)
        forwards;
}

@keyframes tearLeftCover{

    0%{
        transform:
            translateX(-105%);
    }

    100%{
        transform:
            translateX(0);
    }

}

@keyframes tearRightCover{

    0%{
        transform:
            translateX(105%);
    }

    100%{
        transform:
            translateX(0);
    }

}

/* 第二階段：中間裂開 */

#tearTransition.open .tear-left{
    transform:
        translateX(0);

    animation:
        tearLeftOpen
        .78s
        cubic-bezier(.16,1,.3,1)
        forwards;
}

#tearTransition.open .tear-right{
    transform:
        translateX(0);

    animation:
        tearRightOpen
        .78s
        cubic-bezier(.16,1,.3,1)
        forwards;
}

@keyframes tearLeftOpen{

    0%{
        transform:
            translateX(0);
    }

    18%{
        transform:
            translateX(-3%);
    }

    100%{
        transform:
            translateX(-112%)
            rotate(-3deg);
    }

}

@keyframes tearRightOpen{

    0%{
        transform:
            translateX(0);
    }

    18%{
        transform:
            translateX(3%);
    }

    100%{
        transform:
            translateX(112%)
            rotate(3deg);
    }

}

/* 中央裂縫白光 */

#tearLight{
    position:absolute;

    left:50%;
    top:0;

    width:6px;
    height:100%;

    transform:
        translateX(-50%)
        scaleX(.15);

    background:#fff;

    opacity:0;

    box-shadow:
        0 0 12px #fff,
        0 0 26px #dc0000,
        0 0 55px #dc0000;

    z-index:5;
}

#tearTransition.open #tearLight{
    animation:
        tearLightOpen
        .55s
        ease-out
        forwards;
}

@keyframes tearLightOpen{

    0%{
        opacity:0;
        transform:
            translateX(-50%)
            scaleX(.1);
    }

    18%{
        opacity:1;
        transform:
            translateX(-50%)
            scaleX(1);
    }

    55%{
        opacity:1;
        transform:
            translateX(-50%)
            scaleX(7);
    }

    100%{
        opacity:0;
        transform:
            translateX(-50%)
            scaleX(26);
    }

}

/* =========================================================
   ANIMATION PAGE
   原本 Calling Card 動畫保留
========================================================= */

#canvasContainer{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    display:block;

    background:
        radial-gradient(
            circle at center,
            rgba(120,0,0,.18),
            rgba(0,0,0,.92) 68%
        );

    z-index:5;
}

#canvasContainer::before{
    content:"";

    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.018) 0px,
            rgba(255,255,255,.018) 1px,
            transparent 1px,
            transparent 4px
        );

    pointer-events:none;

    z-index:40;
}

/* =========================================================
   FALLING CALLING CARDS
========================================================= */

.falling-letter{
    position:absolute;

    background-image:
        url("cover.png");

    background-size:contain;
    background-repeat:no-repeat;

    pointer-events:none;

    will-change:transform;

    opacity:.46;

    z-index:10;
}

.falling-letter.far{
    opacity:.15;

    filter:
        blur(.6px);
}

.falling-letter.front{
    opacity:.78;

    z-index:16;

    filter:
        drop-shadow(
            0 5px 5px
            rgba(0,0,0,.5)
        )
        drop-shadow(
            0 0 8px
            rgba(220,0,0,.15)
        );
}

/* =========================================================
   P5 WORDS
========================================================= */

.p5-word{
    position:absolute;

    font-family:
        Impact,
        "Arial Black",
        sans-serif;

    font-weight:900;

    white-space:nowrap;

    pointer-events:none;
    user-select:none;

    letter-spacing:3px;

    color:
        rgba(0,0,0,.23);

    z-index:11;

    transform:
        rotate(var(--rotation));

    animation:
        wordFloat
        var(--duration)
        ease-in-out
        infinite;
}

.p5-word.white{
    color:
        rgba(255,255,255,.17);
}

.p5-word.red{
    color:
        rgba(220,0,0,.30);

    text-shadow:
        5px 5px 0
        rgba(0,0,0,.4);
}

/* =========================================================
   SLASH
========================================================= */

.p5-slash{
    position:absolute;

    pointer-events:none;

    transform:
        skewX(-25deg)
        rotate(-8deg);

    z-index:13;

    opacity:.75;

    animation:
        slashFloat
        var(--duration)
        ease-in-out
        infinite;
}

.p5-slash.black{
    background:#050505;
}

.p5-slash.white{
    background:#fff;
}

.p5-slash.red{
    background:#dc0000;

    box-shadow:
        0 0 12px
        rgba(220,0,0,.3);
}

/* =========================================================
   SPEED LINE
========================================================= */

.speed-line{
    position:absolute;

    height:4px;

    background:#050505;

    pointer-events:none;

    z-index:15;

    transform:
        rotate(var(--angle));

    animation:
        speedMove
        var(--duration)
        linear
        infinite;
}

.speed-line.white{
    background:#fff;
}

/* =========================================================
   PAPER
========================================================= */

.paper-fragment{
    position:absolute;

    pointer-events:none;

    z-index:14;

    background:#fff;

    transform:
        rotate(var(--rotation));

    animation:
        paperFall
        var(--duration)
        linear
        infinite;
}

.paper-fragment.black{
    background:#080808;
}

.paper-fragment.red{
    background:#dc0000;
}

.paper-strip{
    position:absolute;

    pointer-events:none;

    z-index:12;

    background:
        rgba(255,255,255,.75);

    transform:
        rotate(var(--rotation))
        skewX(-25deg);

    animation:
        stripMove
        var(--duration)
        ease-in-out
        infinite;
}

.paper-strip.black{
    background:
        rgba(0,0,0,.55);
}

/* =========================================================
   RED INK
========================================================= */

.ink-splatter{
    position:absolute;

    width:9px;
    height:9px;

    background:#dc0000;

    border-radius:50%;

    pointer-events:none;

    z-index:17;

    opacity:.82;

    box-shadow:
        0 0 7px
        rgba(220,0,0,.35);

    transform:
        translate(0,0)
        scale(var(--scale))
        rotate(var(--rotation));

    animation:
        inkSplatter
        var(--duration)
        ease-out
        forwards;
}

.ink-splatter::before,
.ink-splatter::after{
    content:"";

    position:absolute;

    background:#dc0000;

    border-radius:50%;
}

.ink-splatter::before{
    width:5px;
    height:5px;

    left:var(--dot-x);
    top:var(--dot-y);
}

.ink-splatter::after{
    width:3px;
    height:3px;

    left:var(--dot-x2);
    top:var(--dot-y2);
}

@keyframes inkSplatter{

    0%{
        opacity:0;

        transform:
            translate(0,0)
            scale(.2)
            rotate(var(--rotation));
    }

    12%{
        opacity:.9;
    }

    65%{
        opacity:.8;
    }

    100%{
        opacity:0;

        transform:
            translate(
                var(--move-x),
                var(--move-y)
            )
            scale(var(--scale))
            rotate(
                calc(
                    var(--rotation)
                    +
                    100deg
                )
            );
    }

}

/* =========================================================
   VIDEO
========================================================= */

#videoContainer{
    display:none;

    position:fixed;
    inset:0;

    width:100vw;
    height:100vh;

    z-index:999;

    justify-content:center;
    align-items:center;

    pointer-events:none;
}

#bgVideo{
    max-width:88vw;
    max-height:80vh;

    object-fit:contain;

    filter:
        drop-shadow(
            0 0 45px
            rgba(0,0,0,.95)
        )
        contrast(1.08);

    animation:
        popIn
        .35s
        cubic-bezier(
            .175,
            .885,
            .32,
            1.275
        )
        forwards;
}

/* =========================================================
   FLASH
========================================================= */

#flashOverlay{
    display:none;

    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:99999;

    pointer-events:none;
}

.flash-animate{
    display:block !important;

    animation:
        flashEffect
        .55s
        ease-out
        forwards;
}

@keyframes flashEffect{

    0%{
        background:#fff;
        opacity:1;
    }

    12%{
        background:#dc0000;
        opacity:1;
    }

    22%{
        background:#000;
        opacity:1;
    }

    34%{
        background:#fff;
        opacity:1;
    }

    48%{
        background:#dc0000;
        opacity:1;
    }

    65%{
        background:#000;
        opacity:1;
    }

    100%{
        background:#000;
        opacity:0;
    }

}

/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes p5GlobalFall{

    0%{
        transform:
            translateY(0)
            rotate(var(--rot))
            scale(var(--sc));
    }

    100%{
        transform:
            translateY(120vh)
            rotate(
                calc(
                    var(--rot)
                    +
                    120deg
                )
            )
            scale(var(--sc));
    }

}

@keyframes wordFloat{

    0%{
        transform:
            translateY(0)
            rotate(var(--rotation));
    }

    50%{
        transform:
            translateY(-15px)
            rotate(var(--rotation));
    }

    100%{
        transform:
            translateY(0)
            rotate(var(--rotation));
    }

}

@keyframes slashFloat{

    0%{
        transform:
            translateX(-25px)
            skewX(-25deg)
            rotate(-8deg);
    }

    50%{
        transform:
            translateX(25px)
            skewX(-25deg)
            rotate(-8deg);
    }

    100%{
        transform:
            translateX(-25px)
            skewX(-25deg)
            rotate(-8deg);
    }

}

@keyframes speedMove{

    0%{
        transform:
            translateX(-35vw)
            rotate(var(--angle));
    }

    100%{
        transform:
            translateX(140vw)
            rotate(var(--angle));
    }

}

@keyframes paperFall{

    0%{
        transform:
            translateY(-20vh)
            translateX(0)
            rotate(var(--rotation));
    }

    50%{
        transform:
            translateY(50vh)
            translateX(30px)
            rotate(
                calc(
                    var(--rotation)
                    +
                    120deg
                )
            );
    }

    100%{
        transform:
            translateY(120vh)
            translateX(-30px)
            rotate(
                calc(
                    var(--rotation)
                    +
                    300deg
                )
            );
    }

}

@keyframes stripMove{

    0%{
        transform:
            translateX(-20px)
            rotate(var(--rotation))
            skewX(-25deg);
    }

    50%{
        transform:
            translateX(30px)
            rotate(var(--rotation))
            skewX(-25deg);
    }

    100%{
        transform:
            translateX(-20px)
            rotate(var(--rotation))
            skewX(-25deg);
    }

}

@keyframes popIn{

    0%{
        transform:
            scale(.9);

        opacity:0;
    }

    100%{
        transform:
            scale(1);

        opacity:1;
    }

}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width:600px){

    .royal-logo{
        width:330px;
        max-width:82vw;

        height:auto;

        margin-top:35px;

        transform:
            scale(.82)
            rotate(-7deg)
            skewX(-8deg);
    }

    .take-your-heart-img{
        width:330px;
        max-width:82vw;
    }

    .logo-ring.one{
        width:340px;
        height:170px;
    }

    .logo-ring.two{
        width:390px;
        height:205px;
    }

    .sub-txt{
        font-size:9px;

        letter-spacing:3px;

        margin-top:24px;
    }

    .sub-txt::before{
        border-top-width:6px;
        border-bottom-width:6px;
        border-left-width:10px;

        margin-right:8px;
    }

    .sub-txt::after{
        border-top-width:6px;
        border-bottom-width:6px;
        border-right-width:10px;

        margin-left:8px;
    }

    .start-slash.one{
        height:25px;
    }

    .start-slash.four{
        height:35px;
    }

    .start-label{
        font-size:6px;

        letter-spacing:3px;
    }

    #bgVideo{
        max-width:94vw;
        max-height:72vh;
    }

    /* 手機 P5 背景再稍微強一點 */

    .start-p5-word{
        opacity:.17;
    }

    .start-p5-word.red{
        color:
            rgba(220,0,0,.58);
    }

    .start-p5-word.white{
        color:
            rgba(255,255,255,.26);
    }

    /*
       手機最重要：
       拉開動畫稍慢，讓肉眼真的看得到
    */

    #tearTransition.open .tear-left{
        animation-duration:.95s;
    }

    #tearTransition.open .tear-right{
        animation-duration:.95s;
    }

    #tearTransition.open #tearLight{
        animation-duration:.70s;
    }

}

</style>

<div

>

    <div class="start-cut a"></div>
    <div class="start-cut b"></div>
    <div class="start-cut c"></div>
    <div class="start-cut d"></div>

    <!-- P5 新背景 -->

    <div
        id="startP5Decor"
        aria-hidden="true"
    ></div>

    <div class="start-label top">
        PHANTOM THIEVES // CONFIDENTIAL
    </div>

    <div class="start-label bottom">
        TAKE YOUR HEART // 20XX
    </div>

    <!-- 主 PNG Logo -->

    <div class="royal-logo">

        <div class="logo-ring one"></div>
        <div class="logo-ring two"></div>

        <img
            src="take-your-heart.png"
            class="take-your-heart-img"
            alt="TAKE YOUR HEART"
        >

    </div>

        CLICK TO OPEN THE CALLING CARD
    </div>

</div>

<!-- =========================================================
     撕開轉場

    <div class="tear-side tear-left"></div>

    <div id="tearLight"></div>

    <div class="tear-side tear-right"></div>

</div>

     FLASH
========================================================= -->

<div id="flashOverlay"></div>

<!-- =========================================================
     ANIMATION PAGE
========================================================= -->

<div id="canvasContainer"></div>

<audio
    id="audio"
    src="music.mp3"
    loop
    preload="auto">
</audio>

    <video
        id="bgVideo"
        src="bg-animation.mp4"
        loop
        muted
        playsinline
        preload="auto">
    </video>

</div>

<script>

/* =========================================================
   INITIALIZE
========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    ()=>{

        buildStartP5Decor();

        buildRealDenseWaterfall();

        buildP5Elements();

        initStartParallax();

    }
);

/* =========================================================
   START PAGE P5 DECOR
========================================================= */

function buildStartP5Decor(){

    const container =
        document.getElementById(
            "startP5Decor"
        );

    if(
        !container
    ){
        return;
    }

    container.innerHTML =
        "";

    const isMobile =
        window.innerWidth
        <=
        600;

    /* =====================================================
       HUGE WORDS
    ===================================================== */

    const words = [

        {
            text:
                "PHANTOM",

            cls:
                "white",

            size:
                isMobile
                    ?
                    59
                    :
                    108,

            left:
                "-3%",

            top:
                "10%",

            rot:
                "-9deg",

            dur:
                "6s"
        },

        {
            text:
                "TAKE YOUR HEART",

            cls:
                "red",

            size:
                isMobile
                    ?
                    34
                    :
                    62,

            left:
                isMobile
                    ?
                    "4%"
                    :
                    "5%",

            top:
                isMobile
                    ?
                    "28%"
                    :
                    "27%",

            rot:
                "-7deg",

            dur:
                "5.7s"
        },

        {
            text:
                "NOTICE",

            cls:
                "black",

            size:
                isMobile
                    ?
                    76
                    :
                    135,

            left:
                isMobile
                    ?
                    "48%"
                    :
                    "58%",

            top:
                isMobile
                    ?
                    "17%"
                    :
                    "13%",

            rot:
                "8deg",

            dur:
                "7s"
        },

        {
            text:
                "THE PHANTOM THIEVES",

            cls:
                "white",

            size:
                isMobile
                    ?
                    22
                    :
                    40,

            left:
                isMobile
                    ?
                    "-5%"
                    :
                    "7%",

            top:
                isMobile
                    ?
                    "70%"
                    :
                    "72%",

            rot:
                "-6deg",

            dur:
                "6.5s"
        },

        {
            text:
                "YOUR HEART",

            cls:
                "red",

            size:
                isMobile
                    ?
                    34
                    :
                    59,

            left:
                isMobile
                    ?
                    "55%"
                    :
                    "63%",

            top:
                isMobile
                    ?
                    "76%"
                    :
                    "72%",

            rot:
                "7deg",

            dur:
                "5.8s"
        },

        {
            text:
                "STEAL IT",

            cls:
                "black",

            size:
                isMobile
                    ?
                    51
                    :
                    90,

            left:
                isMobile
                    ?
                    "-8%"
                    :
                    "-1%",

            top:
                isMobile
                    ?
                    "48%"
                    :
                    "48%",

            rot:
                "10deg",

            dur:
                "6.2s"
        }

    ];

    words.forEach(

        item => {

            const word =
                document.createElement(
                    "div"
                );

            word.className =

                "start-p5-word "
                +
                item.cls;

            word.textContent =
                item.text;

            word.style.fontSize =
                item.size
                +
                "px";

            word.style.left =
                item.left;

            word.style.top =
                item.top;

            word.style.setProperty(
                "--rot",
                item.rot
            );

            word.style.setProperty(
                "--dur",
                item.dur
            );

            container.appendChild(
                word
            );

        }

    );

    /* =====================================================
       BURST STARS
    ===================================================== */

    const burstCount =
        isMobile
            ?
            7
            :
            11;

    for(
        let i = 0;
        i < burstCount;
        i++
    ){

        const burst =
            document.createElement(
                "div"
            );

        burst.className =
            "start-burst";

        burst.style.setProperty(
            "--size",
            (
                Math.random()
                *
                (
                    isMobile
                        ?
                        55
                        :
                        85
                )
                +
                (
                    isMobile
                        ?
                        38
                        :
                        55
                )
            )
            +
            "px"
        );

        burst.style.setProperty(
            "--x",
            Math.random()
            *
            88
            +
            2
            +
            "%"
        );

        burst.style.setProperty(
            "--y",
            Math.random()
            *
            80
            +
            5
            +
            "%"
        );

        burst.style.setProperty(
            "--o",
            (
                Math.random()
                *
                .24
                +
                .16
            )
            .toFixed(2)
        );

        burst.style.setProperty(
            "--r",
            Math.random()
            *
            360
            +
            "deg"
        );

        burst.style.setProperty(
            "--d",
            (
                Math.random()
                *
                9
                +
                8
            )
            .toFixed(2)
            +
            "s"
        );

        burst.style.setProperty(
            "--c",
            Math.random()
            >
            .48
                ?
                "#dc0000"
                :
                "#ffffff"
        );

        container.appendChild(
            burst
        );

    }

    /* =====================================================
       X MARKS
    ===================================================== */

    const xCount =
        isMobile
            ?
            9
            :
            15;

    for(
        let i = 0;
        i < xCount;
        i++
    ){

        const mark =
            document.createElement(

/* =========================================================
   START PARALLAX
========================================================= */

function initStartParallax(){

    const start =
        document.getElementById(
            "startScreen"
        );

    if(
        !start
    ){
        return;
    }

    if(
        window.matchMedia(
            "(pointer:fine)"
        ).matches
    ){

        start.addEventListener(
            "pointermove",
            e => {

                if(
                    launched
                ){
                    return;
                }

                const x =
                    e.clientX
                    /
                    window.innerWidth
                    -
                    .5;

                const y =
                    e.clientY
                    /
                    window.innerHeight
                    -
                    .5;

                start.style.setProperty(
                    "--logoX",
                    x
                    *
                    12
                    +
                    "px"
                );

                start.style.setProperty(
                    "--logoY",
                    y
                    *
                    9
                    +
                    "px"
                );

            }
        );

    }

}

function createCallingCard(
    initial = false
){

    const container =
        document.getElementById(
            "canvasContainer"
        );

    const letter =
        document.createElement(
            "div"
        );

    letter.className =
        "falling-letter";

    const depth =
        Math.random();

    if(
        depth < .25
    ){

        letter.classList.add(
            "far"
        );

    }
    else if(
        depth > .78
    ){

        letter.classList.add(
            "front"
        );

    }

    let sizeWidth;

    if(
        depth < .25
    ){

        sizeWidth =
            Math.floor(
                Math.random()
                *
                30
            )
            +
            22;

    }
    else if(
        depth > .78
    ){

        sizeWidth =
            Math.floor(
                Math.random()
                *
                80
            )
            +
            55;

    }
    else{

        sizeWidth =
            Math.floor(
                Math.random()
                *
                55
            )
            +
            30;

    }

    const sizeHeight =
        sizeWidth
        *
        1.3;

    const left =
        Math.random()
        *
        96;

    const top =
        initial
            ?
            Math.random()
            *
            115
            -
            15
            :
            -18;

    let duration;

    if(
        depth < .25
    ){

        duration =
            Math.random()
            *
            4
            +
            6;

    }
    else if(
        depth > .78
    ){

        duration =
            Math.random()
            *
            2
            +
            2.5;

    }
    else{

        duration =
            Math.random()
            *
            3
            +
            3;

    }

    const rotation =
        Math.random()
        *
        100
        -
        50;

    const scale =
        (
            Math.random()
            *
            .45
            +
            .55
        )
        .toFixed(2);

    letter.style.width =
        sizeWidth
        +
        "px";

    letter.style.height =
        sizeHeight
        +
        "px";

    letter.style.left =
        left
        +
        "vw";

    letter.style.top =
        top
        +
        "vh";

    letter.style.setProperty(
        "--rot",
        rotation
        +
        "deg"
    );

    letter.style.setProperty(
        "--sc",
        scale
    );

    letter.style.transform =
        `rotate(${rotation}deg)
         scale(${scale})`;

    letter.dataset.duration =
        duration;

    container.appendChild(
        letter
    );

    if(
        !initial
    ){

        letter.style.animation =
            `p5GlobalFall
             ${duration}s
             linear`;

        setTimeout(
            ()=>{
                letter.remove();
            },
            duration
            *
            1000
            +
            200
        );

    }

}

/* =========================================================
   LAUNCH
========================================================= */

let launched =
    false;

function launchPhantom(
    event
){

    if(
        launched
    ){
        return;
    }

    launched =
        true;

    const audio =
        document.getElementById(
            "audio"
        );

    const video =
        document.getElementById(
            "bgVideo"
        );

    const startScreen =
        document.getElementById(
            "startScreen"
        );

    const flashOverlay =
        document.getElementById(
            "flashOverlay"
        );

    const canvasContainer =
        document.getElementById(
            "canvasContainer"
        );

    const videoContainer =
        document.getElementById(
            "videoContainer"
        );

    const tear =
        document.getElementById(
            "tearTransition"
        );

    /* AUDIO */

    audio.volume =
        1;

    audio
        .play()
        .catch(
            e => console.log(e)
        );

    /* VIDEO */

    video
        .play()
        .catch(
            e => console.log(e)
        );

    startScreen.style.pointerEvents =
        "none";

    /*
       STEP 1
       黑色撕裂紙從左右撞到中央
    */

    tear.classList.add(
        "active"
    );

    tear.classList.add(
        "cover"
    );

    /*
       Logo 同時猛烈往前衝
    */

    startScreen.style.transition =
        "transform .30s cubic-bezier(.16,1,.3,1), filter .3s ease";

    startScreen.style.transform =
        "scale(1.13)";

    startScreen.style.filter =
        "contrast(1.22) brightness(1.13)";

    /*
       STEP 2
       被黑幕完全遮住後，
       顯示後面的動畫頁
    */

    setTimeout(
        ()=>{

            startScreen.style.display =
                "none";

            document.body.style.backgroundColor =
                "#dc0000";

            canvasContainer.style.display =
                "block";

            videoContainer.style.display =
                "flex";

            const letters =
                document.querySelectorAll(
                    ".falling-letter"
                );

            letters.forEach(
                letter => {

                    const duration =
                        letter.dataset.duration;

                    letter.style.animation =
                        `p5GlobalFall
                         ${duration}s
                         linear
                         infinite`;

                }
            );

        },
        300
    );

    /*
       STEP 3
       中央停一瞬間後真正拉開
    */

    setTimeout(
        ()=>{

            tear.classList.remove(
                "cover"
            );

            tear.classList.add(
                "open"
            );

            /*
               撕開瞬間再閃一次
            */

            flashOverlay.classList.add(
                "flash-animate"
            );

        },
        430
    );

    /*
       清除撕裂層
    */

    setTimeout(
        ()=>{

            tear.classList.remove(
                "active",
                "open"
            );

        },
        1450
    );

    setTimeout(
        ()=>{

            flashOverlay.classList.remove(
                "flash-animate"
            );

        },
        1100
    );

    /* =====================================================
       CONTINUOUS ORIGINAL EFFECTS
    ===================================================== */

    setInterval(
        ()=>{
            supplementLetter();
        },
        80
    );

    setInterval(
        ()=>{
            supplementPaper();
        },
        160
    );

    setInterval(
        ()=>{
            supplementSpeedLine();
        },
        220
    );

    setInterval(
        ()=>{
            supplementInkSplatter();
        },
        500
    );

    setInterval(
        ()=>{
            supplementSlash();
        },
        900
    );

}
