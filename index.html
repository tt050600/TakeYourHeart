<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no,
    viewport-fit=cover"
>

<title>Take Your Heart</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    position:relative;
    font-family:Impact,"Arial Black",Arial,sans-serif;
}

/* =========================================================
   START SCREEN
========================================================= */

#startScreen{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;

    --logoX:0px;
    --logoY:0px;
    --bgX:0px;
    --bgY:0px;

    background:
        radial-gradient(
            ellipse at center,
            rgba(70,0,0,.38) 0%,
            rgba(20,0,0,.18) 32%,
            rgba(5,5,5,.96) 75%,
            #000 100%
        );

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    z-index:10000;

    cursor:pointer;
    overflow:hidden;
    isolation:isolate;
}

/* 中央紅光 */

#startScreen::before{
    content:"";

    position:absolute;

    width:70vw;
    height:70vw;

    max-width:900px;
    max-height:900px;

    left:50%;
    top:48%;

    transform:
        translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(220,0,0,.20) 0%,
            rgba(220,0,0,.08) 30%,
            transparent 68%
        );

    filter:
        blur(10px);

    pointer-events:none;

    z-index:-3;

    animation:
        centerPulse
        2.8s
        ease-in-out
        infinite;
}

@keyframes centerPulse{

    0%,
    100%{

        opacity:.55;

        transform:
            translate(-50%,-50%)
            scale(.92);

    }

    50%{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.12);

    }

}

/* 掃描線 */

#startScreen::after{

    content:"";

    position:absolute;

    inset:0;

    background:

        repeating-linear-gradient(

            0deg,

            rgba(255,255,255,.025)
            0px,

            rgba(255,255,255,.025)
            1px,

            transparent
            1px,

            transparent
            5px

        );

    mix-blend-mode:
        screen;

    pointer-events:none;

    z-index:20;

    opacity:.55;
}

/* =========================================================
   BACKGROUND CUTS
========================================================= */

.start-slash{

    position:absolute;

    pointer-events:none;

    transform:
        rotate(-12deg)
        skewX(-25deg);

    transform-origin:
        center;
}

.start-slash.one{

    width:140vw;
    height:34px;

    top:17%;
    left:-25%;

    background:#dc0000;

    opacity:.85;

    box-shadow:
        0 0 18px
        rgba(220,0,0,.5);

    animation:
        slashOne
        3.2s
        ease-in-out
        infinite;
}

.start-slash.two{

    width:100vw;
    height:9px;

    top:29%;
    right:-30%;

    background:#fff;

    opacity:.65;

    animation:
        slashTwo
        2.6s
        ease-in-out
        infinite;
}

.start-slash.three{

    width:125vw;
    height:12px;

    bottom:20%;
    left:-15%;

    background:#dc0000;

    opacity:.72;

    box-shadow:
        0 0 16px
        rgba(220,0,0,.4);

    animation:
        slashThree
        3s
        ease-in-out
        infinite;
}

.start-slash.four{

    width:70vw;
    height:48px;

    bottom:28%;
    right:-15%;

    background:#000;

    opacity:.95;

    box-shadow:
        0 0 0 2px
        rgba(255,255,255,.08);

    animation:
        slashFour
        3.8s
        ease-in-out
        infinite;
}

@keyframes slashOne{

    0%,
    100%{

        transform:
            translateX(-3vw)
            rotate(-12deg)
            skewX(-25deg);

    }

    50%{

        transform:
            translateX(5vw)
            rotate(-12deg)
            skewX(-25deg);

    }

}

@keyframes slashTwo{

    0%,
    100%{

        transform:
            translateX(0)
            rotate(-12deg)
            skewX(-25deg);

        opacity:.35;

    }

    50%{

        transform:
            translateX(-7vw)
            rotate(-12deg)
            skewX(-25deg);

        opacity:.9;

    }

}

@keyframes slashThree{

    0%,
    100%{

        transform:
            translateX(0)
            rotate(-12deg)
            skewX(-25deg);

    }

    50%{

        transform:
            translateX(-5vw)
            rotate(-12deg)
            skewX(-25deg);

    }

}

@keyframes slashFour{

    0%,
    100%{

        transform:
            translateX(0)
            rotate(-12deg)
            skewX(-25deg);

    }

    50%{

        transform:
            translateX(-4vw)
            rotate(-12deg)
            skewX(-25deg);

    }

}

/* =========================================================
   EXTRA CUTTING BARS
========================================================= */

.start-cut{

    position:absolute;

    pointer-events:none;

    z-index:2;

    transform:
        rotate(-10deg)
        skewX(-28deg);
}

.start-cut.a{

    width:38vw;
    height:7px;

    left:-5vw;
    top:39%;

    background:#fff;

    opacity:.5;

    animation:
        cutMoveA
        2.2s
        ease-in-out
        infinite;
}

.start-cut.b{

    width:50vw;
    height:4px;

    right:-12vw;
    top:43%;

    background:#dc0000;

    opacity:.8;

    animation:
        cutMoveB
        1.8s
        ease-in-out
        infinite;
}

.start-cut.c{

    width:32vw;
    height:10px;

    left:2vw;
    bottom:39%;

    background:#000;

    opacity:.95;
}

.start-cut.d{

    width:45vw;
    height:5px;

    right:-8vw;
    bottom:42%;

    background:#fff;

    opacity:.38;
}

@keyframes cutMoveA{

    0%,
    100%{

        transform:
            translateX(0)
            rotate(-10deg)
            skewX(-28deg);

    }

    50%{

        transform:
            translateX(7vw)
            rotate(-10deg)
            skewX(-28deg);

    }

}

@keyframes cutMoveB{

    0%,
    100%{

        transform:
            translateX(5vw)
            rotate(-10deg)
            skewX(-28deg);

    }

    50%{

        transform:
            translateX(-5vw)
            rotate(-10deg)
            skewX(-28deg);

    }

}

/* =========================================================
   IMPACT RAYS
========================================================= */

.start-impact-rays{

    position:absolute;

    left:50%;
    top:49%;

    width:
        min(
            1100px,
            105vw
        );

    aspect-ratio:1;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:

        repeating-conic-gradient(

            from -8deg,

            rgba(220,0,0,.16)
            0deg
            1.2deg,

            transparent
            1.2deg
            7deg,

            rgba(255,255,255,.055)
            7deg
            7.7deg,

            transparent
            7.7deg
            14deg

        );

    -webkit-mask-image:
        radial-gradient(
            circle,
            transparent 0 19%,
            #000 34%,
            transparent 72%
        );

    mask-image:
        radial-gradient(
            circle,
            transparent 0 19%,
            #000 34%,
            transparent 72%
        );

    opacity:.46;

    z-index:-1;

    pointer-events:none;

    animation:
        royalRayTurn
        24s
        linear
        infinite;

    translate:
        var(--bgX)
        var(--bgY);
}

@keyframes royalRayTurn{

    to{

        transform:
            translate(-50%,-50%)
            rotate(360deg);

    }

}

/* =========================================================
   ROYAL HALO
========================================================= */

.royal-halo{

    position:absolute;

    left:50%;
    top:49%;

    width:
        min(
            600px,
            88vw
        );

    aspect-ratio:
        2.25 / 1;

    transform:
        translate(-50%,-50%)
        rotate(-7deg);

    pointer-events:none;

    z-index:2;

    opacity:.56;
}

.royal-halo::before,
.royal-halo::after{

    content:"";

    position:absolute;

    inset:0;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:

        inset
        0 0 0 1px
        rgba(220,0,0,.08),

        0 0 34px
        rgba(220,0,0,.08);
}

.royal-halo::before{

    border-left-color:
        rgba(220,0,0,.72);

    border-right-color:
        rgba(220,0,0,.35);

    animation:
        haloOrbit
        6s
        linear
        infinite;
}

.royal-halo::after{

    inset:11%;

    border-top-color:
        rgba(255,255,255,.42);

    border-bottom-color:
        rgba(220,0,0,.44);

    animation:
        haloOrbitReverse
        4.3s
        linear
        infinite;
}

@keyframes haloOrbit{

    to{
        transform:
            rotate(360deg);
    }

}

@keyframes haloOrbitReverse{

    to{
        transform:
            rotate(-360deg);
    }

}

/* =========================================================
   LOGO AREA
========================================================= */

.royal-logo{

    position:relative;

    z-index:6;

    margin-top:42px;

    width:430px;
    max-width:85vw;

    user-select:none;

    transform:
        rotate(-7deg)
        skewX(-8deg);

    filter:

        drop-shadow(
            9px
            10px
            0
            #000
        )

        drop-shadow(
            13px
            13px
            0
            #dc0000
        );

    animation:

        logoEntrance
        .9s
        cubic-bezier(
            .16,
            1,
            .3,
            1
        )
        both,

        logoFloat
        2.8s
        ease-in-out
        .9s
        infinite;

    translate:
        var(--logoX)
        var(--logoY);

    transition:
        translate
        .16s
        ease-out,
        filter
        .18s
        ease-out;

    will-change:
        translate;
}

.royal-logo:hover{

    filter:

        drop-shadow(
            10px
            11px
            0
            #000
        )

        drop-shadow(
            15px
            15px
            0
            #dc0000
        )

        drop-shadow(
            0
            0
            28px
            rgba(220,0,0,.30)
        );
}

/* 紅色套印 */

.royal-logo::before{

    content:"";

    position:absolute;

    inset:-3px;

    background:

        url(
            "take-your-heart.png"
        )

        center
        /
        contain
        no-repeat;

    pointer-events:none;

    opacity:.28;

    transform:
        translate(
            5px,
            3px
        );

    mix-blend-mode:
        screen;

    z-index:-1;

    animation:
        printShiftRed
        1.7s
        steps(
            2,
            end
        )
        infinite;
}

/* 黑色套印 */

.royal-logo::after{

    content:"";

    position:absolute;

    inset:-3px;

    background:

        url(
            "take-your-heart.png"
        )

        center
        /
        contain
        no-repeat;

    pointer-events:none;

    opacity:.20;

    transform:
        translate(
            -4px,
            -3px
        );

    mix-blend-mode:
        multiply;

    z-index:-1;

    animation:
        printShiftBlack
        2s
        steps(
            2,
            end
        )
        infinite;
}

.take-your-heart-img{

    display:block;

    width:100%;
    height:auto;

    object-fit:contain;

    transform-origin:
        center
        center;

    animation:

        heartFloat
        2.8s
        ease-in-out
        infinite,

        logoGlitch
        4.5s
        steps(
            1,
            end
        )
        infinite;
}

/* 金屬高光 */

.logo-glint{

    position:absolute;

    inset:-12%;

    z-index:9;

    pointer-events:none;

    background:

        linear-gradient(

            110deg,

            transparent
            0
            38%,

            rgba(255,255,255,.05)
            44%,

            rgba(255,245,190,.85)
            49%,

            rgba(255,255,255,.15)
            54%,

            transparent
            60%
            100%

        );

    background-size:
        240%
        100%;

    background-position:
        140%
        0;

    -webkit-mask-image:
        url(
            "take-your-heart.png"
        );

    -webkit-mask-repeat:
        no-repeat;

    -webkit-mask-position:
        center;

    -webkit-mask-size:
        contain;

    mask-image:
        url(
            "take-your-heart.png"
        );

    mask-repeat:
        no-repeat;

    mask-position:
        center;

    mask-size:
        contain;

    mix-blend-mode:
        screen;

    opacity:0;

    animation:
        logoGlint
        4.8s
        cubic-bezier(
            .2,
            .8,
            .2,
            1
        )
        1.4s
        infinite;
}

@keyframes logoGlint{

    0%,
    66%{

        opacity:0;

        background-position:
            140%
            0;
    }

    70%{

        opacity:.9;

    }

    84%{

        opacity:.45;

        background-position:
            -45%
            0;
    }

    90%,
    100%{

        opacity:0;

        background-position:
            -45%
            0;
    }

}

@keyframes logoEntrance{

    0%{

        opacity:0;

        transform:

            translateY(
                45px
            )

            scale(
                .72
            )

            rotate(
                -13deg
            )

            skewX(
                -12deg
            );

        filter:

            drop-shadow(
                0
                0
                0
                transparent
            );
    }

    70%{

        opacity:1;

        transform:

            translateY(
                -5px
            )

            scale(
                1.06
            )

            rotate(
                -6deg
            )

            skewX(
                -8deg
            );
    }

    100%{

        opacity:1;

        transform:

            rotate(
                -7deg
            )

            skewX(
                -8deg
            );
    }

}

@keyframes logoFloat{

    0%,
    100%{

        transform:

            rotate(
                -7deg
            )

            skewX(
                -8deg
            )

            translateY(
                0
            );
    }

    50%{

        transform:

            rotate(
                -7deg
            )

            skewX(
                -8deg
            )

            translateY(
                -5px
            );
    }

}

@keyframes heartFloat{

    0%,
    100%{

        transform:

            translateY(
                0
            )

            scale(
                1
            )

            rotate(
                0deg
            );
    }

    25%{

        transform:

            translateY(
                -7px
            )

            scale(
                1.025
            )

            rotate(
                -1deg
            );
    }

    50%{

        transform:

            translateY(
                0
            )

            scale(
                1.04
            )

            rotate(
                0deg
            );
    }

    75%{

        transform:

            translateY(
                7px
            )

            scale(
                1.025
            )

            rotate(
                1deg
            );
    }

}

@keyframes logoGlitch{

    0%,
    82%,
    100%{

        clip-path:
            inset(
                0
                0
                0
                0
            );

    }

    84%{

        clip-path:
            inset(
                8%
                0
                72%
                0
            );

        transform:
            translate(
                3px,
                -1px
            )
            scale(
                1.01
            );
    }

    86%{

        clip-path:
            inset(
                60%
                0
                22%
                0
            );

        transform:
            translate(
                -3px,
                2px
            )
            scale(
                1.01
            );
    }

    88%{

        clip-path:
            inset(
                0
                0
                0
                0
            );

    }

}

@keyframes printShiftRed{

    0%,
    100%{

        transform:
            translate(
                3px,
                2px
            );

        opacity:.22;
    }

    20%{

        transform:
            translate(
                6px,
                3px
            );

        opacity:.30;
    }

    40%{

        transform:
            translate(
                2px,
                1px
            );

        opacity:.18;
    }

    60%{

        transform:
            translate(
                5px,
                4px
            );

        opacity:.28;
    }

    80%{

        transform:
            translate(
                3px,
                2px
            );

        opacity:.24;
    }

}

@keyframes printShiftBlack{

    0%,
    100%{

        transform:
            translate(
                -3px,
                -2px
            );

        opacity:.16;
    }

    25%{

        transform:
            translate(
                -5px,
                -3px
            );

        opacity:.22;
    }

    50%{

        transform:
            translate(
                -2px,
                -1px
            );

        opacity:.14;
    }

    75%{

        transform:
            translate(
                -4px,
                -3px
            );

        opacity:.20;
    }

}

/* =========================================================
   LOGO ENERGY RINGS
========================================================= */

.logo-ring{

    position:absolute;

    left:50%;
    top:50%;

    border:
        1px solid
        rgba(220,0,0,.22);

    transform:
        translate(
            -50%,
            -50%
        )
        rotate(
            -7deg
        );

    pointer-events:none;

    z-index:1;
}

.logo-ring.one{

    width:480px;
    height:210px;

    border-color:
        rgba(
            220,
            0,
            0,
            .25
        );

    animation:
        ringPulse
        2.8s
        ease-out
        infinite;
}

.logo-ring.two{

    width:540px;
    height:250px;

    border-color:
        rgba(
            255,
            255,
            255,
            .10
        );

    animation:
        ringPulse
        2.8s
        ease-out
        .8s
        infinite;
}

@keyframes ringPulse{

    0%{

        opacity:0;

        transform:

            translate(
                -50%,
                -50%
            )

            rotate(
                -7deg
            )

            scale(
                .86
            );
    }

    30%{

        opacity:.75;

    }

    100%{

        opacity:0;

        transform:

            translate(
                -50%,
                -50%
            )

            rotate(
                -7deg
            )

            scale(
                1.14
            );
    }

}

/* =========================================================
   ROYAL SHARDS
========================================================= */

.royal-shard{

    position:absolute;

    width:
        var(--w);

    height:
        var(--h);

    left:
        var(--x);

    top:
        var(--y);

    background:
        var(--c);

    opacity:
        var(--o);

    transform:
        rotate(
            var(--r)
        );

    pointer-events:none;

    z-index:4;

    box-shadow:
        2px
        2px
        0
        rgba(0,0,0,.75);

    animation:

        shardDrift

        var(--d)

        ease-in-out

        var(--delay)

        infinite

        alternate;
}

@keyframes shardDrift{

    from{

        translate:
            0
            0;

        rotate:
            0deg;

    }

    to{

        translate:
            var(--dx)
            var(--dy);

        rotate:
            9deg;

    }

}

/* =========================================================
   CLICK TEXT
========================================================= */

.sub-txt{

    position:relative;

    z-index:7;

    margin-top:30px;

    color:#dc0000;

    font-family:
        Impact,
        "Arial Black",
        Arial,
        sans-serif;

    font-size:13px;

    font-weight:900;

    letter-spacing:4px;

    text-align:center;

    isolation:isolate;

    text-shadow:

        2px
        2px
        0
        #000,

        0
        0
        12px
        rgba(220,0,0,.4);

    animation:

        clickBlink
        1.4s
        ease-in-out
        infinite,

        textEntrance
        .9s
        cubic-bezier(
            .16,
            1,
            .3,
            1
        )
        .2s
        both;
}

.sub-txt span{

    position:relative;

    display:inline-block;
}

.sub-txt span::after{

    content:"";

    position:absolute;

    left:-4%;
    right:-4%;

    bottom:-8px;

    height:2px;

    background:

        linear-gradient(

            90deg,

            transparent,

            #dc0000
            22%,

            #fff
            52%,

            #dc0000
            78%,

            transparent

        );

    transform:
        scaleX(.22);

    opacity:.45;

    transform-origin:
        center;

    animation:
        ctaCharge
        1.4s
        ease-in-out
        infinite;
}

@keyframes ctaCharge{

    50%{

        transform:
            scaleX(1);

        opacity:1;

    }

}

.sub-txt::before{

    content:"";

    display:inline-block;

    width:0;
    height:0;

    border-top:
        7px solid
        transparent;

    border-bottom:
        7px solid
        transparent;

    border-left:
        11px solid
        #dc0000;

    margin-right:14px;

    vertical-align:middle;

    animation:
        arrowLeft
        .9s
        ease-in-out
        infinite;

    filter:
        drop-shadow(
            2px
            2px
            0
            #000
        );
}

.sub-txt::after{

    content:"";

    display:inline-block;

    width:0;
    height:0;

    border-top:
        7px solid
        transparent;

    border-bottom:
        7px solid
        transparent;

    border-right:
        11px solid
        #dc0000;

    margin-left:14px;

    vertical-align:middle;

    animation:
        arrowRight
        .9s
        ease-in-out
        infinite;

    filter:
        drop-shadow(
            -2px
            2px
            0
            #000
        );
}

@keyframes textEntrance{

    0%{

        opacity:0;

        transform:
            translateY(
                25px
            );

        letter-spacing:10px;
    }

    100%{

        opacity:1;

        transform:

<script>

window.addEventListener(
    "DOMContentLoaded",
    ()=>{
        buildRealDenseWaterfall();
        buildP5Elements();
        buildRoyalShards();
        initRoyalParallax();
    }
);

/* =========================================================
   CALLING CARD WATERFALL
========================================================= */

function buildRealDenseWaterfall(){

    const count =
        220;

    for(
        let i = 0;
        i < count;
        i++
    ){

        createCallingCard(
            true
        );

    }

}

function createCallingCard(
    initial = false
){

    const container =
        document.getElementById(
            "canvasContainer"
        );

    const letter =
        document.createElement(
            "div"
        );

    letter.className =
        "falling-letter";

    const depth =
        Math.random();

    if(
        depth < .25
    ){

        letter.classList.add(
            "far"
        );

/* =========================================================
   PARALLAX
========================================================= */

function initRoyalParallax(){

    const start =
        document.getElementById(
            "startScreen"
        );

    if(
        !start
    ){

        return;

    }

    if(

        window.matchMedia
        &&

        window.matchMedia(
            "(pointer:fine)"
        ).matches

    ){

        start.addEventListener(

            "pointermove",

            event => {

                if(
                    launched
                ){

                    return;

                }

                const nx =
                    event.clientX
                    /
                    window.innerWidth
                    -
                    .5;

                const ny =
                    event.clientY
                    /
                    window.innerHeight
                    -
                    .5;

                start.style.setProperty(
                    "--logoX",
                    nx
                    *
                    12
                    +
                    "px"
                );

                start.style.setProperty(
                    "--logoY",
                    ny
                    *
                    9
                    +
                    "px"
                );

                start.style.setProperty(
                    "--bgX",
                    nx
                    *
                    -9
                    +
                    "px"
                );

                start.style.setProperty(
                    "--bgY",
                    ny
                    *
                    -7
                    +
                    "px"
                );

            }

        );

        start.addEventListener(

            "pointerleave",

            ()=>{

                start.style.setProperty(
                    "--logoX",
                    "0px"
                );

                start.style.setProperty(
                    "--logoY",
                    "0px"
                );

                start.style.setProperty(
                    "--bgX",
                    "0px"
                );

                start.style.setProperty(
                    "--bgY",
                    "0px"
                );

            }

        );

    }

}

/* =========================================================
   IMPACT
========================================================= */

function triggerRoyalImpact(
    event
){

    const burst =
        document.getElementById(
            "impactBurst"
        );

    const transition =
        document.getElementById(
            "royalTransition"
        );

    const x =

        event
        &&
        Number.isFinite(
            event.clientX
        )

        ?

        event.clientX

        :

        window.innerWidth
        /
        2;

    const y =

        event
        &&
        Number.isFinite(
            event.clientY
        )

        ?

        event.clientY

        :

        window.innerHeight
        /
        2;

    burst.style.setProperty(
        "--cx",
        x
        +
        "px"
    );

    burst.style.setProperty(
        "--cy",
        y
        +
        "px"
    );

    burst.classList.remove(
        "active"
    );

    void
        burst.offsetWidth;

    burst.classList.add(
        "active"
    );

    transition.classList.add(
        "active"
    );

    setTimeout(

        ()=>{

            burst.classList.remove(
                "active"
            );

        },

        620
    );

    setTimeout(

        ()=>{

            transition.classList.remove(
                "active"
            );

        },

        760
    );

}

    line.style.setProperty(
        "--duration",
        duration
        +
        "s"
    );

    line.style.animation =

        `speedMove
         ${duration}s
         linear`;

    container.appendChild(
        line
    );

    setTimeout(

        ()=>{

            line.remove();

        },

        duration
        *
        1000
        +
        300

    );

}

/* =========================================================
   SUPPLEMENT INK
========================================================= */

function supplementInkSplatter(){

    const container =
        document.getElementById(
            "canvasContainer"
        );

    const splatters =
        container.querySelectorAll(
            ".ink-splatter"
        );

    if(
        splatters.length
        >
        45
    ){

        return;

    }

    createInkSplatter(
        false
    );

}

/* =========================================================
   SUPPLEMENT SLASH
========================================================= */

function supplementSlash(){

    const container =
        document.getElementById(
            "canvasContainer"
        );

    const slash =
        document.createElement(
            "div"
        );

    slash.className =
        "p5-slash";

    const type =
        Math.random();

    if(
        type < .45
    ){

        slash.classList.add(
            "black"
        );

    }
    else if(
        type < .72
    ){

        slash.classList.add(
            "red"
        );

    }
    else{

        slash.classList.add(
            "white"
        );

    }

    slash.style.width =

        Math.floor(
            Math.random()
            *
            180
        )
        +
        45
        +
        "px";

    slash.style.height =

        Math.floor(
            Math.random()
            *
            18
        )
        +
        5
        +
        "px";

    slash.style.left =
        "-20vw";

    slash.style.top =
        Math.random()
        *
        100
        +
        "vh";

    slash.style.setProperty(
        "--duration",
        Math.random()
        *
        2
        +
        2
        +
        "s"
    );

    container.appendChild(
        slash
    );

    setTimeout(

        ()=>{

            slash.remove();

        },

        4500

    );

}

</script>
