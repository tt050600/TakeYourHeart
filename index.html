<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Take Your Heart</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body, html { 
    width: 100%; 
    height: 100%; 
    background-color: #0b0b0b; 
    overflow: hidden; 
}

/* 一進來就直接貼臉的預告信大圖 */
#letterContainer {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    background-color: #0b0b0b;
}

#letterContainer img {
    width: 100%;
    height: 100%;
    object-fit: contain; /* 確保整張預告信完整顯示，字不被切到 */
    padding: 5px;
    transition: transform 0.1s ease;
}

/* 💥 激發後的震懾彈入動畫 */
.letter-boost img {
    animation: phantomPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.3) forwards;
}

/* 🎨 經典 P5 斬擊閃爍特效層 */
#flashOverlay {
    display: none; 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    z-index: 99; 
    animation: p5Flash 0.3s ease-out;
}

/* 轉場動畫：紅白黑極速閃爍 */
@keyframes p5Flash {
    0% { background: #fff; opacity: 1; }
    33% { background: #dc0000; opacity: 1; }
    66% { background: #fff; opacity: 1; }
    100% { opacity: 0; }
}

/* 圖片震撼彈入：從縮小、微旋轉到猛烈放大貼臉 */
@keyframes phantomPop {
    0% { transform: scale(0.8) rotate(-3deg); opacity: 0.5; }
    70% { transform: scale(1.05) rotate(1deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
</style>
</head>
<body>

    <!-- 💡 新增 preload="auto"：網頁一開立刻強制下載音樂，消滅幾秒鐘的延遲！ -->
    <audio id="audio" src="music.mp3" loop preload="auto"></audio>

    <!-- 紅白斬擊閃爍層 -->
    <div id="flashOverlay"></div>

    <!-- 一進來就直接貼臉的預告信大圖 -->
    <div id="letterContainer" onclick="triggerPhantomAttack()">
        <img src="cover.png" alt="預告信">
    </div>

    <script>
    let isTriggered = false;
    
    function triggerPhantomAttack() {
        const audio = document.getElementById('audio');
        const flash = document.getElementById('flashOverlay');
        const container = document.getElementById('letterContainer');
        
        if (!isTriggered) {
            // 1. 零延遲炸裂音樂
            audio.play().catch(e => console.log(e));
            
            // 2. 啟動怪盜斬擊閃爍
            flash.style.display = 'block';
            
            // 3. 讓預告信產生劇烈彈入效果
            container.classList.add('letter-boost');
            
            // 4. 特效結束後隱藏閃爍層
            setTimeout(() => {
                flash.style.display = 'none';
            }, 300);
            
            isTriggered = true;
        } else {
            // 第二次點擊則暫停音樂，恢復原狀
            audio.pause();
            container.classList.remove('letter-boost');
            isTriggered = false;
        }
    }
    </script>
</body>
</html>
