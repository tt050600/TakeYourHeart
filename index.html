<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>TAKE YOUR HEART</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #080808;

    font-family:
        Impact,
        "Arial Black",
        Arial,
        sans-serif;
}


/* =========================================================
   START SCREEN
========================================================= */

#startScreen {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 10000;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    cursor: pointer;

    background:
        radial-gradient(
            circle at center,
            #1c1c1c 0%,
            #0c0c0c 48%,
            #030303 100%
        );

}


/* =========================================================
   START SCREEN GRAPHICS
========================================================= */

.start-slash {

    position: absolute;

    pointer-events: none;

    transform:
        rotate(-12deg)
        skewX(-25deg);

}


.start-slash.one {

    width: 125vw;
    height: 28px;

    top: 18%;

    left: -15%;

    background: #d90000;

    opacity: .9;

}


.start-slash.two {

    width: 80vw;
    height: 10px;

    top: 28%;

    right: -10%;

    background: #fff;

    opacity: .8;

}


.start-slash.three {

    width: 110vw;
    height: 12px;

    bottom: 18%;

    left: -15%;

    background: #d90000;

    opacity: .8;

}


.start-slash.four {

    width: 65vw;
    height: 35px;

    bottom: 27%;

    right: -15%;

    background: #000;

}


/* =========================================================
   JOKER MASK
========================================================= */

.joker-mask-img {

    position: relative;

    z-index: 5;

    width: 145px;

    height: auto;

    filter:
        drop-shadow(
            0 0 12px
            rgba(255,255,255,.35)
        )
        drop-shadow(
            9px 9px 0
            rgba(215,0,0,.5)
        );

    animation:
        maskFloat
        1.8s
        ease-in-out
        infinite;

}


/* =========================================================
   P5R INSPIRED LOGO
========================================================= */

.royal-logo {

    position: relative;

    z-index: 6;

    width: 410px;

    height: 175px;

    margin-top: 38px;

    transform:
        rotate(-7deg)
        skewX(-8deg);

    filter:
        drop-shadow(
            9px 9px 0 #d90000
        );

    user-select: none;

}


/* TAKE */

.royal-take {

    position: absolute;

    left: 5px;

    top: 0;

    color: #fff;

    font-size: 72px;

    line-height: .8;

    letter-spacing: -8px;

    -webkit-text-stroke:
        5px #000;

    text-shadow:
        7px 7px 0 #000;

}


/* YOUR */

.royal-your {

    position: absolute;

    left: 105px;

    top: 48px;

    z-index: 3;

    padding:
        5px 14px
        4px 11px;

    color: #000;

    background: #fff;

    border: 4px solid #000;

    font-size: 64px;

    line-height: .75;

    letter-spacing: -8px;

    box-shadow:
        8px 8px 0 #d90000;

    transform:
        rotate(3deg)
        skewX(-15deg);

}


/* HEART */

.royal-heart {

    position: absolute;

    left: 38px;

    top: 102px;

    color: #fff;

    font-size: 70px;

    line-height: .8;

    letter-spacing: -8px;

    -webkit-text-stroke:
        5px #000;

    text-shadow:
        7px 7px 0 #000;

}


/* LOGO DECORATIONS */

.royal-logo::before {

    content: "";

    position: absolute;

    width: 245px;
    height: 14px;

    right: -35px;
    top: 29px;

    z-index: -1;

    background: #d90000;

    transform:
        rotate(-15deg)
        skewX(-30deg);

}


.royal-logo::after {

    content: "";

    position: absolute;

    width: 300px;
    height: 9px;

    left: -10px;
    bottom: 0;

    z-index: -2;

    background: #000;

    transform:
        rotate(-6deg)
        skewX(-30deg);

}


/* =========================================================
   LOGO BURST
========================================================= */

.logo-burst {

    position: absolute;

    z-index: 8;

    background: #d90000;

}


.logo-burst.a {

    width: 75px;
    height: 7px;

    top: 5px;
    right: 5px;

    transform:
        rotate(-20deg);

}


.logo-burst.b {

    width: 50px;
    height: 5px;

    top: 22px;
    right: -20px;

    transform:
        rotate(20deg);

}


.logo-burst.c {

    width: 60px;
    height: 6px;

    bottom: 24px;
    left: -20px;

    transform:
        rotate(12deg);

}


/* =========================================================
   CLICK TEXT
========================================================= */

.sub-txt {

    position: relative;

    z-index: 8;

    margin-top: 20px;

    color: #fff;

    font-family:
        Arial,
        sans-serif;

    font-size: 11px;

    font-weight: 900;

    letter-spacing: 5px;

    animation:
        blink
        1.2s
        infinite;

}


.sub-txt::before {

    content: "///";

    color: #d90000;

    margin-right: 9px;

}


.sub-txt::after {

    content: "///";

    color: #d90000;

    margin-left: 9px;

}


.click-arrow {

    position: relative;

    z-index: 8;

    margin-top: 7px;

    color: #d90000;

    font-size: 15px;

    animation:
        arrowMove
        .8s
        ease-in-out
        infinite;

}


/* =========================================================
   MAIN BACKGROUND
========================================================= */

#canvasContainer {

    display: none;

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 10;

    overflow: hidden;

    background: #d90000;

}


/* =========================================================
   CALLING CARDS
========================================================= */

.falling-letter {

    position: absolute;

    width: 50px;
    height: 65px;

    background-image:
        url("cover.png");

    background-size: contain;

    background-position: center;

    background-repeat: no-repeat;

    pointer-events: none;

    will-change:
        transform;

    animation:
        fallingCard
        linear
        infinite;

    z-index: 20;

}


.falling-letter.far {

    opacity: .18;

    filter:
        blur(.7px);

}


.falling-letter.mid {

    opacity: .42;

}


.falling-letter.front {

    opacity: .78;

    z-index: 50;

    filter:
        drop-shadow(
            0 5px 6px
            rgba(0,0,0,.45)
        );

}


/* =========================================================
   GIANT P5 WORDS
========================================================= */

.p5-word {

    position: absolute;

    white-space: nowrap;

    pointer-events: none;

    user-select: none;

    color:
        rgba(0,0,0,.20);

    font-family:
        Impact,
        "Arial Black",
        sans-serif;

    font-weight: 900;

    letter-spacing: 3px;

    z-index: 15;

    transform:
        rotate(var(--rotation));

    animation:
        wordFloat
        var(--duration)
        ease-in-out
        infinite;

}


.p5-word.white {

    color:
        rgba(255,255,255,.22);

}


.p5-word.red {

    color:
        rgba(255,255,255,.35);

    text-shadow:
        6px 6px 0
        rgba(0,0,0,.3);

}


/* =========================================================
   SLASH BLOCKS
========================================================= */

.p5-slash {

    position: absolute;

    pointer-events: none;

    z-index: 18;

    transform:
        rotate(-8deg)
        skewX(-25deg);

    animation:
        slashFloat
        var(--duration)
        ease-in-out
        infinite;

}


.p5-slash.black {

    background: #050505;

}


.p5-slash.white {

    background: #fff;

}


.p5-slash.red {

    background: #d90000;

}


/* =========================================================
   SPEED LINES
========================================================= */

.speed-line {

    position: absolute;

    height: 4px;

    pointer-events: none;

    z-index: 25;

    background: #050505;

    transform:
        rotate(var(--angle));

    animation:
        speedMove
        var(--duration)
        linear
        infinite;

}


.speed-line.white {

    background: #fff;

}


/* =========================================================
   PAPER
========================================================= */

.paper-fragment {

    position: absolute;

    pointer-events: none;

    z-index: 30;

    background: #fff;

    transform:
        rotate(var(--rotation));

    animation:
        paperFall
        var(--duration)
        linear
        infinite;

}


.paper-fragment.black {

    background: #080808;

}


.paper-fragment.red {

    background: #d90000;

}


.paper-strip {

    position: absolute;

    pointer-events: none;

    z-index: 17;

    background:
        rgba(255,255,255,.75);

    transform:
        rotate(var(--rotation))
        skewX(-25deg);

    animation:
        stripMove
        var(--duration)
        ease-in-out
        infinite;

}


.paper-strip.black {

    background:
        rgba(0,0,0,.7);

}


/* =========================================================
   VIDEO
========================================================= */

#videoContainer {

    display: none;

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 999;

    align-items: center;

    justify-content: center;

    pointer-events: none;

}


#bgVideo {

    width: auto;

    height: auto;

    max-width: 88vw;

    max-height: 80vh;

    object-fit: contain;

    filter:
        drop-shadow(
            0 0 40px
            rgba(0,0,0,.95)
        );

    animation:
        videoAppear
        .4s
        cubic-bezier(
            .175,
            .885,
            .32,
            1.275
        )
        forwards;

}


/* =========================================================
   FLASH
========================================================= */

#flashOverlay {

    display: none;

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 99999;

    pointer-events: none;

}


.flash-animate {

    display: block !important;

    animation:
        flashEffect
        .42s
        ease-out
        forwards;

}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes maskFloat {

    0% {

        transform:
            translateY(0)
            rotate(0deg);

    }

    50% {

        transform:
            translateY(-7px)
            rotate(-2deg);

    }

    100% {

        transform:
            translateY(0)
            rotate(0deg);

    }

}


@keyframes blink {

    0%,
    100% {

        opacity: .3;

    }

    50% {

        opacity: 1;

    }

}


@keyframes arrowMove {

    0%,
    100% {

        transform:
            translateY(0);

        opacity: .35;

    }

    50% {

        transform:
            translateY(6px);

        opacity: 1;

    }

}


@keyframes fallingCard {

    0% {

        transform:
            translateY(-20vh)
            rotate(var(--rotation))
            scale(var(--scale));

    }

    100% {

        transform:
            translateY(125vh)
            rotate(
                calc(
                    var(--rotation)
                    + 360deg
                )
            )
            scale(var(--scale));

    }

}


@keyframes wordFloat {

    0% {

        transform:
            translateY(0)
            rotate(var(--rotation));

    }

    50% {

        transform:
            translateY(-15px)
            rotate(var(--rotation));

    }

    100% {

        transform:
            translateY(0)
            rotate(var(--rotation));

    }

}


@keyframes slashFloat {

    0% {

        transform:
            translateX(-20px)
            rotate(-8deg)
            skewX(-25deg);

    }

    50% {

        transform:
            translateX(25px)
            rotate(-8deg)
            skewX(-25deg);

    }

    100% {

        transform:
            translateX(-20px)
            rotate(-8deg)
            skewX(-25deg);

    }

}


@keyframes speedMove {

    0% {

        transform:
            translateX(-30vw)
            rotate(var(--angle));

    }

    100% {

        transform:
            translateX(140vw)
            rotate(var(--angle));

    }

}


@keyframes paperFall {

    0% {

        transform:
            translateY(-20vh)
            translateX(0)
            rotate(var(--rotation));

    }

    50% {

        transform:
            translateY(50vh)
            translateX(35px)
            rotate(
                calc(
                    var(--rotation)
                    + 120deg
                )
            );

    }

    100% {

        transform:
            translateY(125vh)
            translateX(-35px)
            rotate(
                calc(
                    var(--rotation)
                    + 300deg
                )
            );

    }

}


@keyframes stripMove {

    0% {

        transform:
            translateX(-25px)
            rotate(var(--rotation))
            skewX(-25deg);

    }

    50% {

        transform:
            translateX(30px)
            rotate(var(--rotation))
            skewX(-25deg);

    }

    100% {

        transform:
            translateX(-25px)
            rotate(var(--rotation))
            skewX(-25deg);

    }

}


@keyframes videoAppear {

    0% {

        opacity: 0;

        transform:
            scale(.82)
            rotate(-2deg);

    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);

    }

}


@keyframes flashEffect {

    0% {

        background: #fff;

        opacity: 1;

    }

    20% {

        background: #d90000;

        opacity: 1;

    }

    40% {

        background: #fff;

        opacity: 1;

    }

    65% {

        background: #050505;

        opacity: 1;

    }

    100% {

        opacity: 0;

    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .joker-mask-img {

        width: 115px;

    }


    .royal-logo {

        width: 320px;

        height: 145px;

        transform:
            scale(.82)
            rotate(-7deg)
            skewX(-8deg);

        margin-top: 30px;

    }


    .royal-take {

        font-size: 58px;

    }


    .royal-your {

        left: 84px;

        top: 40px;

        font-size: 53px;

    }


    .royal-heart {

        left: 30px;

        top: 85px;

        font-size: 58px;

    }


    .sub-txt {

        font-size: 9px;

        letter-spacing: 3px;

    }


    #bgVideo {

        max-width: 94vw;

        max-height: 72vh;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     MUSIC
===================================================== -->

<audio
    id="audio"
    src="music.mp3"
    loop
    preload="auto">
</audio>


<!-- =====================================================
     START SCREEN
===================================================== -->

<div
    id="startScreen"
    onclick="launchPhantom()">


    <div class="start-slash one"></div>

    <div class="start-slash two"></div>

    <div class="start-slash three"></div>

    <div class="start-slash four"></div>


    <img
        src="joker-mask.png"
        class="joker-mask-img"
        alt="Joker Mask">


    <!-- =================================================
         P5R STYLE LOGO
    ================================================== -->

    <div class="royal-logo">

        <div class="royal-take">
            TAKE
        </div>

        <div class="royal-your">
            YOUR
        </div>

        <div class="royal-heart">
            HEART
        </div>


        <div class="logo-burst a"></div>

        <div class="logo-burst b"></div>

        <div class="logo-burst c"></div>

    </div>


    <div class="sub-txt">
        CLICK TO OPEN
    </div>


    <div class="click-arrow">
        ▼
    </div>


</div>


<!-- =====================================================
     FLASH
===================================================== -->

<div id="flashOverlay"></div>


<!-- =====================================================
     CALLING CARD BACKGROUND
===================================================== -->

<div id="canvasContainer"></div>


<!-- =====================================================
     CENTER VIDEO
===================================================== -->

<div id="videoContainer">

    <video
        id="bgVideo"
        src="bg-animation.mp4"
        loop
        muted
        playsinline
        preload="auto">
    </video>

</div>


<script>

/* =========================================================
   DOM
========================================================= */

const canvas =
    document.getElementById(
        "canvasContainer"
    );


/* =========================================================
   INITIAL CALLING CARDS
========================================================= */

function createInitialCards() {

    for (
        let i = 0;
        i < 220;
        i++
    ) {

        createCallingCard(true);

    }

}


/* =========================================================
   CREATE CALLING CARD
========================================================= */

function createCallingCard(initial) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "falling-letter";


    const depth =
        Math.random();


    if (
        depth < .25
    ) {

        card.classList.add(
            "far"
        );

    }

    else if (
        depth < .78
    ) {

        card.classList.add(
            "mid"
        );

    }

    else {

        card.classList.add(
            "front"
        );

    }


    let width;


    if (
        depth < .25
    ) {

        width =
            Math.random() * 30 + 22;

    }

    else if (
        depth > .78
    ) {

        width =
            Math.random() * 70 + 55;

    }

    else {

        width =
            Math.random() * 50 + 30;

    }


    const height =
        width * 1.3;


    const rotation =
        Math.random() * 100 - 50;


    const scale =
        Math.random() * .45 + .55;


    const duration =
        Math.random() * 3 + 3;


    card.style.width =
        width + "px";


    card.style.height =
        height + "px";


    card.style.left =
        Math.random() * 100 + "vw";


    card.style.top =
        initial
            ? Math.random() * 115 - 15 + "vh"
            : "-20vh";


    card.style.setProperty(
        "--rotation",
        rotation + "deg"
    );


    card.style.setProperty(
        "--scale",
        scale
    );


    card.style.animationDuration =
        duration + "s";


    if (!initial) {

        card.style.animationDelay =
            "0s";

    }

    else {

        card.style.animationDelay =
            (
                Math.random() * -6
            ) + "s";

    }


    canvas.appendChild(
        card
    );


    if (!initial) {

        setTimeout(
            () => {

                card.remove();

            },
            duration * 1000 + 500
        );

    }

}


/* =========================================================
   GIANT WORDS
========================================================= */

function createWords() {

    const words = [

        "TAKE YOUR HEART",
        "PHANTOM",
        "CALLING CARD",
        "NOTICE",
        "THE TRUTH",
        "YOUR HEART",
        "WE HAVE COME",
        "THE PHANTOM THIEVES",
        "TAKE YOUR HEART",
        "NOTICE",
        "PHANTOM"

    ];


    for (
        let i = 0;
        i < 16;
        i++
    ) {

        const word =
            document.createElement(
                "div"
            );


        word.className =
            "p5-word";


        word.textContent =
            words[
                Math.floor(
                    Math.random()
                    * words.length
                )
            ];


        word.style.fontSize =
            (
                Math.random() * 70 + 30
            ) + "px";


        word.style.left =
            (
                Math.random() * 100
            ) + "vw";


        word.style.top =
            (
                Math.random() * 105
            ) + "vh";


        word.style.setProperty(
            "--rotation",
            (
                Math.random() * 18 - 9
            ) + "deg"
        );


        word.style.setProperty(
            "--duration",
            (
                Math.random() * 4 + 4
            ) + "s"
        );


        const type =
            Math.random();


        if (
            type < .25
        ) {

            word.classList.add(
                "white"
            );

        }

        else if (
            type < .45
        ) {

            word.classList.add(
                "red"
            );

        }


        canvas.appendChild(
            word
        );

    }

}


/* =========================================================
   SLASHES
========================================================= */

function createSlashes() {

    for (
        let i = 0;
        i < 38;
        i++
    ) {

        const slash =
            document.createElement(
                "div"
            );


        slash.className =
            "p5-slash";


        const type =
            Math.random();


        if (
            type < .5
        ) {

            slash.classList.add(
                "black"
            );

        }

        else if (
            type < .75
        ) {

            slash.classList.add(
                "white"
            );

        }

        else {

            slash.classList.add(
                "red"
            );

        }


        slash.style.width =
            (
                Math.random() * 220 + 50
            ) + "px";


        slash.style.height =
            (
                Math.random() * 24 + 5
            ) + "px";


        slash.style.left =
            (
                Math.random() * 110 - 5
            ) + "vw";


        slash.style.top =
            (
                Math.random() * 110 - 5
            ) + "vh";


        slash.style.setProperty(
            "--duration",
            (
                Math.random() * 3 + 3
            ) + "s"
        );


        canvas.appendChild(
            slash
        );

    }

}


/* =========================================================
   SPEED LINES
========================================================= */

function createSpeedLines() {

    for (
        let i = 0;
        i < 50;
        i++
    ) {

        const line =
            document.createElement(
                "div"
            );


        line.className =
            "speed-line";


        if (
            Math.random() > .72
        ) {

            line.classList.add(
                "white"
            );

        }


        line.style.width =
            (
                Math.random() * 180 + 40
            ) + "px";


        line.style.left =
            (
                Math.random() * 100
            ) + "vw";


        line.style.top =
            (
                Math.random() * 100
            ) + "vh";


        line.style.setProperty(
            "--angle",
            (
                Math.random() * 35 - 25
            ) + "deg"
        );


        line.style.setProperty(
            "--duration",
            (
                Math.random() * 1.8 + .8
            ) + "s"
        );


        line.style.animationDelay =
            (
                Math.random() * -4
            ) + "s";


        canvas.appendChild(
            line
        );

    }

}


/* =========================================================
   PAPER
========================================================= */

function createPaper() {

    for (
        let i = 0;
        i < 70;
        i++
    ) {

        const paper =
            document.createElement(
                "div"
            );


        paper.className =
            "paper-fragment";


        const type =
            Math.random();


        if (
            type < .5
        ) {

            paper.classList.add(
                "black"
            );

        }

        else if (
            type < .7
        ) {

            paper.classList.add(
                "red"
            );

        }


        paper.style.width =
            (
                Math.random() * 35 + 8
            ) + "px";


        paper.style.height =
            (
                Math.random() * 15 + 4
            ) + "px";


        paper.style.left =
            Math.random() * 100 + "vw";


        paper.style.top =
            Math.random() * 100 + "vh";


        paper.style.setProperty(
            "--rotation",
            Math.random() * 180 + "deg"
        );


        paper.style.setProperty(
            "--duration",
            (
                Math.random() * 4 + 4
            ) + "s"
        );


        paper.style.animationDelay =
            (
                Math.random() * -8
            ) + "s";


        canvas.appendChild(
            paper
        );

    }

}

        strip.style.height =

            ) + "px";


        strip.style.left =

            ) + "vw";

/* =========================================================
   START EVERYTHING
========================================================= */

createInitialCards();

createWords();

createStrips();


/* =========================================================
   LAUNCH
========================================================= */

let launched = false;


function launchPhantom() {

    if (launched) {

        return;

    }


    launched = true;


    const startScreen =
        document.getElementById(
            "startScreen"
        );


    const flash =
        document.getElementById(
            "flashOverlay"
        );


    const video =
        document.getElementById(
            "bgVideo"
        );


    const videoContainer =
        document.getElementById(
            "videoContainer"
        );


    const audio =
        document.getElementById(
            "audio"
        );


    /* 音樂 */

    audio.currentTime = 0;

    audio.play().catch(
        () => {}
    );


    /* 影片 */

    video.currentTime = 0;

    video.play().catch(
        () => {}
    );


    /* 閃屏 */

    flash.classList.remove(
        "flash-animate"
    );

    void flash.offsetWidth;

    flash.classList.add(
        "flash-animate"
    );


    /* 點擊後稍微延遲進場 */

    setTimeout(
        () => {

            startScreen.style.display =
                "none";

            canvas.style.display =
                "block";

            videoContainer.style.display =
                "flex";

        },
        180
    );


    /* 持續增加預告信 */

    setInterval(
        () => {

            if (
                canvas.querySelectorAll(
                    ".falling-letter"
                ).length < 330
            ) {

                createCallingCard(
                    false
                );

            }

        },
        80
    );


    /* 持續增加紙片 */

    setInterval(
        () => {

            createOnePaper();

        },
        180
    );


    /* 持續增加速度線 */

    setInterval(
        () => {

            createOneSpeedLine();

        },
        260
    );

}


/* =========================================================
   DYNAMIC PAPER
========================================================= */

function createOnePaper() {

    const paper =
        document.createElement(
            "div"
        );


    paper.className =
        "paper-fragment";


    const type =
        Math.random();


    if (
        type < .5
    ) {

        paper.classList.add(
            "black"
        );

    }

    else if (
        type < .7
    ) {

        paper.classList.add(
            "red"
        );

    }


    paper.style.width =
        (
            Math.random() * 35 + 8
        ) + "px";


    paper.style.height =
        (
            Math.random() * 15 + 4
        ) + "px";


    paper.style.left =
        Math.random() * 100 + "vw";


    paper.style.top =
        "-10vh";


    paper.style.setProperty(
        "--rotation",
        Math.random() * 180 + "deg"
    );


    const duration =
        Math.random() * 4 + 4;


    paper.style.setProperty(
        "--duration",
        duration + "s"
    );


    canvas.appendChild(
        paper
    );


    setTimeout(
        () => {

            paper.remove();

        },
        duration * 1000 + 500
    );

}


/* =========================================================
   DYNAMIC SPEED LINE
========================================================= */

function createOneSpeedLine() {

    const line =
        document.createElement(
            "div"
        );


    line.className =
        "speed-line";


    if (
        Math.random() > .7
    ) {

        line.classList.add(
            "white"
        );

    }


    line.style.width =
        (
            Math.random() * 180 + 40
        ) + "px";


    line.style.left =
        "-20vw";


    line.style.top =
        Math.random() * 100 + "vh";


    line.style.setProperty(
        "--angle",
        (
            Math.random() * 35 - 25
        ) + "deg"
    );


    const duration =
        Math.random() * 1.5 + .8;


    line.style.setProperty(
        "--duration",
        duration + "s"
    );


    canvas.appendChild(
        line
    );


    setTimeout(
        () => {

            line.remove();

        },
        duration * 1000 + 500
    );

}
