<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no,
    viewport-fit=cover"
>

<title>Take Your Heart</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

:root{
    --red:#dc0000;
    --black:#050505;
    --white:#fff;

    --mask-flight:1.82s;
    --mask-ease:cubic-bezier(.16,.67,.18,1);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
}

body{
    position:relative;

    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;

    overscroll-behavior:none;

    font-family:
        Impact,
        "Arial Black",
        "Franklin Gothic Heavy",
        Arial,
        sans-serif;
}


/* =========================================================
   START SCREEN
========================================================= */

#startScreen{
    position:fixed;
    inset:0;

    width:100%;
    height:100vh;
    height:100dvh;

    z-index:10000;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    overflow:hidden;

    cursor:pointer;

    isolation:isolate;

    --logoX:0px;
    --logoY:0px;

    padding:
        max(14px,env(safe-area-inset-top))
        max(12px,env(safe-area-inset-right))
        max(14px,env(safe-area-inset-bottom))
        max(12px,env(safe-area-inset-left));

    background:
        radial-gradient(
            circle at 50% 48%,
            rgba(180,0,0,.19) 0%,
            rgba(100,0,0,.10) 27%,
            rgba(15,5,5,.44) 46%,
            rgba(5,5,5,.96) 74%,
            #000 100%
        );
}

#startScreen::before{
    content:"";

    position:absolute;

    left:50%;
    top:48%;

    width:min(900px,125vw);

    aspect-ratio:1;

    transform:
        translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(255,0,0,.17) 0%,
            rgba(220,0,0,.09) 31%,
            transparent 68%
        );

    filter:
        blur(12px);

    z-index:-5;

    pointer-events:none;

    animation:
        centerPulse
        2.7s
        ease-in-out
        infinite;
}

#startScreen::after{
    content:"";

    position:absolute;
    inset:0;

    z-index:60;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.02) 0,
            rgba(255,255,255,.02) 1px,
            transparent 1px,
            transparent 5px
        ),
        radial-gradient(
            ellipse at center,
            transparent 42%,
            rgba(0,0,0,.60) 100%
        );

    opacity:.55;
}

@keyframes centerPulse{

    0%,
    100%{
        opacity:.55;

        transform:
            translate(-50%,-50%)
            scale(.90);
    }

    50%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.12);
    }

}


/* =========================================================
   START SLASH
========================================================= */

.start-slash,
.start-cut{
    position:absolute;
    pointer-events:none;
}

.start-slash{
    z-index:3;

    transform:
        rotate(-12deg)
        skewX(-25deg);
}

.start-slash.one{
    width:145vw;
    height:34px;

    top:16%;
    left:-25%;

    background:
        var(--red);

    opacity:.82;

    box-shadow:
        0 0 20px
        rgba(220,0,0,.38);

    animation:
        slashOne
        3.2s
        ease-in-out
        infinite;
}

.start-slash.two{
    width:105vw;
    height:9px;

    top:28%;
    right:-30%;

    background:#fff;

    opacity:.53;

    animation:
        slashTwo
        2.6s
        ease-in-out
        infinite;
}

.start-slash.three{
    width:130vw;
    height:12px;

    bottom:19%;
    left:-18%;

    background:
        var(--red);

    opacity:.66;

    animation:
        slashThree
        3s
        ease-in-out
        infinite;
}

.start-slash.four{
    width:75vw;
    height:48px;

    bottom:27%;
    right:-18%;

    background:#050505;

    opacity:.94;

    box-shadow:
        0 0 0 2px
        rgba(255,255,255,.07);

    animation:
        slashFour
        3.8s
        ease-in-out
        infinite;
}

@keyframes slashOne{

    0%,
    100%{
        transform:
            translateX(-3vw)
            rotate(-12deg)
            skewX(-25deg);
    }

    50%{
        transform:
            translateX(5vw)
            rotate(-12deg)
            skewX(-25deg);
    }

}

@keyframes slashTwo{

    0%,
    100%{
        opacity:.3;

        transform:
            translateX(0)
            rotate(-12deg)
            skewX(-25deg);
    }

    50%{
        opacity:.8;

        transform:
            translateX(-7vw)
            rotate(-12deg)
            skewX(-25deg);
    }

}

@keyframes slashThree{

    0%,
    100%{
        transform:
            translateX(0)
            rotate(-12deg)
            skewX(-25deg);
    }

    50%{
        transform:
            translateX(-5vw)
            rotate(-12deg)
            skewX(-25deg);
    }

}

@keyframes slashFour{

    0%,
    100%{
        transform:
            translateX(0)
            rotate(-12deg)
            skewX(-25deg);
    }

    50%{
        transform:
            translateX(-4vw)
            rotate(-12deg)
            skewX(-25deg);
    }

}


/* =========================================================
   SMALL CUTS
========================================================= */

.start-cut{
    z-index:4;

    transform:
        rotate(-10deg)
        skewX(-28deg);
}

.start-cut.a{
    width:38vw;
    height:7px;

    left:-5vw;
    top:39%;

    background:#fff;

    opacity:.46;

    animation:
        cutMoveA
        2.2s
        ease-in-out
        infinite;
}

.start-cut.b{
    width:52vw;
    height:4px;

    right:-12vw;
    top:43%;

    background:
        var(--red);

    opacity:.8;

    animation:
        cutMoveB
        1.8s
        ease-in-out
        infinite;
}

.start-cut.c{
    width:34vw;
    height:10px;

    left:2vw;
    bottom:38%;

    background:#000;

    opacity:.92;
}

.start-cut.d{
    width:48vw;
    height:5px;

    right:-8vw;
    bottom:42%;

    background:#fff;

    opacity:.32;
}

@keyframes cutMoveA{

    50%{
        transform:
            translateX(7vw)
            rotate(-10deg)
            skewX(-28deg);
    }

}

@keyframes cutMoveB{

    50%{
        transform:
            translateX(-6vw)
            rotate(-10deg)
            skewX(-28deg);
    }

}


/* =========================================================
   START DECOR
========================================================= */

#startP5Decor{
    position:absolute;
    inset:0;

    z-index:1;

    overflow:hidden;

    pointer-events:none;
}


/* =========================================================
   WORDS
========================================================= */

.start-word{
    position:absolute;

    white-space:nowrap;

    user-select:none;

    font-weight:900;

    line-height:.76;

    letter-spacing:-1px;

    opacity:
        var(--o);

    transform:
        rotate(var(--r))
        skewX(-7deg)
        scaleX(.88);

    transform-origin:
        left center;

    text-shadow:
        5px 5px 0
        rgba(0,0,0,.42);

    animation:
        startWordFloat
        var(--d)
        ease-in-out
        infinite;
}

.start-word.red{
    color:var(--red);
}

.start-word.white{
    color:#fff;
}

.start-word.black{
    color:#000;
}

.start-word.outline{
    color:transparent;

    -webkit-text-stroke:
        2px
        rgba(255,255,255,.24);

    text-shadow:none;
}

@keyframes startWordFloat{

    0%,
    100%{
        transform:
            translateY(0)
            rotate(var(--r))
            skewX(-7deg)
            scaleX(.88);
    }

    50%{
        transform:
            translateY(-13px)
            rotate(var(--r))
            skewX(-7deg)
            scaleX(.88);
    }

}


/* =========================================================
   HALFTONE
========================================================= */

.start-halftone{
    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--size);
    height:var(--size);

    opacity:var(--o);

    transform:
        rotate(var(--r));

    background:
        radial-gradient(
            circle,
            var(--c) 0 2px,
            transparent 2.4px
        );

    background-size:
        11px 11px;

    -webkit-mask-image:
        radial-gradient(
            ellipse,
            #000 0 42%,
            transparent 72%
        );

    mask-image:
        radial-gradient(
            ellipse,
            #000 0 42%,
            transparent 72%
        );

    animation:
        halftoneDrift
        var(--d)
        ease-in-out
        infinite;
}

@keyframes halftoneDrift{

    50%{
        transform:
            translate(12px,-8px)
            rotate(var(--r));
    }

}


/* =========================================================
   X
========================================================= */

.start-x{
    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--size);
    height:var(--size);

    opacity:var(--o);

    transform:
        rotate(var(--r));

    animation:
        decorFloat
        var(--d)
        ease-in-out
        infinite;
}

.start-x::before,
.start-x::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:100%;
    height:12%;

    background:var(--c);

    box-shadow:
        2px 2px 0
        rgba(0,0,0,.45);
}

.start-x::before{
    transform:
        translate(-50%,-50%)
        rotate(45deg);
}

.start-x::after{
    transform:
        translate(-50%,-50%)
        rotate(-45deg);
}


/* =========================================================
   BURST
========================================================= */

.start-burst{
    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--size);
    height:var(--size);

    opacity:var(--o);

    background:
        repeating-conic-gradient(
            var(--c) 0deg 7deg,
            transparent 7deg 17deg
        );

    -webkit-mask-image:
        radial-gradient(
            circle,
            transparent 0 18%,
            #000 19% 60%,
            transparent 61%
        );

    mask-image:
        radial-gradient(
            circle,
            transparent 0 18%,
            #000 19% 60%,
            transparent 61%
        );

    animation:
        burstSpin
        var(--d)
        linear
        infinite;
}

@keyframes burstSpin{

    to{
        transform:
            rotate(360deg);
    }

}


/* =========================================================
   TARGET
========================================================= */

.start-target{
    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--size);
    height:var(--size);

    border-radius:50%;

    border:
        2px solid
        var(--c);

    opacity:
        var(--o);

    animation:
        targetPulse
        var(--d)
        ease-in-out
        infinite;
}

.start-target::before{
    content:"";

    position:absolute;

    inset:16%;

    border:
        1px solid
        var(--c);

    border-radius:50%;
}

.start-target::after{
    content:"";

    position:absolute;

    left:50%;
    top:-15%;

    width:2px;
    height:130%;

    background:
        var(--c);

    transform:
        translateX(-50%);
}

@keyframes targetPulse{

    0%,
    100%{
        transform:
            scale(.92);
    }

    50%{
        transform:
            scale(1.08);
    }

}


/* =========================================================
   DOTS
========================================================= */

.start-dot-group{
    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--size);
    height:var(--size);

    opacity:var(--o);

    animation:
        dotFloat
        var(--d)
        ease-in-out
        infinite;
}

.start-dot{
    position:absolute;

    width:var(--dot);
    height:var(--dot);

    left:var(--left);
    top:var(--top);

    border-radius:50%;

    background:
        var(--c);
}

@keyframes dotFloat{

    50%{
        transform:
            translateY(-10px);
    }

}


/* =========================================================
   BLOCK
========================================================= */

.start-block{
    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--w);
    height:var(--h);

    background:var(--c);

    opacity:var(--o);

    transform:
        rotate(var(--r))
        skewX(-24deg);

    box-shadow:
        4px 4px 0
        rgba(0,0,0,.36);

    animation:
        blockFloat
        var(--d)
        ease-in-out
        infinite;
}

@keyframes blockFloat{

    50%{
        transform:
            translateX(15px)
            rotate(var(--r))
            skewX(-24deg);
    }

}


/* =========================================================
   START INK
========================================================= */

.start-ink{
    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--size);

    height:
        calc(
            var(--size)
            *
            .73
        );

    background:
        var(--c);

    opacity:
        var(--o);

    border-radius:
        55% 45% 61% 39%
        /
        43% 57% 44% 56%;

    transform:
        rotate(var(--r));

    animation:
        startInk
        var(--d)
        ease-in-out
        infinite;
}

.start-ink::before,
.start-ink::after{
    content:"";

    position:absolute;

    border-radius:50%;

    background:inherit;
}

.start-ink::before{
    width:30%;

    aspect-ratio:1;

    left:-13%;
    top:58%;
}

.start-ink::after{
    width:20%;

    aspect-ratio:1;

    right:-8%;
    top:-8%;
}

@keyframes startInk{

    50%{
        transform:
            rotate(var(--r))
            scale(1.1);
    }

}


/* =========================================================
   START FRAGMENT
========================================================= */

.start-fragment{
    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--w);
    height:var(--h);

    background:
        var(--c);

    opacity:
        var(--o);

    clip-path:
        polygon(
            0 20%,
            100% 0,
            82% 100%,
            12% 77%
        );

    animation:
        fragmentFloat
        var(--d)
        ease-in-out
        infinite;
}

@keyframes fragmentFloat{

    50%{
        transform:
            translate(
                var(--dx),
                var(--dy)
            )
            rotate(12deg);
    }

}


/* =========================================================
   START SPEED
========================================================= */

.start-speed{
    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--w);
    height:var(--h);

    background:
        var(--c);

    opacity:0;

    transform:
        rotate(var(--r));

    animation:
        startSpeed
        var(--d)
        linear
        var(--delay)
        infinite;
}

@keyframes startSpeed{

    0%{
        opacity:0;

        transform:
            translateX(-120px)
            rotate(var(--r));
    }

    13%{
        opacity:var(--o);
    }

    72%{
        opacity:var(--o);
    }

    100%{
        opacity:0;

        transform:
            translateX(190px)
            rotate(var(--r));
    }

}


/* =========================================================
   SYMBOL
========================================================= */

.start-symbol{
    position:absolute;

    left:var(--x);
    top:var(--y);

    color:
        var(--c);

    opacity:
        var(--o);

    font-size:
        var(--size);

    font-weight:900;

    transform:
        rotate(var(--r))
        skewX(-8deg);

    text-shadow:
        4px 4px 0
        rgba(0,0,0,.5);

    animation:
        symbolFloat
        var(--d)
        ease-in-out
        infinite;
}

@keyframes symbolFloat{

    50%{
        transform:
            translateY(-11px)
            rotate(var(--r))
            skewX(-8deg)
            scale(1.12);
    }

}

@keyframes decorFloat{

    50%{
        transform:
            translateY(-10px)
            rotate(var(--r));
    }

}


/* =========================================================
   LOGO
========================================================= */

.royal-logo{
    position:relative;

    z-index:20;

    width:430px;

    max-width:85vw;

    user-select:none;

    translate:
        var(--logoX)
        var(--logoY);

    transform:
        rotate(-7deg)
        skewX(-8deg);

    filter:
        drop-shadow(
            9px 10px 0 #000
        )
        drop-shadow(
            13px 13px 0
            var(--red)
        );

    animation:
        logoEntrance
        .9s
        cubic-bezier(.16,1,.3,1)
        both,

        logoFloat
        2.8s
        ease-in-out
        .9s
        infinite;
}

.royal-logo::before,
.royal-logo::after{
    content:"";

    position:absolute;

    inset:-3px;

    background:
        url("take-your-heart.png")
        center
        /
        contain
        no-repeat;

    pointer-events:none;

    z-index:-1;
}

.royal-logo::before{
    opacity:.28;

    transform:
        translate(5px,3px);

    mix-blend-mode:screen;

    animation:
        printRed
        1.7s
        steps(2,end)
        infinite;
}

.royal-logo::after{
    opacity:.18;

    transform:
        translate(-4px,-3px);

    mix-blend-mode:multiply;

    animation:
        printBlack
        2s
        steps(2,end)
        infinite;
}

.take-your-heart-img{
    display:block;

    width:100%;
    height:auto;

    pointer-events:none;

    user-select:none;

    -webkit-user-drag:none;

    transform-origin:center;

    animation:
        heartFloat
        2.8s
        ease-in-out
        infinite,

        logoGlitch
        4.5s
        steps(1,end)
        infinite;
}


/* =========================================================
   LOGO RING
========================================================= */

.logo-ring{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(-7deg);

    border-radius:50%;

    pointer-events:none;

    z-index:-2;

    border:
        1px solid
        rgba(220,0,0,.24);

    animation:
        ringPulse
        2.8s
        ease-out
        infinite;
}

.logo-ring.one{
    width:480px;
    height:210px;
}

.logo-ring.two{
    width:545px;
    height:255px;

    border-color:
        rgba(255,255,255,.10);

    animation-delay:.8s;
}

.logo-ring.three{
    width:610px;
    height:295px;

    border-color:
        rgba(220,0,0,.10);

    animation-delay:1.4s;
}

@keyframes ringPulse{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            rotate(-7deg)
            scale(.82);
    }

    30%{
        opacity:.75;
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            rotate(-7deg)
            scale(1.18);
    }

}


/* =========================================================
   GLINT
========================================================= */

.logo-glint{
    position:absolute;

    inset:-10%;

    z-index:5;

    pointer-events:none;

    opacity:0;

    background:
        linear-gradient(
            112deg,
            transparent 0 38%,
            rgba(255,255,255,.12) 43%,
            rgba(255,250,200,.9) 49%,
            rgba(255,255,255,.18) 54%,
            transparent 60%
        );

    background-size:
        250% 100%;

    -webkit-mask:
        url("take-your-heart.png")
        center
        /
        contain
        no-repeat;

    mask:
        url("take-your-heart.png")
        center
        /
        contain
        no-repeat;

    mix-blend-mode:screen;

    animation:
        logoGlint
        4.6s
        ease-in-out
        1.2s
        infinite;
}

@keyframes logoGlint{

    0%,
    65%{
        opacity:0;

        background-position:
            140% 0;
    }

    70%{
        opacity:1;
    }

    83%{
        opacity:.5;

        background-position:
            -50% 0;
    }

    90%,
    100%{
        opacity:0;

        background-position:
            -50% 0;
    }

}

@keyframes logoEntrance{

    0%{
        opacity:0;

        transform:
            translateY(45px)
            scale(.72)
            rotate(-13deg)
            skewX(-12deg);
    }

    70%{
        opacity:1;

        transform:
            translateY(-5px)
            scale(1.06)
            rotate(-6deg)
            skewX(-8deg);
    }

    100%{
        opacity:1;

        transform:
            rotate(-7deg)
            skewX(-8deg);
    }

}

@keyframes logoFloat{

    0%,
    100%{
        transform:
            rotate(-7deg)
            skewX(-8deg)
            translateY(0);
    }

    50%{
        transform:
            rotate(-7deg)
            skewX(-8deg)
            translateY(-6px);
    }

}

@keyframes heartFloat{

    0%,
    100%{
        transform:
            translateY(0)
            scale(1);
    }

    25%{
        transform:
            translateY(-6px)
            scale(1.025)
            rotate(-1deg);
    }

    50%{
        transform:
            translateY(0)
            scale(1.04);
    }

    75%{
        transform:
            translateY(6px)
            scale(1.025)
            rotate(1deg);
    }

}

@keyframes logoGlitch{

    0%,
    82%,
    100%{
        clip-path:
            inset(0);
    }

    84%{
        clip-path:
            inset(8% 0 72% 0);

        transform:
            translate(3px,-1px)
            scale(1.01);
    }

    86%{
        clip-path:
            inset(60% 0 22% 0);

        transform:
            translate(-3px,2px)
            scale(1.01);
    }

    88%{
        clip-path:
            inset(0);
    }

}

@keyframes printRed{

    0%,
    100%{
        transform:
            translate(3px,2px);
    }

    25%{
        transform:
            translate(7px,3px);
    }

    50%{
        transform:
            translate(2px,1px);
    }

    75%{
        transform:
            translate(5px,4px);
    }

}

@keyframes printBlack{

    0%,
    100%{
        transform:
            translate(-3px,-2px);
    }

    33%{
        transform:
            translate(-5px,-3px);
    }

    66%{
        transform:
            translate(-2px,-1px);
    }

}


/* =========================================================
   CLICK TEXT
========================================================= */

.sub-txt{
    position:relative;

    z-index:25;

    margin-top:30px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:14px;

    color:
        var(--red);

    font-size:13px;

    font-weight:900;

    letter-spacing:3px;

    white-space:nowrap;

    text-align:center;

    transform:
        skewX(-6deg)
        scaleX(.94);

    text-shadow:
        2px 2px 0 #000,
        0 0 14px
        rgba(220,0,0,.42);

    animation:
        clickBlink
        1.35s
        ease-in-out
        infinite;
}


/* LEFT ▶ */

.click-triangle.left{
    width:0;
    height:0;

    flex:none;

    border-top:
        7px solid transparent;

    border-bottom:
        7px solid transparent;

    border-left:
        12px solid
        var(--red);

    filter:
        drop-shadow(
            2px 2px 0 #000
        )
        drop-shadow(
            0 0 6px
            rgba(220,0,0,.55)
        );

    animation:
        triangleLeft
        .9s
        ease-in-out
        infinite;
}


/* RIGHT ◀ */

.click-triangle.right{
    width:0;
    height:0;

    flex:none;

    border-top:
        7px solid transparent;

    border-bottom:
        7px solid transparent;

    border-right:
        12px solid
        var(--red);

    filter:
        drop-shadow(
            -2px 2px 0 #000
        )
        drop-shadow(
            0 0 6px
            rgba(220,0,0,.55)
        );

    animation:
        triangleRight
        .9s
        ease-in-out
        infinite;
}

.click-copy{
    position:relative;

    display:inline-block;
}

.click-copy::after{
    content:"";

    position:absolute;

    left:-5%;
    right:-5%;

    bottom:-9px;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--red),
            #fff,
            var(--red),
            transparent
        );

    opacity:.4;

    transform:
        scaleX(.2);

    animation:
        clickCharge
        1.35s
        ease-in-out
        infinite;
}

@keyframes triangleLeft{

    0%,
    100%{
        transform:
            translateX(-3px);
    }

    50%{
        transform:
            translateX(4px)
            scale(1.12);
    }

}

@keyframes triangleRight{

    0%,
    100%{
        transform:
            translateX(3px);
    }

    50%{
        transform:
            translateX(-4px)
            scale(1.12);
    }

}

@keyframes clickBlink{

    0%,
    100%{
        opacity:.48;
    }

    50%{
        opacity:1;
    }

}

@keyframes clickCharge{

    50%{
        opacity:1;

        transform:
            scaleX(1);
    }

}


/* =========================================================
   LABEL
========================================================= */

.start-label{
    position:absolute;

    z-index:30;

    color:
        rgba(255,255,255,.17);

    font-size:8px;

    letter-spacing:3px;

    transform:
        skewX(-7deg);

    pointer-events:none;
}

.start-label.top{
    top:8%;
    left:7%;
}

.start-label.bottom{
    right:7%;
    bottom:8%;
}

.start-label::before{
    content:"//";

    color:
        var(--red);

    margin-right:8px;
}


/* =========================================================
   IMPACT
========================================================= */

#impactBurst{
    display:none;

    position:fixed;
    inset:0;

    z-index:99996;

    pointer-events:none;

    --cx:50vw;
    --cy:50vh;
}

#impactBurst.active{
    display:block;
}

#impactBurst::before{
    content:"";

    position:absolute;

    left:var(--cx);
    top:var(--cy);

    width:38px;
    height:38px;

    border-radius:50%;

    border:
        5px solid #fff;

    transform:
        translate(-50%,-50%);

    box-shadow:
        0 0 0 9px
        var(--red),

        0 0 0 14px
        #000;

    animation:
        impactRing
        .58s
        cubic-bezier(.08,.76,.15,1)
        forwards;
}

#impactBurst::after{
    content:"";

    position:absolute;

    left:var(--cx);
    top:var(--cy);

    width:160vmax;
    height:160vmax;

    opacity:0;

    background:
        repeating-conic-gradient(
            #fff 0 1.5deg,
            transparent 1.5deg 6deg,
            var(--red) 6deg 9deg,
            transparent 9deg 17deg
        );

    -webkit-mask-image:
        radial-gradient(
            circle,
            transparent 0 7%,
            #000 9% 43%,
            transparent 59%
        );

    mask-image:
        radial-gradient(
            circle,
            transparent 0 7%,
            #000 9% 43%,
            transparent 59%
        );

    animation:
        impactRays
        .68s
        cubic-bezier(.08,.76,.15,1)
        forwards;
}

@keyframes impactRing{

    0%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.2);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(17);
    }

}

@keyframes impactRays{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.03)
            rotate(-15deg);
    }

    20%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(1)
            rotate(10deg);
    }

}


/* =========================================================
   CUTIN
========================================================= */

#skillCutin{
    visibility:hidden;

    position:fixed;
    inset:0;

    width:100%;

    height:100vh;
    height:100dvh;

    z-index:99998;

    overflow:hidden;

    pointer-events:none;

    isolation:isolate;
}

#skillCutin.active{
    visibility:visible;
}


/* =========================================================

.cutin-back{

.cutin-back{

/* =========================================================

.cutin-bottom-wrap{

.cutin-bottom{

.cutin-strip{

.cutin-strip::before{

    top:22%;

        );

        );

/* =========================================================
   JOKER MASK
   沒有拖尾
   沒有 RIP LINE
========================================================= */

#maskDart{
    position:absolute;

    left:0;
    top:50%;

    width:
        clamp(
            115px,
            13vw,
            190px
        );

    aspect-ratio:1;

    z-index:19;

    opacity:0;

    pointer-events:none;

    transform-origin:center;

    will-change:
        transform,
        opacity,
        filter;

    transform:
        translate3d(
            -30vw,
            -50%,
            0
        )
        scale(.44);
}

.mask-spinner{
    position:relative;

    width:100%;
    height:100%;

    transform-origin:
        50% 50%;

    will-change:
        transform;

    filter:
        drop-shadow(
            7px 9px 0
            rgba(0,0,0,.92)
        )
        drop-shadow(
            0 0 11px
            rgba(255,255,255,.24)
        )
        drop-shadow(
            0 0 24px
            rgba(220,0,0,.72)
        );
}

.mask-spinner img{
    display:block;

    width:100%;
    height:100%;

    object-fit:contain;

    user-select:none;

    pointer-events:none;

    -webkit-user-drag:none;
}

#skillCutin.throw-mask
#maskDart{
    animation:
        maskFlightDesktop
        var(--mask-flight)
        var(--mask-ease)
        forwards;
}

#skillCutin.throw-mask
.mask-spinner{
    animation:
        maskSpinDesktop
        var(--mask-flight)
        cubic-bezier(.18,.65,.25,1)
        forwards;
}


/* =========================================================
   MASK DESKTOP
========================================================= */

@keyframes maskFlightDesktop{

    0%{
        opacity:0;

        transform:
            translate3d(
                -26vw,
                calc(-50% + 3vw),
                0
            )
            scale(.44);

        filter:
            blur(4px);
    }

    6%{
        opacity:1;
    }

    18%{
        opacity:1;

        transform:
            translate3d(
                -2vw,
                calc(-50% + 2.2vw),
                0
            )
            scale(.56);

        filter:
            blur(2px);
    }

    36%{
        transform:
            translate3d(
                26vw,
                calc(-50% + 1.2vw),
                0
            )
            scale(.80);

        filter:
            blur(.7px);
    }

    51%{
        transform:
            translate3d(
                47vw,
                calc(-50% + .1vw),
                0
            )
            scale(1.08);

        filter:
            blur(0);
    }

    66%{
        transform:
            translate3d(
                67vw,
                calc(-50% - 1.2vw),
                0
            )
            scale(.91);
    }

    82%{
        opacity:.96;

        transform:
            translate3d(
                87vw,
                calc(-50% - 2.6vw),
                0
            )
            scale(.67);

        filter:
            blur(.7px);
    }

    93%{
        opacity:.56;

        transform:
            translate3d(
                105vw,
                calc(-50% - 3.7vw),
                0
            )
            scale(.45);

        filter:
            blur(2px);
    }

    100%{
        opacity:0;

        transform:
            translate3d(
                124vw,
                calc(-50% - 4.7vw),
                0
            )
            scale(.30);

        filter:
            blur(5px);
    }

}

@keyframes maskSpinDesktop{

    0%{
        transform:
            rotate(-65deg);
    }

    20%{
        transform:
            rotate(62deg);
    }

    40%{
        transform:
            rotate(190deg);
    }

    60%{
        transform:
            rotate(320deg);
    }

    80%{
        transform:
            rotate(450deg);
    }

    100%{
        transform:
            rotate(585deg);
    }

}


/* =========================================================
   CUTIN ENTER
========================================================= */

#skillCutin.enter
.cutin-top-wrap{
    animation:
        cutinTopEnter
        .48s
        cubic-bezier(.75,0,.22,1)
        forwards;
}

#skillCutin.enter
.cutin-bottom-wrap{
    animation:
        cutinBottomEnter
        .48s
        cubic-bezier(.75,0,.22,1)
        forwards;
}

#skillCutin.enter
.cutin-red-slash{
    animation:
        redSlashEnter
        .54s
        cubic-bezier(.6,0,.25,1)
        forwards;
}

#skillCutin.enter
.cutin-strip-wrap{
    animation:
        centerStripEnter
        .62s
        cubic-bezier(.72,0,.24,1)
        .08s
        forwards;
}

@keyframes cutinTopEnter{

    to{
        transform:
            translateY(0);
    }

}

@keyframes cutinBottomEnter{

    to{
        transform:
            translateY(0);
    }

}

@keyframes redSlashEnter{

    to{
        transform:
            rotate(-9deg)
            translateX(0);
    }

}

@keyframes centerStripEnter{

    0%{
        transform:
            translateX(-120%)
            rotate(-4deg);
    }

    78%{
        transform:
            translateX(3%)
            rotate(-4deg);
    }

    100%{
        transform:
            translateX(0)
            rotate(-4deg);
    }

}


/* =========================================================
   TEAR
========================================================= */

#skillCutin.tear
.cutin-top-wrap{
    transform:
        translateY(0);

    animation:
        topTearOpen
        1.30s
        cubic-bezier(.10,.82,.16,1)
        forwards;
}

#skillCutin.tear
.cutin-bottom-wrap{
    transform:
        translateY(0);

    animation:
        bottomTearOpen
        1.30s
        cubic-bezier(.10,.82,.16,1)
        forwards;
}

#skillCutin.tear
.cutin-strip-wrap{
    transform:
        translateX(0)
        rotate(-4deg);

    animation:
        stripTearAway
        1.05s
        cubic-bezier(.12,.75,.19,1)
        forwards;
}

#skillCutin.tear
.cutin-red-slash{
    transform:
        rotate(-9deg)
        translateX(0);

    animation:
        redSlashAway
        .90s
        ease-in
        forwards;
}

#skillCutin.tear
.cutin-back{
    opacity:1;

    animation:
        cutinBackOut
        .92s
        .38s
        ease-out
        forwards;
}

@keyframes topTearOpen{

    0%{
        transform:
            translateY(0)
            rotate(0);
    }

    10%{
        transform:
            translateY(-2%)
            rotate(-.5deg);
    }

    27%{
        transform:
            translateY(-11%)
            rotate(-1deg);
    }

    100%{
        transform:
            translateY(-120%)
            rotate(-4deg);
    }

}

@keyframes bottomTearOpen{

    0%{
        transform:
            translateY(0)
            rotate(0);
    }

    10%{
        transform:
            translateY(2%)
            rotate(.5deg);
    }

    27%{
        transform:
            translateY(11%)
            rotate(1deg);
    }

    100%{
        transform:
            translateY(120%)
            rotate(4deg);
    }

}

@keyframes stripTearAway{

    0%{
        transform:
            translateX(0)
            rotate(-4deg)
            scale(1);
    }

    18%{
        transform:
            translateX(3%)
            rotate(-3deg)
            scale(1.03);
    }

    100%{
        transform:
            translateX(120%)
            translateY(-15%)
            rotate(10deg)
            scale(.9);
    }

}

@keyframes redSlashAway{

    to{
        transform:
            translateX(-120%)
            rotate(-14deg);
    }

}

@keyframes cutinBackOut{

    to{
        opacity:0;
    }

}


/* =========================================================
   SHARDS
========================================================= */

#cutinShards{
    position:absolute;
    inset:0;

    pointer-events:none;
}

.cutin-shard{
    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--w);
    height:var(--h);

    background:
        var(--c);

    opacity:0;

    clip-path:
        polygon(
            0 20%,
            100% 0,
            78% 100%,
            15% 82%
        );
}

#skillCutin.tear
.cutin-shard{
    animation:
        cutinShardFly
        var(--d)
        cubic-bezier(.16,.8,.26,1)
        forwards;
}

@keyframes cutinShardFly{

    0%{
        opacity:0;

        transform:
            translate(0,0)
            rotate(var(--r))
            scale(.3);
    }

    12%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translate(
                var(--dx),
                var(--dy)
            )
            rotate(
                calc(
                    var(--r)
                    +
                    180deg
                )
            )
            scale(1.2);
    }

}


/* =========================================================
   FLASH
========================================================= */

.cutin-flash{
    position:absolute;
    inset:0;

    z-index:20;

    background:#fff;

    opacity:0;

    pointer-events:none;
}

#skillCutin.tear
.cutin-flash{
    animation:
        cutinFlash
        .48s
        ease-out
        forwards;
}

@keyframes cutinFlash{

    0%{
        opacity:0;
    }

    18%{
        opacity:.82;
    }

    43%{
        opacity:.11;

        background:
            var(--red);
    }

    100%{
        opacity:0;
    }

}


/* =========================================================
   SCREEN SHAKE
========================================================= */

body.screen-shake{
    animation:
        screenShake
        .34s
        linear;
}

@keyframes screenShake{

    0%{
        transform:
            translate(0,0);
    }

    15%{
        transform:
            translate(-6px,3px);
    }

    30%{
        transform:
            translate(5px,-3px);
    }

    45%{
        transform:
            translate(-4px,-2px);
    }

    60%{
        transform:
            translate(4px,3px);
    }

    75%{
        transform:
            translate(-2px,1px);
    }

    100%{
        transform:
            translate(0,0);
    }

}

/* =========================================================
   MAIN WORD
========================================================= */

.p5-word{
    position:absolute;

    pointer-events:none;

    letter-spacing:1px;

    color:
        rgba(0,0,0,.23);

    z-index:11;

    transform:
        rotate(var(--rotation))
        skewX(-7deg)
        scaleX(.9);

    animation:
        wordFloat
        var(--duration)
        ease-in-out
        infinite;
}

.p5-word.white{
    color:
        rgba(255,255,255,.17);
}

.p5-word.red{
    color:
        rgba(220,0,0,.30);

    text-shadow:
        5px 5px 0
        rgba(0,0,0,.4);
}


/* =========================================================
   MAIN SLASH
========================================================= */

.p5-slash{
    position:absolute;

    pointer-events:none;

    z-index:13;

    opacity:.75;

    transform:
        skewX(-25deg)
        rotate(-8deg);

    animation:
        slashFloat
        var(--duration)
        ease-in-out
        infinite;
}

.p5-slash.black{
    background:#050505;
}

.p5-slash.white{
    background:#fff;
}

.p5-slash.red{
    background:
        var(--red);

    box-shadow:
        0 0 12px
        rgba(220,0,0,.3);
}


/* =========================================================
   SPEED
========================================================= */

.speed-line{
    position:absolute;

    height:4px;

    background:#050505;

    pointer-events:none;

    z-index:15;

    transform:
        rotate(var(--angle));

    animation:
        speedMove
        var(--duration)
        linear
        infinite;
}

.speed-line.white{
    background:#fff;
}


/* =========================================================
   PAPER
========================================================= */

.paper-fragment{
    position:absolute;

    pointer-events:none;

    z-index:14;

    background:#fff;

    transform:
        rotate(var(--rotation));

    animation:
        paperFall
        var(--duration)
        linear
        infinite;
}

.paper-fragment.black{
    background:#080808;
}

.paper-fragment.red{
    background:
        var(--red);
}

.paper-strip{
    position:absolute;

    pointer-events:none;

    z-index:12;

    background:
        rgba(255,255,255,.75);

    transform:
        rotate(var(--rotation))
        skewX(-25deg);

    animation:
        stripMove
        var(--duration)
        ease-in-out
        infinite;
}

.paper-strip.black{
    background:
        rgba(0,0,0,.55);
}


/* =========================================================
   INK
========================================================= */

.ink-splatter{
    position:absolute;

    width:9px;
    height:9px;

    background:
        var(--red);

    border-radius:50%;

    pointer-events:none;

    z-index:17;

    opacity:.82;

    box-shadow:
        0 0 7px
        rgba(220,0,0,.35);

    transform:
        translate(0,0)
        scale(var(--scale))
        rotate(var(--rotation));

    animation:
        inkSplatter
        var(--duration)
        ease-out
        forwards;
}

.ink-splatter::before,
.ink-splatter::after{
    content:"";

    position:absolute;

    border-radius:50%;

    background:
        var(--red);
}

.ink-splatter::before{
    width:5px;
    height:5px;

    left:
        var(--dot-x);

    top:
        var(--dot-y);
}

.ink-splatter::after{
    width:3px;
    height:3px;

    left:
        var(--dot-x2);

    top:
        var(--dot-y2);
}

   VIDEO
========================================================= */

#videoContainer{

/* =========================================================
   MAIN KEYFRAMES
========================================================= */

@keyframes p5GlobalFall{

    0%{
        transform:
            translateY(0)
            rotate(var(--rot))
            scale(var(--sc));
    }

    100%{
        transform:
            translateY(120vh)
            rotate(
                calc(
                    var(--rot)
                    +
                    120deg
                )
            )
            scale(var(--sc));
    }

}

@keyframes wordFloat{

    0%,
    100%{
        transform:
            translateY(0)
            rotate(var(--rotation))
            skewX(-7deg)
            scaleX(.9);
    }

    50%{
        transform:
            translateY(-15px)
            rotate(var(--rotation))
            skewX(-7deg)
            scaleX(.9);
    }

}

@keyframes slashFloat{

    0%,
    100%{
        transform:
            translateX(-25px)
            skewX(-25deg)
            rotate(-8deg);
    }

    50%{
        transform:
            translateX(25px)
            skewX(-25deg)
            rotate(-8deg);
    }

}

@keyframes speedMove{

    0%{
        transform:
            translateX(-35vw)
            rotate(var(--angle));
    }

    100%{
        transform:
            translateX(140vw)
            rotate(var(--angle));
    }

}

@keyframes paperFall{

    0%{
        transform:
            translateY(-20vh)
            translateX(0)
            rotate(var(--rotation));
    }

    50%{
        transform:
            translateY(50vh)
            translateX(30px)
            rotate(
                calc(
                    var(--rotation)
                    +
                    120deg
                )
            );
    }

    100%{
        transform:
            translateY(120vh)
            translateX(-30px)
            rotate(
                calc(
                    var(--rotation)
                    +
                    300deg
                )
            );
    }

}

@keyframes stripMove{

    0%,
    100%{
        transform:
            translateX(-20px)
            rotate(var(--rotation))
            skewX(-25deg);
    }

    50%{
        transform:
            translateX(30px)
            rotate(var(--rotation))
            skewX(-25deg);
    }

}

@keyframes inkSplatter{

    0%{
        opacity:0;

        transform:
            translate(0,0)
            scale(.2)
            rotate(var(--rotation));
    }

    12%{
        opacity:.9;
    }

    65%{
        opacity:.8;
    }

    100%{
        opacity:0;

        transform:
            translate(
                var(--move-x),
                var(--move-y)
            )
            scale(var(--scale))
            rotate(
                calc(
                    var(--rotation)
                    +
                    100deg
                )
            );
    }

}

@keyframes popIn{

    0%{
        opacity:0;

        transform:
            scale(.9);
    }

    100%{
        opacity:1;

        transform:
            scale(1);
    }

}

/* =========================================================
   HELPERS
========================================================= */

function random(
    min,
    max
){

    return (
        Math.random()
        *
        (
            max
            -
            min
        )
        +
        min
    );

}


function pick(
    array
){

    return array[
        Math.floor(
            Math.random()
            *
            array.length
        )
    ];

}


function isMobile(){

    return (
        window.innerWidth
        <=
        600
    );

}


function getPosition(
    avoidCenter = true
){

    let x = 0;

    let y = 0;

    let safe = false;

    let tries = 0;


    while(
        !safe
        &&
        tries < 20
    ){

        x =
            random(
                1,
                94
            );


        y =
            random(
                4,
                90
            );


        const center =
            x > 22
            &&
            x < 78
            &&
            y > 28
            &&
            y < 70;


        safe =
            avoidCenter
            ?
            !center
            :
            true;


        tries++;

    }


    return{
        x,
        y
    };

}

            ?

/* =========================================================
   PARALLAX
========================================================= */

function initStartParallax(){

    const start =
        document.getElementById(
            "startScreen"
        );


    if(
        !start
    ){
        return;
    }


    if(
        !window.matchMedia(
            "(pointer:fine)"
        ).matches
    ){
        return;
    }


    start.addEventListener(
        "pointermove",
        event => {

            if(
                launched
            ){
                return;
            }


            const x =
                event.clientX
                /
                window.innerWidth
                -
                .5;


            const y =
                event.clientY
                /
                window.innerHeight
                -
                .5;


            start.style.setProperty(
                "--logoX",
                x
                *
                12
                +
                "px"
            );


            start.style.setProperty(
                "--logoY",
                y
                *
                9
                +
                "px"
            );

        }
    );

}

function createCallingCard(
    initial = false
){

    const container =
        document.getElementById(
            "canvasContainer"
        );


    const letter =
        document.createElement(
            "div"
        );


    letter.className =
        "falling-letter";


    const depth =
        Math.random();


    if(
        depth < .25
    ){

        letter.classList.add(
            "far"
        );

    }
    else if(
        depth > .78
    ){

        letter.classList.add(
            "front"
        );

    }


    let width;


    if(
        depth < .25
    ){

        width =
            Math.floor(
                Math.random()
                *
                30
            )
            +
            22;

    }
    else if(
        depth > .78
    ){

        width =
            Math.floor(
                Math.random()
                *
                80
            )
            +
            55;

    }
    else{

        width =
            Math.floor(
                Math.random()
                *
                55
            )
            +
            30;

    }


    const height =
        width
        *
        1.3;


    const left =
        Math.random()
        *
        96;


    const top =
        initial
        ?
        Math.random()
        *
        115
        -
        15
        :
        -18;


    let duration;


    if(
        depth < .25
    ){

        duration =
            Math.random()
            *
            4
            +
            6;

    }
    else if(
        depth > .78
    ){

        duration =
            Math.random()
            *
            2
            +
            2.5;

    }
    else{

        duration =
            Math.random()
            *
            3
            +
            3;

    }


    const rotation =
        Math.random()
        *
        100
        -
        50;


    const scale =
        (
            Math.random()
            *
            .45
            +
            .55
        )
        .toFixed(
            2
        );


    letter.style.width =
        width
        +
        "px";


    letter.style.height =
        height
        +
        "px";


    letter.style.left =
        left
        +
        "vw";


    letter.style.top =
        top
        +
        "vh";


    letter.style.setProperty(
        "--rot",
        rotation
        +
        "deg"
    );


    letter.style.setProperty(
        "--sc",
        scale
    );


    letter.style.transform =
        `rotate(${rotation}deg) scale(${scale})`;


    letter.dataset.duration =
        duration;


    container.appendChild(
        letter
    );


    if(
        !initial
    ){

        letter.style.animation =
            `p5GlobalFall ${duration}s linear`;


        setTimeout(
            () => {

                letter.remove();

            },

            duration
            *
            1000
            +
            200
        );

    }

}

/* =========================================================
   IMPACT
========================================================= */

function triggerImpact(
    event
){

    const burst =
        document.getElementById(
            "impactBurst"
        );


    const x =
        event
        &&
        Number.isFinite(
            event.clientX
        )
        ?
        event.clientX
        :
        window.innerWidth
        /
        2;


    const y =
        event
        &&
        Number.isFinite(
            event.clientY
        )
        ?
        event.clientY
        :
        window.innerHeight
        /
        2;


    burst.style.setProperty(
        "--cx",
        x
        +
        "px"
    );


    burst.style.setProperty(
        "--cy",
        y
        +
        "px"
    );


    burst.classList.remove(
        "active"
    );


    void burst.offsetWidth;


    burst.classList.add(
        "active"
    );


    setTimeout(
        () => {

            burst.classList.remove(
                "active"
            );

        },
        800
    );

}


/* =========================================================
   SHAKE
========================================================= */

function shake(){

    document.body.classList.remove(
        "screen-shake"
    );


    void document.body.offsetWidth;


    document.body.classList.add(
        "screen-shake"
    );

}


/* =========================================================
   LAUNCH
========================================================= */

function launchPhantom(
    event
){

    if(
        launched
    ){
        return;
    }


    launched =
        true;


    const audio =
        document.getElementById(
            "audio"
        );


    const video =
        document.getElementById(
            "bgVideo"
        );


    const start =
        document.getElementById(
            "startScreen"
        );


    const canvas =
        document.getElementById(
            "canvasContainer"
        );


    const videoContainer =
        document.getElementById(
            "videoContainer"
        );


    const cutin =
        document.getElementById(
            "skillCutin"
        );


    triggerImpact(
        event
    );


    audio.volume =
        1;


    audio
        .play()
        .catch(
            () => {}
        );


    video
        .play()
        .catch(
            () => {}
        );


    start.style.pointerEvents =
        "none";


    start.style.transition =
        "transform .34s cubic-bezier(.16,1,.3,1), filter .34s ease";


    start.style.transform =
        "scale(1.12)";


    start.style.filter =
        "contrast(1.25) brightness(1.18)";


    /* =====================================================
       STEP 1
       CUTIN ENTER
    ===================================================== */

    cutin.classList.add(
        "active",
        "enter"
    );


    shake();


    /* =====================================================
       STEP 2
       MAIN STARTS BEHIND
    ===================================================== */

    setTimeout(
        () => {

            start.style.display =
                "none";


            canvas.style.display =
                "block";


            videoContainer.style.display =
                "flex";


            document.body.style.backgroundColor =
                "#dc0000";


            const letters =
                document.querySelectorAll(
                    ".falling-letter"
                );


            letters.forEach(
                letter => {

                    const duration =
                        letter.dataset.duration;


                    letter.style.animation =
                        `p5GlobalFall ${duration}s linear infinite`;

                }
            );

        },
        520
    );


    /* =====================================================
       STEP 3
       MASK ONLY
       沒有任何橫線
    ===================================================== */

    const maskStart =
        isMobile()
        ?
        720
        :
        690;


    setTimeout(
        () => {

            cutin.classList.add(
                "throw-mask"
            );

        },
        maskStart
    );


    setTimeout(
        () => {

            shake();

        },

        maskStart
        +
        850
    );


    /* =====================================================
       STEP 4
       MASK 完全飛出去
       稍微停一下
    ===================================================== */

    const maskDuration =
        isMobile()
        ?
        1520
        :
        1820;


    const tearStart =
        maskStart
        +
        maskDuration
        +
        120;


    /* =====================================================
       STEP 5
       直接撕開
    ===================================================== */

    setTimeout(
        () => {

            cutin.classList.remove(
                "enter"
            );


            cutin.classList.add(
                "tear"
            );


            shake();

        },
        tearStart
    );


    /* =====================================================
       STEP 6
       END
    ===================================================== */

    setTimeout(
        () => {

            cutin.classList.remove(
                "active",
                "tear",
                "throw-mask"
            );


            document.body.classList.remove(
                "screen-shake"
            );

        },

        isMobile()
        ?
        4200
        :
        3950
    );


    /* =====================================================
       CONTINUOUS EFFECTS
    ===================================================== */

    const mobile =
        isMobile();


    cardInterval =
        setInterval(
            supplementLetter,

            mobile
            ?
            105
            :
            80
        );


    paperInterval =
        setInterval(
            supplementPaper,

            mobile
            ?
            210
            :
            160
        );


    speedInterval =
        setInterval(
            supplementSpeedLine,

            mobile
            ?
            280
            :
            220
        );


    inkInterval =
        setInterval(
            supplementInkSplatter,

            mobile
            ?
            700
            :
            500
        );


    slashInterval =
        setInterval(
            supplementSlash,

            mobile
            ?
            1200
            :
            900
        );

}
