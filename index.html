<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Take Your Heart</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body, html { width: 100%; height: 100%; background-color: #0b0b0b; font-family: 'Impact', 'Arial Black', sans-serif; overflow: hidden; position: relative; }

/* 第一幕：點擊解鎖介面 */
#startScreen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-color: #0d0d0d; display: flex; flex-direction: column;
    justify-content: center; align-items: center; z-index: 10000; cursor: pointer;
}
.joker-mask-img {
    width: 140px; height: auto; object-fit: contain;
    filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4)); animation: pulse 1.5s infinite;
}
.p5-box { margin-top: 45px; background: #fff; color: #000; padding: 10px 25px; font-size: 32px; font-weight: 900; letter-spacing: 2px; transform: rotate(-4deg) skewX(-10deg); box-shadow: 8px 8px 0 #dc0000; border: 3px solid #000; }
.p5-box span { display: inline-block; background: #000; color: #fff; padding: 2px 8px; margin: 0 2px; transform: rotate(6deg); }
.sub-txt { margin-top: 35px; color: #dc0000; font-size: 13px; font-weight: bold; letter-spacing: 4px; text-transform: uppercase; animation: blink 1.2s infinite; }

/* 🔴 2. 背景最底層：真正的【地獄級滿版密密麻麻層】（z-index: 10） */
#canvasContainer {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; overflow: hidden; background: #0b0b0b;
}
.falling-letter {
    position: absolute; 
    background-image: url('cover.png'); 
    background-size: contain; 
    background-repeat: no-repeat;
    opacity: 0.38; 
    pointer-events: none;
}

/* 🔴 3. 前景最前方：字幕小動畫影片（z-index: 999，精緻完美比例） */
#videoContainer {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999; 
    justify-content: center; align-items: center; pointer-events: none;
}
#bgVideo {
    max-width: 88vw; max-height: 80vh; object-fit: contain;
    filter: drop-shadow(0 0 35px rgba(0,0,0,0.95));
    animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

/* 斬擊轉場層 */
#flashOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; animation: flashEffect 0.35s ease-out; }

/* 🔴 狂暴流動動畫：從他們各自隨機分配好的原位，同時向下奔跑 */
@keyframes p5GlobalFall {
    0% { transform: translateY(0) rotate(var(--rot)) scale(var(--sc)); }
    100% { transform: translateY(115vh) rotate(calc(var(--rot) + 120deg)) scale(var(--sc)); }
}

@keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
@keyframes flashEffect { 0% { background: #fff; opacity: 1; } 25% { background: #dc0000; opacity: 1; } 50% { background: #fff; opacity: 1; } 75% { background: #000; opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
    <audio id="audio" src="music.mp3" loop preload="auto"></audio>
    
    <!-- 第一幕：Joker面具開場 -->
    <div id="startScreen" onclick="launchPhantom()">
        <img src="joker-mask.png" class="joker-mask-img" alt="Joker Mask">
        <div class="p5-box">TAKE <span>YOUR</span> HEART</div>
        <div class="sub-txt">CLICK TO OPEN THE ALERT LETTER</div>
    </div>
    
    <div id="flashOverlay"></div>
    
    <!-- 後方最底層：地獄級密密麻麻流動瀑布 -->
    <div id="canvasContainer"></div>
    
    <!-- 前方最上層：字幕小動畫影片 -->
    <div id="videoContainer">
        <video id="bgVideo" src="bg-animation.mp4" loop muted playsinline preload="auto"></video>
    </div>

    <script>
    // 💡 網頁一載入，立刻強制將上百張預告信「均勻、隨機、散落」在全螢幕所有坐標！
    window.addEventListener('DOMContentLoaded', () => {
        buildRealDenseWaterfall();
    });

    function buildRealDenseWaterfall() {
        const container = document.getElementById('canvasContainer');
        const count = 75; // 💡 75張隨機均勻分布，視覺效果最密集且不卡頓
        
        for (let i = 0; i < count; i++) {
            const letter = document.createElement('div');
            letter.className = 'falling-letter';
            
            const sizeWidth = Math.floor(Math.random() * 45) + 35; // 35px - 80px
            const sizeHeight = sizeWidth * 1.3;
            
            // 💡 絕殺微調：讓圖片在寬度（left）和高度（top）上完全徹底打散，消滅重疊！
            const left = Math.random() * 92; 
            const top = Math.floor(Math.random() * 110) - 15; // 從螢幕頂部一直到最底部全部塞滿
            
            const duration = Math.random() * 2 + 3; // 3s - 5s
            const rotation = Math.random() * 80 - 40;
            const scale = (Math.random() * 0.35 + 0.45).toFixed(2);
            
            letter.style.width = sizeWidth + 'px';
            letter.style.height = sizeHeight + 'px';
            letter.style.left = left + 'vw';
            letter.style.top = top + 'vh'; // 💡 死死釘在全螢幕的各個角落
            
            letter.style.setProperty('--rot', rotation + 'deg');
            letter.style.setProperty('--sc', scale);
            
            // 點擊前的初始定位
            letter.style.transform = `rotate(${rotation}deg) scale(${scale})`;
            
            // 存入動畫時間
            letter.dataset.duration = duration + 's';
            
            container.appendChild(letter);
        }
    }

    function launchPhantom() {
        const audio = document.getElementById('audio');
        const video = document.getElementById('bgVideo');
        const startScreen = document.getElementById('startScreen');
        const flashOverlay = document.getElementById('flashOverlay');
        const canvasContainer = document.getElementById('canvasContainer');
        const videoContainer = document.getElementById('videoContainer');
        
        audio.play().catch(e => { console.log(e); });
        video.play().catch(e => { console.log(e); });
        flashOverlay.style.display = 'block';
        
        setTimeout(() => {
            startScreen.style.display = 'none';
            canvasContainer.style.display = 'block'; 
            videoContainer.style.display = 'flex';    
            
            // 🎬 啟動狂暴流動：散落在全螢幕各個角落的 75 張圖同時起跑，無限循環！
            const letters = document.querySelectorAll('.falling-letter');
            letters.forEach(letter => {
                letter.style.animation = `p5GlobalFall ${letter.dataset.duration} linear infinite`;
            });
            
            // 頂部源源不絕持續高頻率補充
            setInterval(supplementLetter, 100);
        }, 120);
        
        setTimeout(() => {
            flashOverlay.style.display = 'none';
        }, 350);
    }

    function supplementLetter() {
        const container = document.getElementById('canvasContainer');
        if (container.children.length > 120) return;
        
        const letter = document.createElement('div');
        letter.className = 'falling-letter';
        const sizeWidth = Math.floor(Math.random() * 45) + 35;
        const sizeHeight = sizeWidth * 1.3;
        const left = Math.random() * 92;
        const duration = Math.random() * 2 + 3;
        const rotation = Math.random() * 80 - 40;
        const scale = (Math.random() * 0.35 + 0.45).toFixed(2);
        
        letter.style.width = sizeWidth + 'px';
        letter.style.height = sizeHeight + 'px';
        letter.style.left = left + 'vw';
        letter.style.top = '-15vh'; // 從頂部外面進場補位
        
        letter.style.setProperty('--rot', rotation + 'deg');
        letter.style.setProperty('--sc', scale);
        
        letter.style.animation = `p5GlobalFall ${duration} linear infinite`;
        container.appendChild(letter);
        
        setTimeout(() => { letter.remove(); }, duration * 1000);
    }
    </script>
</body>
</html>
