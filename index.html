<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no,
    viewport-fit=cover"
>
<title>Take Your Heart</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    background: #0b0b0b;
    overflow: hidden;
    position: relative;
    font-family:
        Impact,
        "Arial Black",
        Arial,
        sans-serif;
}

/* =========================================================
   START SCREEN
========================================================= */
#startScreen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;

    background:
        radial-gradient(
            circle at center,
            #171717 0%,
            #0d0d0d 45%,
            #050505 100%
        );

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    z-index: 10000;
    cursor: pointer;
    overflow: hidden;
}

/* =========================================================
   開場背景斜切裝飾
========================================================= */
.start-slash {
    position: absolute;
    pointer-events: none;

    transform:
        rotate(-12deg)
        skewX(-25deg);
}

.start-slash.one {
    width: 120vw;
    height: 25px;
    top: 18%;
    left: -20%;
    background: #dc0000;
    opacity: .85;
}

.start-slash.two {
    width: 80vw;
    height: 12px;
    top: 27%;
    right: -20%;
    background: #fff;
    opacity: .75;
}

.start-slash.three {
    width: 100vw;
    height: 8px;
    bottom: 19%;
    left: -10%;
    background: #dc0000;
    opacity: .7;
}

.start-slash.four {
    width: 55vw;
    height: 35px;
    bottom: 27%;
    right: -10%;
    background: #000;
    opacity: .9;
}

/* =========================================================
   JOKER MASK
========================================================= */
.joker-mask-img {
    position: relative;
    z-index: 5;

    width: 140px;
    height: auto;

    object-fit: contain;

    filter:
        drop-shadow(
            0 0 10px
            rgba(255,255,255,.45)
        )
        drop-shadow(
            8px 8px 0
            rgba(220,0,0,.45)
        );

    animation:
        maskPulse
        1.5s
        ease-in-out
        infinite;
}

/* =========================================================
   P5R ROYAL STYLE
   GOLD TAKE YOUR HEART
========================================================= */
.royal-logo {
    position: relative;
    z-index: 6;

    width: 430px;
    height: 190px;

    margin-top: 42px;

    transform:
        rotate(-7deg)
        skewX(-8deg);

    user-select: none;

    filter:
        drop-shadow(
            9px 10px 0 #000
        )
        drop-shadow(
            13px 13px 0 #dc0000
        );
}
.take-your-heart-img {
    width: 430px;
    max-width: 85vw;
    height: auto;
    display: block;
}
/* =========================================================
   開場頁面：使用 PNG Logo
   僅作用於 #startScreen，不影響動畫頁面
========================================================= */



/* =========================================================
   GOLD LETTER BASE
========================================================= */
.royal-take,
.royal-your,



/* =========================================================
   背景主容器
========================================================= */
#canvasContainer {

    display: none;

    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 10;

    overflow: hidden;

    background: #0b0b0b;
}

.bg-red-active {
    background-color:
        #dc0000 !important;
}

/* =========================================================
   預告信 / CALLING CARD
========================================================= */
.falling-letter {

    position: absolute;

    background-image:
        url("cover.png");

    background-size: contain;

    background-repeat: no-repeat;

    pointer-events: none;

    will-change: transform;

    opacity: .42;

    z-index: 10;
}

.falling-letter.far {

    opacity: .17;

    filter:
        blur(.4px);
}

.falling-letter.front {

    opacity: .67;

    z-index: 16;

    filter:
        drop-shadow(
            0 5px 5px
            rgba(0,0,0,.4)
        );
}

/* =========================================================
   巨型預告文字
========================================================= */
.p5-word {

    position: absolute;

    font-family:
        Impact,
        "Arial Black",
        sans-serif;

    font-weight: 900;

    white-space: nowrap;

    pointer-events: none;
    user-select: none;

    letter-spacing: 3px;

    color:
        rgba(0,0,0,.19);

    z-index: 11;

    transform:
        rotate(var(--rotation));

    animation:
        wordFloat
        var(--duration)
        ease-in-out
        infinite;
}

.p5-word.white {

    color:
        rgba(255,255,255,.18);
}

.p5-word.red {

    color:
        rgba(255,255,255,.30);

    text-shadow:
        5px 5px 0
        rgba(0,0,0,.3);
}

/* =========================================================
   P5 斜切塊
========================================================= */
.p5-slash {

    position: absolute;

    pointer-events: none;

    transform:
        skewX(-25deg)
        rotate(-8deg);

    z-index: 13;

    opacity: .7;

    animation:
        slashFloat
        var(--duration)
        ease-in-out
        infinite;
}

.p5-slash.black {
    background: #050505;
}

.p5-slash.white {
    background: #fff;
}

.p5-slash.red {
    background: #dc0000;
}

/* =========================================================
   SPEED LINE
========================================================= */
.speed-line {

    position: absolute;

    height: 4px;

    background: #050505;

    pointer-events: none;

    z-index: 15;

    transform:
        rotate(var(--angle));

    animation:
        speedMove
        var(--duration)
        linear
        infinite;
}

.speed-line.white {
    background: #fff;
}

/* =========================================================
   紙張碎片
========================================================= */
.paper-fragment {

    position: absolute;

    pointer-events: none;

    z-index: 14;

    background: #fff;

    transform:
        rotate(var(--rotation));

    animation:
        paperFall
        var(--duration)
        linear
        infinite;
}

.paper-fragment.black {
    background: #080808;
}

.paper-fragment.red {
    background: #dc0000;
}

/* =========================================================
   紙條
========================================================= */
.paper-strip {

    position: absolute;

    pointer-events: none;

    z-index: 12;

    background:
        rgba(255,255,255,.75);

    transform:
        rotate(var(--rotation))
        skewX(-25deg);

    animation:
        stripMove
        var(--duration)
        ease-in-out
        infinite;
}

.paper-strip.black {

    background:
        rgba(0,0,0,.55);
}

/* =========================================================
   VIDEO
   原尺寸保持不動
========================================================= */
#videoContainer {

    display: none;

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 999;

    justify-content: center;
    align-items: center;

    pointer-events: none;
}

#bgVideo {

    max-width: 88vw;
    max-height: 80vh;

    object-fit: contain;

    filter:
        drop-shadow(
            0 0 45px
            rgba(0,0,0,.95)
        );

    animation:
        popIn
        .35s
        cubic-bezier(
            .175,
            .885,
            .32,
            1.275
        )
        forwards;
}

/* =========================================================
   FLASH
========================================================= */
#flashOverlay {

    display: none;

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 99999;
}

.flash-animate {

    display: block !important;

    animation:
        flashEffect
        .35s
        ease-out
        forwards;
}

/* =========================================================
   ANIMATIONS
========================================================= */
@keyframes maskPulse {

    0% {
        transform:
            scale(1)
            rotate(0deg);
    }

    50% {
        transform:
            scale(1.045)
            rotate(-1deg);
    }

    100% {
        transform:
            scale(1)
            rotate(0deg);
    }
}

@keyframes p5GlobalFall {

    0% {
        transform:
            translateY(0)
            rotate(var(--rot))
            scale(var(--sc));
    }

    100% {
        transform:
            translateY(120vh)
            rotate(
                calc(
                    var(--rot) + 120deg
                )
            )
            scale(var(--sc));
    }
}

@keyframes wordFloat {

    0% {
        transform:
            translateY(0)
            rotate(var(--rotation));
    }

    50% {
        transform:
            translateY(-15px)
            rotate(var(--rotation));
    }

    100% {
        transform:
            translateY(0)
            rotate(var(--rotation));
    }
}

@keyframes slashFloat {

    0% {
        transform:
            translateX(-20px)
            skewX(-25deg)
            rotate(-8deg);
    }

    50% {
        transform:
            translateX(20px)
            skewX(-25deg)
            rotate(-8deg);
    }

    100% {
        transform:
            translateX(-20px)
            skewX(-25deg)
            rotate(-8deg);
    }
}

@keyframes speedMove {

    0% {
        transform:
            translateX(-35vw)
            rotate(var(--angle));
    }

    100% {
        transform:
            translateX(140vw)
            rotate(var(--angle));
    }
}

@keyframes paperFall {

    0% {
        transform:
            translateY(-20vh)
            translateX(0)
            rotate(var(--rotation));
    }

    50% {
        transform:
            translateY(50vh)
            translateX(30px)
            rotate(
                calc(
                    var(--rotation) + 120deg
                )
            );
    }

    100% {
        transform:
            translateY(120vh)
            translateX(-30px)
            rotate(
                calc(
                    var(--rotation) + 300deg
                )
            );
    }
}

@keyframes stripMove {

    0% {
        transform:
            translateX(-20px)
            rotate(var(--rotation))
            skewX(-25deg);
    }

    50% {
        transform:
            translateX(30px)
            rotate(var(--rotation))
            skewX(-25deg);
    }

    100% {
        transform:
            translateX(-20px)
            rotate(var(--rotation))
            skewX(-25deg);
    }
}

@keyframes popIn {

    0% {
        transform:
            scale(.9);

        opacity: 0;
    }

    100% {
        transform:
            scale(1);

        opacity: 1;
    }
}

@keyframes blink {

    0%,
    100% {
        opacity: .25;
    }

    50% {
        opacity: 1;
    }
}

@keyframes flashEffect {

    0% {
        background: #fff;
        opacity: 1;
    }

    25% {
        background: #dc0000;
        opacity: 1;
    }

    50% {
        background: #fff;
        opacity: 1;
    }

    75% {
        background: #000;
        opacity: 1;
    }

    100% {
        opacity: 0;
        display: none;
    }
}

/* =========================================================
   MOBILE
========================================================= */
@media (max-width: 600px) {

    .joker-mask-img {
        width: 115px;
    }

    /* Royal 金色标题 */
    .royal-logo {
        width: 330px;
        height: auto;
        margin-top: 35px;

        transform:
            scale(.82)
            rotate(-7deg)
            skewX(-8deg);
    }

    .take-your-heart-img {
        width: 330px;
        max-width: 82vw;
    }

    .royal-take {
        font-size: 62px;
    }

    .royal-your {

        top: 43px;
        left: 89px;

        font-size: 56px;
    }

    .royal-heart {

        top: 89px;
        left: 29px;

        font-size: 62px;
    }

    .sub-txt {

        font-size: 9px;

        letter-spacing: 3px;
    }

    /* 视频尺寸保持原本 */
    #bgVideo {

        max-width: 94vw;
        max-height: 72vh;
    }
}

</style>
</head>

<body>

<!-- =====================================================
     START SCREEN
===================================================== -->
<div
    id="startScreen"
    onclick="launchPhantom()">

    <!-- 背景切割 -->
    <div class="start-slash one"></div>
    <div class="start-slash two"></div>
    <div class="start-slash three"></div>
    <div class="start-slash four"></div>

    <!-- Joker -->
    <img
        src="joker-mask.png"
        class="joker-mask-img"
        alt="Joker Mask">

    <!-- P5R STYLE LOGO -->
   <div class="royal-logo">
    <img
        src="take-your-heart.png"
        class="take-your-heart-img"
        alt="TAKE YOUR HEART">
</div>
    <!-- 點擊提示 -->
    <div class="sub-txt">
        CLICK TO OPEN THE CALLING CARD
    </div>

</div>

<!-- =====================================================
     FLASH
===================================================== -->
<div id="flashOverlay"></div>

<!-- =====================================================
     BACKGROUND
===================================================== -->
<div id="canvasContainer"></div>

<!-- =====================================================
     AUDIO
===================================================== -->
<audio
    id="audio"
    src="music.mp3"
    loop
    preload="auto">
</audio>

<!-- =====================================================
     VIDEO
===================================================== -->
<div id="videoContainer">

    <video
        id="bgVideo"
        src="bg-animation.mp4"
        loop
        muted
        playsinline
        preload="auto">
    </video>

</div>

<!-- =====================================================
     JAVASCRIPT
===================================================== -->
<script>

/* =========================================================
   DOM READY
========================================================= */
window.addEventListener(
    "DOMContentLoaded",
    () => {

        buildRealDenseWaterfall();

        buildP5Elements();

    }
);

/* =========================================================
   大量預告信
========================================================= */
function buildRealDenseWaterfall() {

    const count = 220;

    for (
        let i = 0;
        i < count;
        i++
    ) {

        createCallingCard(true);

    }
}

/* =========================================================
   預告信
========================================================= */
function createCallingCard(
    initial = false
) {

    const container =
        document.getElementById(
            "canvasContainer"
        );

    const letter =
        document.createElement(
            "div"
        );

    letter.className =
        "falling-letter";

    const depth =
        Math.random();

    if (
        depth < .25
    ) {

        letter.classList.add(
            "far"
        );

    }
    else if (
        depth > .78
    ) {

        letter.classList.add(
            "front"
        );

    }

    let sizeWidth;

    if (
        depth < .25
    ) {

        sizeWidth =
            Math.floor(
                Math.random() * 30
            ) + 22;

    }
    else if (
        depth > .78
    ) {

        sizeWidth =
            Math.floor(
                Math.random() * 80
            ) + 55;

    }
    else {

        sizeWidth =
            Math.floor(
                Math.random() * 55
            ) + 30;

    }

    const sizeHeight =
        sizeWidth * 1.3;

    const left =
        Math.random() * 96;

    const top =
        initial
            ? Math.random() * 115 - 15
            : -18;

    let duration;

    if (
        depth < .25
    ) {

        duration =
            Math.random() * 4 + 6;

    }
    else if (
        depth > .78
    ) {

        duration =
            Math.random() * 2 + 2.5;

    }
    else {

        duration =
            Math.random() * 3 + 3;

    }

    const rotation =
        Math.random() * 100 - 50;

    const scale =
        (
            Math.random() * .45 + .55
        ).toFixed(2);

    letter.style.width =
        sizeWidth + "px";

    letter.style.height =
        sizeHeight + "px";

    letter.style.left =
        left + "vw";

    letter.style.top =
        top + "vh";

    letter.style.setProperty(
        "--rot",
        rotation + "deg"
    );

    letter.style.setProperty(
        "--sc",
        scale
    );

    letter.style.transform =
        `rotate(${rotation}deg)
         scale(${scale})`;

    letter.dataset.duration =
        duration;

    container.appendChild(
        letter
    );

    if (!initial) {

        letter.style.animation =
            `p5GlobalFall
             ${duration}s
             linear`;

        setTimeout(
            () => {

                letter.remove();

            },
            duration * 1000 + 200
        );

    }
}

/* =========================================================
   P5 背景
========================================================= */
function buildP5Elements() {

    const container =
        document.getElementById(
            "canvasContainer"
        );

    /* 巨型文字 */
    const words = [

        "TAKE YOUR HEART",

        "PHANTOM",

        "CALLING CARD",

        "NOTICE",

        "THE TRUTH",

        "YOUR HEART",

        "WE HAVE COME",

        "THE PHANTOM THIEVES",

        "TAKE YOUR HEART",

        "NOTICE",

        "PHANTOM"

    ];

    for (
        let i = 0;
        i < 15;
        i++
    ) {

        const word =
            document.createElement(
                "div"
            );

        word.className =
            "p5-word";

        word.textContent =
            words[
                Math.floor(
                    Math.random()
                    * words.length
                )
            ];

        const size =
            Math.floor(
                Math.random() * 75
            ) + 30;

        word.style.fontSize =
            size + "px";

        word.style.left =
            Math.random() * 100 + "vw";

        word.style.top =
            Math.random() * 105 + "vh";

        word.style.setProperty(
            "--rotation",
            (
                Math.random() * 18 - 9
            ) + "deg"
        );

        word.style.setProperty(
            "--duration",
            (
                Math.random() * 4 + 4
            ) + "s"
        );

        const type =
            Math.random();

        if (
            type < .25
        ) {

            word.classList.add(
                "white"
            );

        }
        else if (
            type < .45
        ) {

            word.classList.add(
                "red"
            );

        }

        container.appendChild(
            word
        );
    }

    /* 斜切塊 */
    for (
        let i = 0;
        i < 35;
        i++
    ) {

        createSlash();

    }

    /* 速度線 */
    for (
        let i = 0;
        i < 45;
        i++
    ) {

        createSpeedLine();

    }

    /* 紙片 */
    for (
        let i = 0;
        i < 55;
        i++
    ) {

        createPaperFragment();

    }

    /* 紙條 */
    for (
        let i = 0;
        i < 25;
        i++
    ) {

        createPaperStrip();

    }
}

/* =========================================================
   斜切塊
========================================================= */
function createSlash() {

    const container =
        document.getElementById(
            "canvasContainer"
        );

    const slash =
        document.createElement(
            "div"
        );

    slash.className =
        "p5-slash";

    const type =
        Math.random();

    if (
        type < .55
    ) {

        slash.classList.add(
            "black"
        );

    }
    else if (
        type < .78
    ) {

        slash.classList.add(
            "white"
        );

    }
    else {

        slash.classList.add(
            "red"
        );

    }

    slash.style.width =
        Math.floor(
            Math.random() * 200
        ) + 50 + "px";

    slash.style.height =
        Math.floor(
            Math.random() * 25
        ) + 5 + "px";

    slash.style.left =
        Math.random() * 110 - 5 + "vw";

    slash.style.top =
        Math.random() * 110 - 5 + "vh";

    slash.style.setProperty(
        "--duration",
        (
            Math.random() * 3 + 3
        ) + "s"
    );

    container.appendChild(
        slash
    );
}

/* =========================================================
   速度線
========================================================= */
function createSpeedLine() {

    const container =
        document.getElementById(
            "canvasContainer"
        );

    const line =
        document.createElement(
            "div"
        );

    line.className =
        "speed-line";

    if (
        Math.random() > .72
    ) {

        line.classList.add(
            "white"
        );

    }

    line.style.width =
        Math.floor(
            Math.random() * 180
        ) + 40 + "px";

    line.style.left =
        Math.random() * 100 + "vw";

    line.style.top =
        Math.random() * 100 + "vh";

    line.style.setProperty(
        "--angle",
        (
            Math.random() * 35 - 25
        ) + "deg"
    );

    line.style.setProperty(
        "--duration",
        (
            Math.random() * 1.8 + .8
        ) + "s"
    );

    line.style.animationDelay =
        (
            Math.random() * -4
        ) + "s";

    container.appendChild(
        line
    );
}

/* =========================================================
   紙片
========================================================= */
function createPaperFragment() {

    const container =
        document.getElementById(
            "canvasContainer"
        );

    const fragment =
        document.createElement(
            "div"
        );

    fragment.className =
        "paper-fragment";

    const type =
        Math.random();

    if (
        type < .55
    ) {

        fragment.classList.add(
            "black"
        );

    }
    else if (
        type < .72
    ) {

        fragment.classList.add(
            "red"
        );

    }

    fragment.style.width =
        Math.floor(
            Math.random() * 35
        ) + 8 + "px";

    fragment.style.height =
        Math.floor(
            Math.random() * 15
        ) + 4 + "px";

    fragment.style.left =
        Math.random() * 100 + "vw";

    fragment.style.top =
        Math.random() * 100 + "vh";

    fragment.style.setProperty(
        "--rotation",
        Math.random() * 180 + "deg"
    );

    fragment.style.setProperty(
        "--duration",
        (
            Math.random() * 4 + 4
        ) + "s"
    );

    fragment.style.animationDelay =
        (
            Math.random() * -8
        ) + "s";

    container.appendChild(
        fragment
    );
}

/* =========================================================
   紙條
========================================================= */
function createPaperStrip() {

    const container =
        document.getElementById(
            "canvasContainer"
        );

    const strip =
        document.createElement(
            "div"
        );

    strip.className =
        "paper-strip";

    if (
        Math.random() > .55
    ) {

        strip.classList.add(
            "black"
        );

    }

    strip.style.width =
        Math.floor(
            Math.random() * 140
        ) + 30 + "px";

    strip.style.height =
        Math.floor(
            Math.random() * 12
        ) + 4 + "px";

    strip.style.left =
        Math.random() * 110 - 5 + "vw";

    strip.style.top =
        Math.random() * 100 + "vh";

    strip.style.setProperty(
        "--rotation",
        (
            Math.random() * 40 - 20
        ) + "deg"
    );

    strip.style.setProperty(
        "--duration",
        (
            Math.random() * 4 + 3
        ) + "s"
    );

    container.appendChild(
        strip
    );
}

/* =========================================================
   啟動
========================================================= */
function launchPhantom() {

    const audio =
        document.getElementById(
            "audio"
        );

    const video =
        document.getElementById(
            "bgVideo"
        );

    const startScreen =
        document.getElementById(
            "startScreen"
        );

    const flashOverlay =
        document.getElementById(
            "flashOverlay"
        );

    const canvasContainer =
        document.getElementById(
            "canvasContainer"
        );

    const videoContainer =
        document.getElementById(
            "videoContainer"
        );

    audio
        .play()
        .catch(
            e => console.log(e)
        );

    video
        .play()
        .catch(
            e => console.log(e)
        );

    flashOverlay.classList.add(
        "flash-animate"
    );

    setTimeout(
        () => {

            startScreen.style.display =
                "none";

            document.body.style.backgroundColor =
                "#dc0000";

            canvasContainer.classList.add(
                "bg-red-active"
            );

            canvasContainer.style.display =
                "block";

            videoContainer.style.display =
                "flex";

            const letters =
                document.querySelectorAll(
                    ".falling-letter"
                );

            letters.forEach(
                letter => {

                    const duration =
                        letter.dataset.duration;

                    letter.style.animation =
                        `p5GlobalFall
                         ${duration}s
                         linear
                         infinite`;

                }
            );

        },
        120
    );

    /* 持續增加預告信 */
    setInterval(
        () => {

            supplementLetter();

        },
        80
    );

    /* 持續增加紙片 */
    setInterval(
        () => {

            supplementPaper();

        },
        180
    );

    /* 持續增加速度線 */
    setInterval(
        () => {

            supplementSpeedLine();

        },
        280
    );

    setTimeout(
        () => {

            flashOverlay.classList.remove(
                "flash-animate"
            );

        },
        400
    );
}

/* =========================================================
   補充預告信
========================================================= */
function supplementLetter() {

    const container =
        document.getElementById(
            "canvasContainer"
        );

    const cards =
        container.querySelectorAll(
            ".falling-letter"
        );

    if (
        cards.length > 300
    ) {

        return;

    }

    createCallingCard(false);
}

/* =========================================================
   補充紙片
========================================================= */
function supplementPaper() {

    const container =
        document.getElementById(
            "canvasContainer"
        );

    const fragment =
        document.createElement(
            "div"
        );

    fragment.className =
        "paper-fragment";

    const type =
        Math.random();

    if (
        type < .5
    ) {

        fragment.classList.add(
            "black"
        );

    }
    else if (
        type < .7
    ) {

        fragment.classList.add(
            "red"
        );

    }

    fragment.style.width =
        Math.floor(
            Math.random() * 35
        ) + 8 + "px";

    fragment.style.height =
        Math.floor(
            Math.random() * 14
        ) + 4 + "px";

    fragment.style.left =
        Math.random() * 100 + "vw";

    fragment.style.top =
        "-10vh";

    fragment.style.setProperty(
        "--rotation",
        Math.random() * 180 + "deg"
    );

    const duration =
        Math.random() * 4 + 4;

    fragment.style.setProperty(
        "--duration",
        duration + "s"
    );

    fragment.style.animation =
        `paperFall
         ${duration}s
         linear`;

    container.appendChild(
        fragment
    );

    setTimeout(
        () => {

            fragment.remove();

        },
        duration * 1000 + 300
    );
}

/* =========================================================
   補充速度線
========================================================= */
function supplementSpeedLine() {

    const container =
        document.getElementById(
            "canvasContainer"
        );

    const line =
        document.createElement(
            "div"
        );

    line.className =
        "speed-line";

    if (
        Math.random() > .7
    ) {

        line.classList.add(
            "white"
        );

    }

    line.style.width =
        Math.floor(
            Math.random() * 180
        ) + 40 + "px";

    line.style.left =
        "-20vw";

    line.style.top =
        Math.random() * 100 + "vh";

    line.style.setProperty(
        "--angle",
        (
            Math.random() * 35 - 25
        ) + "deg"
    );

    const duration =
        Math.random() * 1.5 + .8;

    line.style.setProperty(
        "--duration",
        duration + "s"
    );

    line.style.animation =
        `speedMove
         ${duration}s
         linear`;

    container.appendChild(
        line
    );

    setTimeout(
        () => {

            line.remove();

        },
        duration * 1000 + 300
    );
}

</script>

</body>
</html>
